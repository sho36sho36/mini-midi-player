<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BlackMIDI Player Lite</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: #eee;
    font-family:
        "Segoe UI",
        "Yu Gothic UI",
        Meiryo,
        sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

header {
    height: 54px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 8px 12px;

    background: #111;
    border-bottom: 1px solid #292929;
}

button,
input,
select {
    font: inherit;
}

button {
    border: 1px solid #333;
    background: #1b1b1b;
    color: #eee;

    border-radius: 5px;
    padding: 7px 12px;

    cursor: pointer;
}

button:hover {
    background: #292929;
}

button:active {
    background: #333;
}

button:disabled {
    opacity: .4;
    cursor: default;
}

#file {
    display: none;
}

.fileButton {
    background: #202020;
}

/* =========================
   MAIN
========================= */

#main {
    position: relative;
    flex: 1;
    min-height: 0;
}

#canvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;

    background: #050505;
}

/* =========================
   BOTTOM CONTROL
========================= */

#bottom {
    height: 72px;
    flex-shrink: 0;

    padding: 8px 12px;

    background: #101010;
    border-top: 1px solid #292929;

    display: flex;
    flex-direction: column;
    gap: 6px;
}

#seek {
    width: 100%;
    height: 5px;

    appearance: none;
    background: #333;
    border-radius: 5px;
}

#seek::-webkit-slider-thumb {
    appearance: none;

    width: 12px;
    height: 12px;

    border-radius: 50%;
    background: #ddd;

    cursor: pointer;
}

#controls {
    display: flex;
    align-items: center;
    gap: 8px;

    min-width: 0;
}

#time {
    min-width: 125px;
    font-family: monospace;
    font-size: 13px;
}

#status {
    flex: 1;

    min-width: 0;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    color: #aaa;
    font-size: 12px;
}

.controlGroup {
    display: flex;
    align-items: center;
    gap: 5px;

    font-size: 12px;
    color: #aaa;
}

.controlGroup input {
    width: 90px;
}

#speed {
    width: 80px;
}

/* =========================
   INFO
========================= */

#info {
    position: absolute;
    top: 10px;
    left: 10px;

    padding: 7px 10px;

    background: rgba(0, 0, 0, .65);
    border: 1px solid rgba(255, 255, 255, .08);

    border-radius: 5px;

    font-size: 12px;
    color: #bbb;

    pointer-events: none;
}
</style>
</head>

<body>

<header>

    <label class="fileButton button">
        MIDIを開く
        <input id="file" type="file" accept=".mid,.midi">
    </label>

    <button id="play" disabled>▶ 再生</button>
    <button id="stop" disabled>■ 停止</button>

    <button id="loop">🔁 ループ OFF</button>

</header>

<div id="main">

    <canvas id="canvas"></canvas>

    <div id="info">
        MIDIファイルを開いてください
    </div>

</div>

<div id="bottom">

    <input
        id="seek"
        type="range"
        min="0"
        max="1"
        value="0"
        step="0.001"
        disabled
    >

    <div id="controls">

        <div id="time">
            00:00 / 00:00
        </div>

        <div class="controlGroup">
            音量
            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.65"
            >
        </div>

        <div class="controlGroup">
            速度
            <input
                id="speed"
                type="range"
                min="0.25"
                max="2"
                step="0.05"
                value="1"
            >
            <span id="speedText">1.00x</span>
        </div>

        <div id="status">
            待機中
        </div>

    </div>

</div>

<script>

/* =========================================================
   BlackMIDI Player Lite
   =========================================================

   軽量化ポイント

   ・ノートごとの setTimeout を作らない
   ・巨大配列への spread を使わない
   ・ポリフォニー計算をしない
   ・音声は最大64音
   ・AudioNodeを使い終わったら即解放
   ・描画は約30FPS
   ・音声スケジューラは25ms周期
   ・大量ノーツでもUI処理をできるだけ抑える

========================================================= */


/* =========================================================
   DOM
========================================================= */

const fileInput = document.getElementById("file");
const playButton = document.getElementById("play");
const stopButton = document.getElementById("stop");
const loopButton = document.getElementById("loop");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

const seek = document.getElementById("seek");

const volumeSlider = document.getElementById("volume");
const speedSlider = document.getElementById("speed");
const speedText = document.getElementById("speedText");

const timeLabel = document.getElementById("time");
const statusLabel = document.getElementById("status");
const infoLabel = document.getElementById("info");


/* =========================================================
   Canvas
========================================================= */

let canvasWidth = 0;
let canvasHeight = 0;
let dpr = 1;

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    canvasWidth = Math.max(1, rect.width);
    canvasHeight = Math.max(1, rect.height);

    /*
        BlackMIDIでは高DPI化しすぎると
        描画コストが急増するので最大2倍。
    */

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(canvasWidth * dpr);
    canvas.height = Math.floor(canvasHeight * dpr);

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


/* =========================================================
   MIDI DATA
========================================================= */

let midi = null;

let notes = [];

let duration = 0;

let loaded = false;

let playing = false;

let looping = false;

let playbackPosition = 0;

let startAudioTime = 0;

let pausedPosition = 0;

let playbackSpeed = 1;


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

let masterGain = null;

let compressor = null;


/*
    BlackMIDIでは何千・何万音が
    短時間に来る可能性がある。

    無制限にAudioNodeを作ると
    ブラウザが音を止める。

    そこで最大64音。
*/

const MAX_VOICES = 64;

let voices = [];


/* =========================================================
   AUDIO INITIALIZE
========================================================= */

function initAudio() {

    if (audioContext) {
        return;
    }

    audioContext = new (
        window.AudioContext ||
        window.webkitAudioContext
    )();

    compressor = audioContext.createDynamicsCompressor();

    compressor.threshold.value = -18;
    compressor.knee.value = 12;
    compressor.ratio.value = 4;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.15;

    masterGain = audioContext.createGain();

    masterGain.gain.value =
        Number(volumeSlider.value);

    masterGain.connect(compressor);

    compressor.connect(audioContext.destination);
}


/* =========================================================
   MIDI PARSER
========================================================= */

function readString(bytes, start, length) {

    let result = "";

    const end = Math.min(
        bytes.length,
        start + length
    );

    for (let i = start; i < end; i++) {

        const c = bytes[i];

        if (c >= 32 && c <= 126) {
            result += String.fromCharCode(c);
        }
    }

    return result;
}


function readVLQ(view, position) {

    let value = 0;
    let count = 0;

    while (position < view.byteLength) {

        const b = view.getUint8(position++);

        value =
            (value << 7) |
            (b & 0x7f);

        count++;

        if (!(b & 0x80)) {
            break;
        }

        /*
            壊れたMIDI対策
        */

        if (count > 4) {
            break;
        }
    }

    return {
        value,
        position
    };
}


/* =========================================================
   MIDI PARSE
========================================================= */

function parseMIDI(buffer) {

    const view = new DataView(buffer);

    if (view.byteLength < 14) {
        throw new Error("MIDIファイルが短すぎます。");
    }

    const bytes = new Uint8Array(buffer);

    const header =
        readString(bytes, 0, 4);

    if (header !== "MThd") {
        throw new Error("MIDIファイルではありません。");
    }

    const headerLength =
        view.getUint32(4, false);

    const format =
        view.getUint16(8, false);

    const trackCount =
        view.getUint16(10, false);

    const division =
        view.getUint16(12, false);

    if (division & 0x8000) {
        throw new Error(
            "SMPTEタイムコード形式には未対応です。"
        );
    }

    const ticksPerQuarter = division;

    const tempoEvents = [];

    const rawNotes = [];

    let offset = 8 + headerLength;

    let globalMaxTick = 0;

    let trackNames = [];

    /*
        チャンネルごとの現在プログラム
    */

    const programs = new Uint8Array(16);

    for (let t = 0; t < 16; t++) {
        programs[t] = 0;
    }


    /* ============================================
       TRACKS
    ============================================ */

    for (
        let trackIndex = 0;
        trackIndex < trackCount;
        trackIndex++
    ) {

        if (offset + 8 > view.byteLength) {
            break;
        }

        const trackHeader =
            readString(bytes, offset, 4);

        const trackLength =
            view.getUint32(offset + 4, false);

        offset += 8;

        if (trackHeader !== "MTrk") {
            offset += trackLength;
            continue;
        }

        const trackEnd =
            Math.min(
                offset + trackLength,
                view.byteLength
            );

        let tick = 0;

        let runningStatus = 0;

        /*
            同じノート番号が重なる場合があるので
            スタック方式にする。

            key = channel * 128 + note
        */

        const active = new Map();

        while (offset < trackEnd) {

            const deltaInfo =
                readVLQ(view, offset);

            const delta =
                deltaInfo.value;

            offset =
                deltaInfo.position;

            tick += delta;

            if (tick > globalMaxTick) {
                globalMaxTick = tick;
            }

            if (offset >= trackEnd) {
                break;
            }

            let status =
                view.getUint8(offset);

            if (status < 0x80) {

                /*
                    running status
                */

                if (!runningStatus) {
                    offset++;
                    continue;
                }

                status = runningStatus;

            } else {

                offset++;

                if (
                    status >= 0x80 &&
                    status < 0xf0
                ) {
                    runningStatus = status;
                }
            }


            /* =====================================
               META
            ===================================== */

            if (status === 0xff) {

                if (offset >= trackEnd) {
                    break;
                }

                const type =
                    view.getUint8(offset++);

                const lenInfo =
                    readVLQ(view, offset);

                const len =
                    lenInfo.value;

                offset =
                    lenInfo.position;

                const end =
                    Math.min(
                        offset + len,
                        trackEnd
                    );

                if (type === 0x51 && len >= 3) {

                    const tempo =
                        (
                            view.getUint8(offset) << 16
                        ) |
                            (
                                view.getUint8(offset + 1) << 8
                            ) |
                            view.getUint8(offset + 2);

                    if (tempo > 0) {

                        tempoEvents.push({
                            tick,
                            tempo
                        });
                    }
                }

                if (
                    type === 0x03 ||
                    type === 0x01
                ) {

                    const text =
                        readString(
                            bytes,
                            offset,
                            Math.min(
                                len,
                                100
                            )
                        );

                    if (text) {
                        trackNames.push(text);
                    }
                }

                offset = end;

                continue;
            }


            /* =====================================
               SYSEX
            ===================================== */

            if (
                status === 0xf0 ||
                status === 0xf7
            ) {

                const lenInfo =
                    readVLQ(view, offset);

                offset =
                    Math.min(
                        lenInfo.position +
                        lenInfo.value,
                        trackEnd
                    );

                continue;
            }


            /* =====================================
               MIDI CHANNEL MESSAGE
            ===================================== */

            if (
                status < 0x80 ||
                status > 0xef
            ) {
                continue;
            }

            const command =
                status & 0xf0;

            const channel =
                status & 0x0f;


            /* =====================================
               PROGRAM CHANGE
            ===================================== */

            if (command === 0xc0) {

                if (offset < trackEnd) {

                    programs[channel] =
                        view.getUint8(offset++);
                }

                continue;
            }


            /* =====================================
               CHANNEL PRESSURE
            ===================================== */

            if (command === 0xd0) {

                if (offset < trackEnd) {
                    offset++;
                }

                continue;
            }


            /* =====================================
               2 BYTE MESSAGE
            ===================================== */

            if (offset + 1 >= trackEnd) {
                break;
            }

            const a =
                view.getUint8(offset++);

            const b =
                view.getUint8(offset++);


            /* =====================================
               NOTE ON
            ===================================== */

            if (
                command === 0x90 &&
                b !== 0
            ) {

                const key =
                    channel * 128 + a;

                const item = {
                    tick,
                    endTick: tick,
                    note: a,
                    velocity: b,
                    channel,
                    program: programs[channel]
                };

                let stack =
                    active.get(key);

                if (!stack) {

                    stack = [];

                    active.set(
                        key,
                        stack
                    );
                }

                stack.push(item);

                rawNotes.push(item);

                continue;
            }


            /* =====================================
               NOTE OFF
            ===================================== */

            if (
                command === 0x80 ||
                (
                    command === 0x90 &&
                    b === 0
                )
            ) {

                const key =
                    channel * 128 + a;

                const stack =
                    active.get(key);

                if (
                    stack &&
                    stack.length
                ) {

                    /*
                        最後に開始したノートを終了
                    */

                    const item =
                        stack.pop();

                    item.endTick = tick;
                }

                continue;
            }

            /*
                CC / Pitch Bend等は
                再生音源側で簡易処理するため
                ここでは巨大なイベント配列を
                作らない。
            */
        }

        offset = trackEnd;
    }


    /* ============================================
       TEMPO MAP
    ============================================ */

    tempoEvents.sort(
        (a, b) => a.tick - b.tick
    );

    if (
        tempoEvents.length === 0 ||
        tempoEvents[0].tick > 0
    ) {

        tempoEvents.unshift({
            tick: 0,
            tempo: 500000
        });
    }


    /*
        同じtickのtempoをまとめる
    */

    const tempoMap = [];

    for (
        let i = 0;
        i < tempoEvents.length;
        i++
    ) {

        const e =
            tempoEvents[i];

        if (
            tempoMap.length &&
            tempoMap[
                tempoMap.length - 1
            ].tick === e.tick
        ) {

            tempoMap[
                tempoMap.length - 1
            ].tempo = e.tempo;

        } else {

            tempoMap.push({
                tick: e.tick,
                tempo: e.tempo,
                time: 0
            });
        }
    }


    /* ============================================
       TEMPO -> TIME
    ============================================ */

    let currentTime = 0;

    for (
        let i = 0;
        i < tempoMap.length;
        i++
    ) {

        const current =
            tempoMap[i];

        current.time =
            currentTime;

        if (
            i + 1 <
            tempoMap.length
        ) {

            const next =
                tempoMap[i + 1];

            const deltaTicks =
                next.tick -
                current.tick;

            currentTime +=
                deltaTicks *
                current.tempo /
                1000000 /
                ticksPerQuarter;
        }
    }


    /*
        tick -> second

        tempoMapは二分探索。
    */

    function tickToSeconds(tick) {

        let low = 0;
        let high =
            tempoMap.length - 1;

        while (low < high) {

            const mid =
                (low + high + 1) >> 1;

            if (
                tempoMap[mid].tick <= tick
            ) {

                low = mid;

            } else {

                high = mid - 1;
            }
        }

        const tempo =
            tempoMap[low];

        return (
            tempo.time +
            (
                tick - tempo.tick
            ) *
            tempo.tempo /
            1000000 /
            ticksPerQuarter
        );
    }


    /* ============================================
       NOTE TIME
    ============================================ */

    /*
        ここでは spreadを使わない。
    */

    let maxEndTime = 0;

    for (
        let i = 0;
        i < rawNotes.length;
        i++
    ) {

        const n =
            rawNotes[i];

        n.time =
            tickToSeconds(n.tick);

        n.endTime =
            tickToSeconds(n.endTick);

        if (
            n.endTime <= n.time
        ) {

            /*
                BlackMIDIの極端に短いノート用
            */

            n.endTime =
                n.time + 0.005;
        }

        n.duration =
            n.endTime - n.time;

        if (
            n.endTime >
            maxEndTime
        ) {

            maxEndTime =
                n.endTime;
        }
    }


    /*
        時間順に並べる
    */

    rawNotes.sort(
        (a, b) => {

            if (a.time !== b.time) {
                return a.time - b.time;
            }

            return a.note - b.note;
        }
    );


    return {

        notes: rawNotes,

        duration:
            Math.max(
                maxEndTime,
                tickToSeconds(globalMaxTick)
            ),

        tempoMap,

        ticksPerQuarter,

        format,

        trackCount,

        trackNames
    };
}


/* =========================================================
   LOAD MIDI
========================================================= */

fileInput.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file) {
            return;
        }

        stopPlayback();

        loaded = false;

        statusLabel.textContent =
            "読み込み中...";

        infoLabel.textContent =
            "MIDIを解析しています...";

        try {

            /*
                arrayBuffer取得
            */

            const buffer =
                await file.arrayBuffer();

            /*
                ブラウザを固めすぎないため
                大きなファイルでも一度UIへ戻す。
            */

            await new Promise(
                resolve =>
                    setTimeout(resolve, 0)
            );

            midi =
                parseMIDI(buffer);

            notes =
                midi.notes;

            duration =
                midi.duration;

            playbackPosition = 0;

            pausedPosition = 0;

            seek.max =
                duration || 1;

            seek.value = 0;

            loaded = true;

            playButton.disabled = false;
            stopButton.disabled = false;
            seek.disabled = false;

            const mb =
                (
                    file.size /
                    1024 /
                    1024
                ).toFixed(2);

            infoLabel.textContent =
                `${file.name}  /  ${notes.length.toLocaleString()} notes`;

            statusLabel.textContent =
                `読み込み完了  ${notes.length.toLocaleString()} notes`;

            timeLabel.textContent =
                `00:00 / ${formatTime(duration)}`;

            /*
                BlackMIDI向け。
                最初の描画だけ行う。
            */

            draw();

        } catch (error) {

            console.error(error);

            loaded = false;

            playButton.disabled = true;
            stopButton.disabled = true;
            seek.disabled = true;

            statusLabel.textContent =
                "読み込みエラー";

            infoLabel.textContent =
                error.message ||
                "MIDIを読み込めませんでした。";

            alert(
                "MIDI読み込みエラー\n\n" +
                (
                    error.message ||
                    error
                )
            );
        }
    }
);


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        seconds = 0;
    }

    seconds =
        Math.max(0, seconds);

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    const ms =
        Math.floor(
            (seconds % 1) * 100
        );

    return (
        String(minutes).padStart(2, "0") +
        ":" +
        String(secs).padStart(2, "0") +
        "." +
        String(ms).padStart(2, "0")
    );
}


/* =========================================================
   NOTE SEARCH
========================================================= */

function lowerBound(time) {

    let low = 0;
    let high = notes.length;

    while (low < high) {

        const mid =
            (low + high) >> 1;

        if (
            notes[mid].time < time
        ) {

            low = mid + 1;

        } else {

            high = mid;
        }
    }

    return low;
}


/* =========================================================
   VOICE
========================================================= */

function removeOldVoices(now) {

    /*
        終了済みvoiceを掃除
    */

    for (
        let i = voices.length - 1;
        i >= 0;
        i--
    ) {

        const v =
            voices[i];

        if (
            v.end <= now ||
            !v.osc
        ) {

            try {
                v.osc.stop();
            } catch (_) {}

            try {
                v.osc.disconnect();
            } catch (_) {}

            try {
                v.gain.disconnect();
            } catch (_) {}

            voices.splice(i, 1);
        }
    }
}


/* =========================================================
   NOTE FREQUENCY
========================================================= */

function noteFrequency(note) {

    return (
        440 *
        Math.pow(
            2,
            (note - 69) / 12
        )
    );
}


/* =========================================================
   SIMPLE GM-LIKE SOUND
========================================================= */

function instrumentWave(program) {

    /*
        BlackMIDIでは音色判定そのものより
        軽量さを優先。

        OscillatorNode一つで鳴らす。
    */

    if (program >= 80 && program <= 95) {
        return "sawtooth";
    }

    if (program >= 56 && program <= 79) {
        return "square";
    }

    if (program >= 40 && program <= 55) {
        return "triangle";
    }

    return "sine";
}


/* =========================================================
   PLAY ONE NOTE
========================================================= */

function playNote(noteData, when, durationSeconds) {

    if (!audioContext) {
        return;
    }

    /*
        最大音数を超えたら
        一番古い音を止める。

        これがBlackMIDI対策の重要部分。
    */

    if (
        voices.length >= MAX_VOICES
    ) {

        const old =
            voices.shift();

        try {
            old.gain.gain.cancelScheduledValues(
                audioContext.currentTime
            );

            old.gain.gain.setTargetAtTime(
                0,
                audioContext.currentTime,
                0.003
            );

            old.osc.stop(
                audioContext.currentTime + 0.02
            );

        } catch (_) {}
    }


    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    const velocity =
        noteData.velocity / 127;

    /*
        BlackMIDIで爆音になりすぎないよう
        ベース音量を低くする。
    */

    const volume =
        velocity *
        0.16;


    osc.type =
        instrumentWave(
            noteData.program
        );

    osc.frequency.value =
        noteFrequency(
            noteData.note
        );


    gain.gain.setValueAtTime(
        0,
        when
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        when + 0.003
    );


    /*
        リリース
    */

    const release =
        Math.min(
            0.04,
            Math.max(
                0.008,
                durationSeconds * 0.15
            )
        );

    const end =
        when +
        Math.max(
            0.01,
            durationSeconds
        );


    gain.gain.setValueAtTime(
        volume,
        Math.max(
            when + 0.005,
            end - release
        )
    );

    gain.gain.linearRampToValueAtTime(
        0,
        end
    );


    osc.connect(gain);

    gain.connect(masterGain);


    osc.start(when);

    osc.stop(
        end + 0.01
    );


    voices.push({
        osc,
        gain,
        end:
            end + 0.02
    });
}


/* =========================================================
   SCHEDULER
========================================================= */

let notePointer = 0;

let schedulerTimer = null;

const LOOK_AHEAD = 0.12;

const SCHEDULER_INTERVAL = 25;


/*
    AudioContextの時間から
    MIDI時間へ変換
*/

function currentPosition() {

    if (!playing || !audioContext) {
        return pausedPosition;
    }

    return (
        pausedPosition +
        (
            audioContext.currentTime -
            startAudioTime
        ) *
        playbackSpeed
    );
}


/* =========================================================
   FIND NOTE POINTER
========================================================= */

function setNotePointer(time) {

    notePointer =
        lowerBound(time);

    /*
        少し前のノートを戻す。

        seek直後の音切れ防止。
    */

    while (
        notePointer > 0 &&
        notes[notePointer - 1].endTime > time
    ) {

        notePointer--;
    }
}


/* =========================================================
   SCHEDULE
========================================================= */

function schedule() {

    if (
        !playing ||
        !audioContext
    ) {
        return;
    }

    const nowAudio =
        audioContext.currentTime;

    const current =
        currentPosition();

    const scheduleUntil =
        current +
        LOOK_AHEAD *
        playbackSpeed;


    /*
        現在位置から先のノートだけ処理。
    */

    while (
        notePointer < notes.length
    ) {

        const n =
            notes[notePointer];

        if (
            n.time >= scheduleUntil
        ) {
            break;
        }

        /*
            すでに終わっているノートは
            再生しない。
        */

        if (
            n.endTime > current
        ) {

            const start =
                Math.max(
                    n.time,
                    current
                );

            const delay =
                (
                    start -
                    current
                ) /
                playbackSpeed;

            const realDuration =
                (
                    n.endTime -
                    start
                ) /
                playbackSpeed;

            playNote(
                n,
                nowAudio + delay,
                realDuration
            );
        }

        notePointer++;
    }


    removeOldVoices(
        nowAudio
    );
}


/* =========================================================
   START PLAYBACK
========================================================= */

async function startPlayback() {

    if (!loaded) {
        return;
    }

    initAudio();

    if (
        audioContext.state === "suspended"
    ) {

        await audioContext.resume();
    }


    /*
        最後まで行っていた場合
        最初へ。
    */

    if (
        pausedPosition >= duration
    ) {

        pausedPosition = 0;
        setNotePointer(0);
    }


    startAudioTime =
        audioContext.currentTime;

    playing = true;

    playButton.textContent =
        "⏸ 一時停止";

    statusLabel.textContent =
        "再生中";


    if (schedulerTimer) {
        clearInterval(
            schedulerTimer
        );
    }

    /*
        25msごと。
        1ノート1タイマーではない。
    */

    schedulerTimer =
        setInterval(
            schedule,
            SCHEDULER_INTERVAL
        );

    schedule();
}


/* =========================================================
   PAUSE
========================================================= */

function pausePlayback() {

    if (!playing) {
        return;
    }

    pausedPosition =
        currentPosition();

    playing = false;

    if (schedulerTimer) {

        clearInterval(
            schedulerTimer
        );

        schedulerTimer = null;
    }

    /*
        現在鳴っている音を
        短くフェードアウト。
    */

    fadeOutVoices();

    playButton.textContent =
        "▶ 再生";

    statusLabel.textContent =
        "一時停止";
}


/* =========================================================
   FADE VOICES
========================================================= */

function fadeOutVoices() {

    if (!audioContext) {
        return;
    }

    const now =
        audioContext.currentTime;

    for (
        let i = 0;
        i < voices.length;
        i++
    ) {

        const v =
            voices[i];

        try {

            v.gain.gain.cancelScheduledValues(
                now
            );

            v.gain.gain.setTargetAtTime(
                0,
                now,
                0.008
            );

            v.osc.stop(
                now + 0.04
            );

        } catch (_) {}
    }

    voices.length = 0;
}


/* =========================================================
   STOP
========================================================= */

function stopPlayback() {

    playing = false;

    if (schedulerTimer) {

        clearInterval(
            schedulerTimer
        );

        schedulerTimer = null;
    }

    fadeOutVoices();

    pausedPosition = 0;

    playbackPosition = 0;

    notePointer = 0;

    seek.value = 0;

    playButton.textContent =
        "▶ 再生";

    if (loaded) {

        statusLabel.textContent =
            "停止";

        timeLabel.textContent =
            `00:00 / ${formatTime(duration)}`;
    }
}


/* =========================================================
   PLAY BUTTON
========================================================= */

playButton.addEventListener(
    "click",
    () => {

        if (!loaded) {
            return;
        }

        if (playing) {

            pausePlayback();

        } else {

            startPlayback();
        }
    }
);


/* =========================================================
   STOP BUTTON
========================================================= */

stopButton.addEventListener(
    "click",
    stopPlayback
);


/* =========================================================
   LOOP
========================================================= */

loopButton.addEventListener(
    "click",
    () => {

        looping =
            !looping;

        loopButton.textContent =
            looping
                ? "🔁 ループ ON"
                : "🔁 ループ OFF";
    }
);


/* =========================================================
   SEEK
========================================================= */

seek.addEventListener(
    "input",
    () => {

        if (!loaded) {
            return;
        }

        const value =
            Number(seek.value);

        const wasPlaying =
            playing;

        if (wasPlaying) {
            pausePlayback();
        }

        pausedPosition =
            Math.max(
                0,
                Math.min(
                    duration,
                    value
                )
            );

        playbackPosition =
            pausedPosition;

        setNotePointer(
            pausedPosition
        );

        timeLabel.textContent =
            `${formatTime(pausedPosition)} / ${formatTime(duration)}`;

        draw();

        if (wasPlaying) {
            startPlayback();
        }
    }
);


/* =========================================================
   VOLUME
========================================================= */

volumeSlider.addEventListener(
    "input",
    () => {

        if (masterGain) {

            masterGain.gain.value =
                Number(
                    volumeSlider.value
                );
        }
    }
);


/* =========================================================
   SPEED
========================================================= */

speedSlider.addEventListener(
    "input",
    () => {

        const newSpeed =
            Number(
                speedSlider.value
            );

        /*
            再生中に速度変更する場合、
            現在位置を一度確定する。
        */

        if (playing) {

            pausedPosition =
                currentPosition();

            startAudioTime =
                audioContext.currentTime;
        }

        playbackSpeed =
            newSpeed;

        speedText.textContent =
            newSpeed.toFixed(2) + "x";
    }
);


/* =========================================================
   DRAW
========================================================= */

/*
    描画を軽くするため
    毎フレーム全ノートを見ない。

    現在位置周辺だけ二分探索。
*/

function draw() {

    /*
        背景
    */

    ctx.fillStyle =
        "#050505";

    ctx.fillRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );


    if (
        !loaded ||
        !notes.length
    ) {
        return;
    }


    const position =
        playing
            ? currentPosition()
            : pausedPosition;


    /*
        表示範囲
    */

    const windowSeconds =
        8;

    const startTime =
        Math.max(
            0,
            position - 1
        );

    const endTime =
        position +
        windowSeconds;


    let index =
        lowerBound(startTime);


    /*
        BlackMIDIで
        何百万ノートあっても
        画面に見える範囲だけ描く。
    */

    const secondsPerWidth =
        windowSeconds /
        Math.max(
            1,
            canvasWidth
        );


    /*
        背景の鍵盤グリッド
    */

    const whiteKeys = 75;

    const keyHeight =
        canvasHeight /
        whiteKeys;


    /*
        まず縦グリッド
    */

    ctx.fillStyle =
        "#101010";

    for (
        let i = 0;
        i < whiteKeys;
        i++
    ) {

        if (i % 2 === 0) {

            ctx.fillRect(
                0,
                i * keyHeight,
                canvasWidth,
                keyHeight
            );
        }
    }


    /*
        ノート描画
    */

    while (
        index < notes.length
    ) {

        const n =
            notes[index];

        if (
            n.time > endTime
        ) {
            break;
        }

        if (
            n.endTime >= startTime
        ) {

            /*
                音域をCanvasへ。
            */

            const row =
                127 - n.note;

            const y =
                row *
                (
                    canvasHeight /
                    128
                );

            const h =
                Math.max(
                    2,
                    canvasHeight / 128
                );


            const x =
                (
                    n.time -
                    startTime
                ) /
                secondsPerWidth;

            const w =
                Math.max(
                    1,
                    (
                        n.endTime -
                        n.time
                    ) /
                    secondsPerWidth
                );


            /*
                色計算を軽量化。
            */

            const velocity =
                n.velocity;


            if (
                n.time <= position &&
                n.endTime > position
            ) {

                ctx.fillStyle =
                    "#ffffff";

            } else {

                const shade =
                    70 +
                    Math.floor(
                        velocity * 0.9
                    );

                ctx.fillStyle =
                    `rgb(${shade},${shade},${shade})`;
            }


            ctx.fillRect(
                x,
                y,
                w,
                h
            );
        }

        index++;
    }


    /*
        再生位置
    */

    const playX =
        (
            position -
            startTime
        ) /
        secondsPerWidth;


    ctx.fillStyle =
        "#ffffff";

    ctx.fillRect(
        playX,
        0,
        2,
        canvasHeight
    );
}


/* =========================================================
   LIGHTWEIGHT RENDER LOOP
========================================================= */

let lastDrawTime = 0;

function renderLoop(timestamp) {

    /*
        約30FPS。

        60FPSにするとBlackMIDIでは
        CPU/GPUを無駄に使いやすい。
    */

    if (
        timestamp -
        lastDrawTime >= 33
    ) {

        lastDrawTime =
            timestamp;

        if (loaded) {

            if (playing) {

                playbackPosition =
                    currentPosition();

                /*
                    曲終了
                */

                if (
                    playbackPosition >=
                    duration
                ) {

                    if (looping) {

                        fadeOutVoices();

                        pausedPosition = 0;

                        playbackPosition = 0;

                        setNotePointer(0);

                        startAudioTime =
                            audioContext.currentTime;

                    } else {

                        pausedPosition =
                            duration;

                        playing = false;

                        if (schedulerTimer) {

                            clearInterval(
                                schedulerTimer
                            );

                            schedulerTimer = null;
                        }

                        fadeOutVoices();

                        playButton.textContent =
                            "▶ 再生";

                        statusLabel.textContent =
                            "再生終了";
                    }
                }
            }


            /*
                seek表示
            */

            seek.value =
                Math.min(
                    duration,
                    Math.max(
                        0,
                        playbackPosition
                    )
                );


            timeLabel.textContent =
                `${formatTime(playbackPosition)} / ${formatTime(duration)}`;


            draw();
        }
    }

    requestAnimationFrame(
        renderLoop
    );
}

requestAnimationFrame(
    renderLoop
);


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        /*
            入力欄にいる場合は無視
        */

        if (
            event.target.tagName ===
                "INPUT" ||
            event.target.tagName ===
                "TEXTAREA"
        ) {
            return;
        }


        /*
            Space
        */

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            if (loaded) {

                if (playing) {
                    pausePlayback();
                } else {
                    startPlayback();
                }
            }
        }


        /*
            Escape
        */

        if (
            event.code === "Escape"
        ) {

            stopPlayback();
        }


        /*
            ←
        */

        if (
            event.code === "ArrowLeft"
        ) {

            const wasPlaying =
                playing;

            if (wasPlaying) {
                pausePlayback();
            }

            pausedPosition =
                Math.max(
                    0,
                    pausedPosition - 5
                );

            setNotePointer(
                pausedPosition
            );

            if (wasPlaying) {
                startPlayback();
            }
        }


        /*
            →
        */

        if (
            event.code === "ArrowRight"
        ) {

            const wasPlaying =
                playing;

            if (wasPlaying) {
                pausePlayback();
            }

            pausedPosition =
                Math.min(
                    duration,
                    pausedPosition + 5
                );

            setNotePointer(
                pausedPosition
            );

            if (wasPlaying) {
                startPlayback();
            }
        }
    }
);


/* =========================================================
   INITIAL
========================================================= */

statusLabel.textContent =
    "待機中";

</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BlackMIDI Player Lite</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #080808;
    color: #eee;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

#header {
    height: 52px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 7px 10px;

    background: #111;
    border-bottom: 1px solid #292929;
}

button,
input[type="file"] {
    font: inherit;
}

button {
    border: 1px solid #444;
    background: #1c1c1c;
    color: #eee;

    border-radius: 6px;

    padding: 6px 12px;

    cursor: pointer;
}

button:hover {
    background: #292929;
}

button:active {
    background: #333;
}

#fileInput {
    width: 250px;
}

#fileName {
    min-width: 0;
    flex: 1;

    color: #aaa;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   MAIN
========================= */

#main {
    flex: 1;
    min-height: 0;

    position: relative;

    display: flex;
}

#canvas {
    width: 100%;
    height: 100%;

    display: block;

    background: #050505;
}

/* =========================
   BOTTOM CONTROL
========================= */

#bottom {
    height: 92px;
    flex-shrink: 0;

    background: #111;
    border-top: 1px solid #292929;

    padding: 8px 12px;

    display: flex;
    flex-direction: column;
    gap: 7px;
}

#seek {
    width: 100%;
}

#controls {
    display: flex;
    align-items: center;
    gap: 8px;

    flex-wrap: wrap;
}

.control {
    display: flex;
    align-items: center;
    gap: 5px;

    color: #bbb;
    font-size: 13px;
}

.control input[type="range"] {
    width: 100px;
}

#time {
    min-width: 130px;
    font-variant-numeric: tabular-nums;
    color: #bbb;
}

#status {
    margin-left: auto;

    color: #888;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    max-width: 45%;
}

/* =========================
   SETTINGS
========================= */

#settings {
    position: absolute;

    top: 10px;
    right: 10px;

    width: 250px;

    background: rgba(15,15,15,.96);
    border: 1px solid #333;

    border-radius: 8px;

    padding: 12px;

    display: none;

    z-index: 10;
}

#settings.show {
    display: block;
}

.setting {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 10px;

    font-size: 13px;
    color: #ccc;
}

.setting:last-child {
    margin-bottom: 0;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {
    #fileInput {
        width: 150px;
    }

    #status {
        display: none;
    }

    #bottom {
        height: 115px;
    }
}
</style>
</head>

<body>

<div id="header">

    <input
        id="fileInput"
        type="file"
        accept=".mid,.midi"
    >

    <button id="playBtn">▶ 再生</button>
    <button id="stopBtn">■ 停止</button>
    <button id="loopBtn">🔁 ループ OFF</button>
    <button id="settingsBtn">⚙</button>

    <div id="fileName">
        MIDIファイルを選択してください
    </div>

</div>


<div id="main">

    <canvas id="canvas"></canvas>

    <div id="settings">

        <div class="setting">
            <span>音量</span>
            <input
                id="volume"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.65"
            >
        </div>

        <div class="setting">
            <span>速度</span>
            <input
                id="speed"
                type="range"
                min="0.25"
                max="2"
                step="0.05"
                value="1"
            >
        </div>

        <div class="setting">
            <span>表示速度</span>
            <input
                id="viewSpeed"
                type="range"
                min="0.25"
                max="4"
                step="0.05"
                value="1"
            >
        </div>

        <div class="setting">
            <span>リバーブ</span>
            <input
                id="reverb"
                type="checkbox"
                checked
            >
        </div>

        <div class="setting">
            <span>鍵盤表示</span>
            <input
                id="keyboard"
                type="checkbox"
                checked
            >
        </div>

    </div>

</div>


<div id="bottom">

    <input
        id="seek"
        type="range"
        min="0"
        max="1"
        step="0.001"
        value="0"
    >

    <div id="controls">

        <div id="time">
            00:00 / 00:00
        </div>

        <div class="control">
            音量
            <input
                id="volumeBottom"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.65"
            >
        </div>

        <div class="control">
            速度
            <input
                id="speedBottom"
                type="range"
                min="0.25"
                max="2"
                step="0.05"
                value="1"
            >
        </div>

        <div id="status">
            待機中
        </div>

    </div>

</div>


<script>
"use strict";

/*
============================================================
 BlackMIDI Player Lite
============================================================

設計方針

・巨大配列への ... を使わない
・noteごとのsetTimeoutを使わない
・巨大なpolyphony配列を作らない
・毎フレーム全ノーツを走査しない
・AudioNodeを必要以上に作らない
・大量ノーツでは描画を自動的に軽量化
・MIDI再生を最優先

============================================================
*/


/* =========================================================
   DOM
========================================================= */

const fileInput = document.getElementById("fileInput");
const playBtn = document.getElementById("playBtn");
const stopBtn = document.getElementById("stopBtn");
const loopBtn = document.getElementById("loopBtn");
const settingsBtn = document.getElementById("settingsBtn");

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha: false
});

const seek = document.getElementById("seek");

const volume = document.getElementById("volume");
const volumeBottom = document.getElementById("volumeBottom");

const speed = document.getElementById("speed");
const speedBottom = document.getElementById("speedBottom");

const viewSpeed = document.getElementById("viewSpeed");

const reverb = document.getElementById("reverb");
const keyboard = document.getElementById("keyboard");

const fileName = document.getElementById("fileName");
const timeLabel = document.getElementById("time");
const status = document.getElementById("status");

const settings = document.getElementById("settings");


/* =========================================================
   STATE
========================================================= */

let midi = null;

let playing = false;

let loopEnabled = false;

let playStartAudioTime = 0;
let playStartPosition = 0;

let currentPosition = 0;

let duration = 0;

let playbackSpeed = 1;

let renderHandle = 0;

let lastRenderTime = 0;

let nextNoteIndex = 0;
let nextEventIndex = 0;


/*
    BlackMIDIではノート数が非常に多くなるため、
    同時発音数を制限する。

    これを無制限にするとブラウザのAudioNodeが
    一気に増えて音が止まりやすい。
*/
const MAX_VOICES = 96;


/*
    スケジューラ先読み時間。
    長すぎると停止・シーク時の無駄な発音が増える。
*/
const LOOK_AHEAD = 0.12;


/*
    スケジューラ周期。
*/
const SCHEDULE_INTERVAL = 30;


/*
    大量MIDI判定。
*/
const HUGE_FILE_NOTES = 200000;
const EXTREME_FILE_NOTES = 1000000;


/* =========================================================
   AUDIO
========================================================= */

let audioCtx = null;

let masterGain = null;

let compressor = null;

let reverbInput = null;
let reverbGain = null;

let activeVoices = [];

let audioReady = false;


/* =========================================================
   MIDI STATE
========================================================= */

const channelState = [];

for (let i = 0; i < 16; i++) {

    channelState.push({
        volume: 1,
        expression: 1,
        pan: 0,
        program: 0,
        pitchBend: 0,
        sustain: false
    });

}


/* =========================================================
   UTIL
========================================================= */

function clamp(value, min, max) {

    if (value < min) {
        return min;
    }

    if (value > max) {
        return max;
    }

    return value;
}


function formatTime(sec) {

    if (!Number.isFinite(sec) || sec < 0) {
        sec = 0;
    }

    const m = Math.floor(sec / 60);

    const s = Math.floor(sec % 60);

    return (
        String(m).padStart(2, "0") +
        ":" +
        String(s).padStart(2, "0")
    );
}


/* =========================================================
   CANVAS
========================================================= */

let canvasWidth = 1;
let canvasHeight = 1;
let dpr = 1;

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    /*
        DPRを最大2に制限。
        4K等での過剰な描画負荷を防ぐ。
    */

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvasWidth = Math.max(1, Math.floor(rect.width));
    canvasHeight = Math.max(1, Math.floor(rect.height));

    canvas.width = Math.floor(canvasWidth * dpr);
    canvas.height = Math.floor(canvasHeight * dpr);

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas,
    { passive: true }
);

resizeCanvas();


/* =========================================================
   AUDIO INITIALIZATION
========================================================= */

function createReverbImpulse() {

    if (!audioCtx) {
        return null;
    }

    /*
        巨大なImpulseResponseは作らない。
        0.45秒だけ。
    */

    const length = Math.floor(
        audioCtx.sampleRate * 0.45
    );

    const buffer = audioCtx.createBuffer(
        2,
        length,
        audioCtx.sampleRate
    );

    for (let ch = 0; ch < 2; ch++) {

        const data = buffer.getChannelData(ch);

        for (let i = 0; i < length; i++) {

            const t = i / length;

            data[i] =
                (Math.random() * 2 - 1) *
                Math.pow(1 - t, 3);
        }
    }

    return buffer;
}


function initAudio() {

    if (audioReady) {
        return;
    }

    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

    masterGain =
        audioCtx.createGain();

    compressor =
        audioCtx.createDynamicsCompressor();

    compressor.threshold.value = -12;
    compressor.knee.value = 18;
    compressor.ratio.value = 4;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.15;

    masterGain.gain.value =
        Number(volume.value);


    /*
        リバーブ
    */

    reverbInput =
        audioCtx.createGain();

    reverbGain =
        audioCtx.createGain();

    const convolver =
        audioCtx.createConvolver();

    const impulse =
        createReverbImpulse();

    if (impulse) {
        convolver.buffer = impulse;
    }

    reverbInput.connect(convolver);

    convolver.connect(reverbGain);

    reverbGain.gain.value =
        reverb.checked ? 0.13 : 0;


    /*
        Master
    */

    masterGain.connect(compressor);

    compressor.connect(
        audioCtx.destination
    );

    audioReady = true;
}


/* =========================================================
   AUDIO CLEANUP
========================================================= */

function stopAllVoices() {

    for (let i = 0; i < activeVoices.length; i++) {

        const voice =
            activeVoices[i];

        try {
            voice.osc.stop();
        } catch (_) {}

        try {
            voice.osc.disconnect();
        } catch (_) {}

        try {
            voice.gain.disconnect();
        } catch (_) {}

        try {
            if (voice.panner) {
                voice.panner.disconnect();
            }
        } catch (_) {}
    }

    activeVoices.length = 0;
}


/*
    定期的に終了済みvoiceを削除。
    noteごとのsetTimeoutは使わない。
*/
function cleanupVoices(now) {

    let write = 0;

    for (let i = 0; i < activeVoices.length; i++) {

        const voice =
            activeVoices[i];

        if (
            voice.endAudioTime <= now ||
            voice.finished
        ) {

            try {
                voice.osc.disconnect();
            } catch (_) {}

            try {
                voice.gain.disconnect();
            } catch (_) {}

            if (voice.panner) {

                try {
                    voice.panner.disconnect();
                } catch (_) {}
            }

        } else {

            activeVoices[write++] =
                voice;
        }
    }

    activeVoices.length = write;
}


/* =========================================================
   MIDI NOTE -> FREQUENCY
========================================================= */

function noteToFrequency(note) {

    return (
        440 *
        Math.pow(
            2,
            (note - 69) / 12
        )
    );
}


/* =========================================================
   SIMPLE GM SYNTH
========================================================= */

function getInstrumentType(program) {

    if (program <= 7) {
        return "piano";
    }

    if (program <= 15) {
        return "chromatic";
    }

    if (program <= 23) {
        return "organ";
    }

    if (program <= 31) {
        return "guitar";
    }

    if (program <= 39) {
        return "bass";
    }

    if (program <= 47) {
        return "strings";
    }

    if (program <= 55) {
        return "ensemble";
    }

    if (program <= 63) {
        return "brass";
    }

    if (program <= 71) {
        return "reed";
    }

    if (program <= 79) {
        return "pipe";
    }

    if (program <= 87) {
        return "synth";
    }

    if (program <= 95) {
        return "ethnic";
    }

    return "effect";
}


function getWave(program) {

    const type =
        getInstrumentType(program);

    switch (type) {

        case "piano":
            return "triangle";

        case "organ":
            return "square";

        case "guitar":
            return "triangle";

        case "bass":
            return "sawtooth";

        case "strings":
            return "sawtooth";

        case "ensemble":
            return "sawtooth";

        case "brass":
            return "sawtooth";

        case "reed":
            return "square";

        case "pipe":
            return "sine";

        case "synth":
            return "sawtooth";

        case "chromatic":
            return "triangle";

        default:
            return "sine";
    }
}


/* =========================================================
   PLAY NOTE
========================================================= */

function playNote(note, when, durationSec) {

    if (!audioCtx || !masterGain) {
        return;
    }

    /*
        既に大量発音中なら古い音を切る。
        これがBlackMIDIでの安定性にかなり効く。
    */

    if (activeVoices.length >= MAX_VOICES) {

        const old =
            activeVoices[0];

        if (old) {

            try {
                old.gain.gain.cancelScheduledValues(
                    when
                );

                old.gain.gain.setValueAtTime(
                    old.gain.gain.value,
                    when
                );

                old.gain.gain.linearRampToValueAtTime(
                    0,
                    when + 0.008
                );

                old.osc.stop(
                    when + 0.01
                );

            } catch (_) {}
        }

        activeVoices.shift();
    }


    const channel =
        channelState[note.channel];


    /*
        ドラム
    */

    if (note.channel === 9) {

        playDrum(
            note,
            when,
            durationSec
        );

        return;
    }


    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    const panner =
        audioCtx.createStereoPanner();


    const frequency =
        noteToFrequency(
            note.note +
            channel.pitchBend * 2
        );

    osc.frequency.setValueAtTime(
        frequency,
        when
    );


    osc.type =
        getWave(channel.program);


    /*
        音量
    */

    let velocity =
        note.velocity / 127;

    let level =
        velocity *
        channel.volume *
        channel.expression *
        0.16;


    /*
        大量ノーツ時はさらに小さく。
        コンプレッサーでまとめる。
    */

    if (midi && midi.notes.length > HUGE_FILE_NOTES) {
        level *= 0.75;
    }


    gain.gain.setValueAtTime(
        0,
        when
    );

    gain.gain.linearRampToValueAtTime(
        level,
        when + 0.004
    );


    const end =
        when +
        Math.max(
            0.015,
            Math.min(
                durationSec,
                8
            )
        );


    gain.gain.setValueAtTime(
        level,
        Math.max(
            when + 0.006,
            end - 0.025
        )
    );

    gain.gain.linearRampToValueAtTime(
        0,
        end
    );


    panner.pan.value =
        clamp(
            channel.pan,
            -1,
            1
        );


    osc.connect(gain);

    gain.connect(panner);

    panner.connect(masterGain);


    /*
        リバーブは任意。
    */

    if (reverb.checked) {

        gain.connect(reverbInput);
    }


    osc.start(when);

    osc.stop(
        end + 0.01
    );


    activeVoices.push({

        osc,
        gain,
        panner,

        endAudioTime:
            end + 0.02,

        finished: false
    });
}


/* =========================================================
   DRUM
========================================================= */

function playDrum(note, when, durationSec) {

    if (!audioCtx) {
        return;
    }

    if (activeVoices.length >= MAX_VOICES) {
        return;
    }

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    let freq = 150;

    let length =
        Math.min(
            Math.max(
                durationSec,
                0.025
            ),
            0.35
        );


    switch (note.note) {

        case 35:
        case 36:
            freq = 70;
            break;

        case 38:
        case 40:
            freq = 180;
            break;

        case 42:
        case 44:
        case 46:
            freq = 7000;
            break;

        case 49:
        case 51:
            freq = 5000;
            break;

        default:
            freq = 250;
            break;
    }


    osc.type =
        note.note >= 42 &&
        note.note <= 51
            ? "square"
            : "sine";


    osc.frequency.setValueAtTime(
        freq,
        when
    );


    const level =
        (note.velocity / 127) *
        0.10;


    gain.gain.setValueAtTime(
        level,
        when
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        when + length
    );


    osc.connect(gain);

    gain.connect(masterGain);


    osc.start(when);

    osc.stop(
        when + length + 0.01
    );


    activeVoices.push({

        osc,
        gain,
        panner: null,

        endAudioTime:
            when +
            length +
            0.02,

        finished: false
    });
}


/* =========================================================
   VLQ
========================================================= */

function readVLQ(view, offset) {

    let value = 0;

    let count = 0;

    while (offset < view.byteLength) {

        const b =
            view.getUint8(offset++);

        value =
            (value << 7) |
            (b & 0x7F);

        count++;

        if (!(b & 0x80)) {
            break;
        }

        /*
            壊れたMIDIによる無限ループ防止。
        */

        if (count > 5) {
            break;
        }
    }

    return {
        value,
        next: offset
    };
}


/* =========================================================
   MIDI PARSER
========================================================= */

function parseMIDI(buffer) {

    const view =
        new DataView(buffer);

    let p = 0;


    function readU8() {

        if (p >= view.byteLength) {
            return 0;
        }

        return view.getUint8(p++);
    }


    function readU16() {

        if (p + 2 > view.byteLength) {
            return 0;
        }

        const value =
            view.getUint16(
                p,
                false
            );

        p += 2;

        return value;
    }


    function readU32() {

        if (p + 4 > view.byteLength) {
            return 0;
        }

        const value =
            view.getUint32(
                p,
                false
            );

        p += 4;

        return value;
    }


    /*
        Header
    */

    if (
        readU8() !== 0x4D ||
        readU8() !== 0x54 ||
        readU8() !== 0x68 ||
        readU8() !== 0x64
    ) {
        throw new Error(
            "MIDIヘッダーがありません"
        );
    }


    const headerLength =
        readU32();

    const format =
        readU16();

    const trackCount =
        readU16();

    const division =
        readU16();


    /*
        SMPTE division
    */

    let ticksPerQuarter =
        division & 0x7FFF;

    if (division & 0x8000) {

        throw new Error(
            "SMPTE形式のMIDIには現在未対応です"
        );
    }


    /*
        全イベントを保持。
        ただし余計なデータは持たない。
    */

    const notes = [];
    const events = [];

    const tempoEvents = [];


    /*
        Track解析
    */

    for (
        let track = 0;
        track < trackCount;
        track++
    ) {

        /*
            MTrk
        */

        if (
            p + 8 > view.byteLength
        ) {
            break;
        }


        const c1 = readU8();
        const c2 = readU8();
        const c3 = readU8();
        const c4 = readU8();


        if (
            c1 !== 0x4D ||
            c2 !== 0x54 ||
            c3 !== 0x72 ||
            c4 !== 0x6B
        ) {

            throw new Error(
                "MTrkが見つかりません"
            );
        }


        const trackLength =
            readU32();

        const trackEnd =
            Math.min(
                p + trackLength,
                view.byteLength
            );


        let tick = 0;

        let runningStatus = 0;


        /*
            同じnoteが重なる可能性があるので
            stack方式。
        */

        const active =
            new Map();


        while (
            p < trackEnd
        ) {

            const vlq =
                readVLQ(
                    view,
                    p
                );

            p =
                vlq.next;

            tick +=
                vlq.value;


            if (p >= trackEnd) {
                break;
            }


            let statusByte =
                view.getUint8(p);


            /*
                Running Status
            */

            if (
                statusByte < 0x80
            ) {

                if (
                    runningStatus === 0
                ) {
                    p++;
                    continue;
                }

                statusByte =
                    runningStatus;

            } else {

                p++;
            }


            /*
                Meta
            */

            if (
                statusByte === 0xFF
            ) {

                const metaType =
                    readU8();

                const metaLen =
                    readVLQ(
                        view,
                        p
                    );

                p =
                    metaLen.next;


                const len =
                    Math.min(
                        metaLen.value,
                        trackEnd - p
                    );


                /*
                    Tempo
                */

                if (
                    metaType === 0x51 &&
                    len >= 3
                ) {

                    const tempo =
                        (view.getUint8(p) << 16) |
                        (view.getUint8(p + 1) << 8) |
                        view.getUint8(p + 2);


                    tempoEvents.push({
                        tick,
                        tempo
                    });

                }


                /*
                    End Of Track
                */

                if (
                    metaType === 0x2F
                ) {

                    p += len;

                    break;
                }


                p += len;

                continue;
            }


            /*
                SysEx
            */

            if (
                statusByte === 0xF0 ||
                statusByte === 0xF7
            ) {

                const len =
                    readVLQ(
                        view,
                        p
                    );

                p =
                    len.next +
                    len.value;

                continue;
            }


            /*
                MIDI channel message
            */

            const command =
                statusByte & 0xF0;

            const channel =
                statusByte & 0x0F;


            /*
                1 data byte
            */

            if (
                command === 0xC0 ||
                command === 0xD0
            ) {

                if (p >= trackEnd) {
                    break;
                }

                const d1 =
                    readU8();


                if (
                    command === 0xC0
                ) {

                    events.push({
                        tick,
                        type: "program",
                        channel,
                        value: d1
                    });

                } else {

                    events.push({
                        tick,
                        type: "aftertouch",
                        channel,
                        value: d1
                    });
                }


                runningStatus =
                    statusByte;

                continue;
            }


            /*
                2 data bytes
            */

            if (
                p + 2 >
                trackEnd
            ) {
                break;
            }


            const d1 =
                readU8();

            const d2 =
                readU8();


            runningStatus =
                statusByte;


            /*
                Note ON
            */

            if (
                command === 0x90 &&
                d2 > 0
            ) {

                const key =
                    channel +
                    ":" +
                    d1;


                let stack =
                    active.get(key);


                if (!stack) {

                    stack = [];

                    active.set(
                        key,
                        stack
                    );
                }


                /*
                    note objectは必要最小限。
                */

                const note = {

                    tick,
                    endTick: tick,

                    note: d1,

                    velocity: d2,

                    channel,

                    program: 0
                };


                stack.push(note);

                notes.push(note);

                continue;
            }


            /*
                Note OFF
            */

            if (
                command === 0x80 ||
                (
                    command === 0x90 &&
                    d2 === 0
                )
            ) {

                const key =
                    channel +
                    ":" +
                    d1;


                const stack =
                    active.get(key);


                if (
                    stack &&
                    stack.length > 0
                ) {

                    /*
                        最後に入ったnoteから閉じる。
                    */

                    const note =
                        stack.pop();


                    note.endTick =
                        Math.max(
                            tick,
                            note.tick + 1
                        );
                }

                continue;
            }


            /*
                Control Change
            */

            if (
                command === 0xB0
            ) {

                events.push({

                    tick,

                    type: "cc",

                    channel,

                    controller: d1,

                    value: d2
                });

                continue;
            }


            /*
                Pitch Bend
            */

            if (
                command === 0xE0
            ) {

                const bend =
                    (
                        d1 |
                        (d2 << 7)
                    ) - 8192;


                events.push({

                    tick,

                    type: "pitch",

                    channel,

                    value: bend
                });

                continue;
            }


            /*
                Channel Aftertouch
            */

            if (
                command === 0xD0
            ) {

                events.push({

                    tick,

                    type: "aftertouch",

                    channel,

                    value: d1
                });
            }
        }


        /*
            Track終了後に閉じていないnoteは
            トラック末尾で終了。
        */

        active.forEach(
            stack => {

                for (
                    let i = 0;
                    i < stack.length;
                    i++
                ) {

                    stack[i].endTick =
                        Math.max(
                            tick,
                            stack[i].tick + 1
                        );
                }
            }
        );


        p =
            trackEnd;
    }


    /*
        Tempoが無い場合
        120 BPM
    */

    if (
        tempoEvents.length === 0
    ) {

        tempoEvents.push({

            tick: 0,

            tempo: 500000
        });

    }


    /*
        Tempoをtick順にソート
    */

    tempoEvents.sort(
        (a, b) =>
            a.tick - b.tick
    );


    /*
        同tick tempoを整理。
    */

    const tempos = [];

    let lastTick = -1;

    for (
        let i = 0;
        i < tempoEvents.length;
        i++
    ) {

        const t =
            tempoEvents[i];

        if (
            t.tick === lastTick
        ) {

            tempos[
                tempos.length - 1
            ] = t;

        } else {

            tempos.push(t);

            lastTick =
                t.tick;
        }
    }


    /*
        tempo mapに秒数を付ける。
    */

    let accumulatedSeconds = 0;

    let previousTick = 0;

    let currentTempo =
        500000;


    for (
        let i = 0;
        i < tempos.length;
        i++
    ) {

        const t =
            tempos[i];


        if (
            t.tick > previousTick
        ) {

            accumulatedSeconds +=
                (
                    (t.tick - previousTick) /
                    ticksPerQuarter
                ) *
                (
                    currentTempo / 1000000
                );
        }


        t.seconds =
            accumulatedSeconds;


        previousTick =
            t.tick;

        currentTempo =
            t.tempo;
    }


    function tickToSeconds(tick) {

        /*
            二分探索。
        */

        let lo = 0;

        let hi =
            tempos.length - 1;

        let index = 0;


        while (
            lo <= hi
        ) {

            const mid =
                (lo + hi) >> 1;


            if (
                tempos[mid].tick <= tick
            ) {

                index = mid;

                lo = mid + 1;

            } else {

                hi = mid - 1;
            }
        }


        const tempo =
            tempos[index];


        return (
            tempo.seconds +
            (
                (tick - tempo.tick) /
                ticksPerQuarter
            ) *
            (
                tempo.tempo / 1000000
            )
        );
    }


    /*
        ノートの時間を付ける。

        巨大配列に対するmap()は使わない。
    */

    let maxTime = 0;

    for (
        let i = 0;
        i < notes.length;
        i++
    ) {

        const n =
            notes[i];


        n.time =
            tickToSeconds(
                n.tick
            );

        n.endTime =
            tickToSeconds(
                n.endTick
            );


        if (
            n.endTime <= n.time
        ) {

            n.endTime =
                n.time + 0.01;
        }


        n.duration =
            n.endTime -
            n.time;


        if (
            n.endTime > maxTime
        ) {

            maxTime =
                n.endTime;
        }
    }


    /*
        イベントの時間。
    */

    for (
        let i = 0;
        i < events.length;
        i++
    ) {

        events[i].time =
            tickToSeconds(
                events[i].tick
            );
    }


    /*
        時間順ソート
    */

    notes.sort(
        (a, b) =>
            a.time - b.time
    );

    events.sort(
        (a, b) =>
            a.time - b.time
    );


    /*
        ノートにprogramを簡易適用。

        Program Changeが大量にある場合でも
        複雑な再計算をしない。
    */

    const programs =
        new Int16Array(16);


    for (
        let i = 0;
        i < 16;
        i++
    ) {
        programs[i] = 0;
    }


    let eventCursor = 0;


    for (
        let i = 0;
        i < notes.length;
        i++
    ) {

        const note =
            notes[i];


        while (
            eventCursor < events.length &&
            events[eventCursor].time <= note.time
        ) {

            const e =
                events[eventCursor];


            if (
                e.type === "program"
            ) {

                programs[
                    e.channel
                ] =
                    e.value;
            }


            eventCursor++;
        }


        note.program =
            programs[note.channel];
    }


    /*
        もう一度eventsのpointer用に戻す。
    */

    eventCursor = 0;


    /*
        最大tick
    */

    let maxTick = 0;

    for (
        let i = 0;
        i < notes.length;
        i++
    ) {

        if (
            notes[i].endTick >
            maxTick
        ) {

            maxTick =
                notes[i].endTick;
        }
    }


    /*
        軽量設定。
    */

    let renderSkip = 1;

    if (
        notes.length >
        EXTREME_FILE_NOTES
    ) {

        renderSkip = 3;

    } else if (
        notes.length >
        HUGE_FILE_NOTES
    ) {

        renderSkip = 2;
    }


    return {

        format,

        trackCount,

        ticksPerQuarter,

        tempos,

        notes,

        events,

        maxTick,

        duration: maxTime,

        renderSkip
    };
}

/* =========================================================
   CHANNEL RESET
========================================================= */

function resetChannels() {

    for (
        let i = 0;
        i < 16;
        i++
    ) {

        channelState[i].volume = 1;

        channelState[i].expression = 1;

        channelState[i].pan = 0;

        channelState[i].program = 0;

        channelState[i].pitchBend = 0;

        channelState[i].sustain = false;
    }
}


/* =========================================================
   MIDI EVENTS
========================================================= */

function applyEvent(event) {

    const ch =
        channelState[event.channel];


    if (!ch) {
        return;
    }


    switch (event.type) {

        case "program":

            ch.program =
                event.value;

            break;


        case "pitch":

            ch.pitchBend =
                event.value / 8192;

            break;


        case "cc":

            switch (
                event.controller
            ) {

                /*
                    Volume
                */

                case 7:

                    ch.volume =
                        event.value / 127;

                    break;


                /*
                    Pan
                */

                case 10:

                    ch.pan =
                        (
                            event.value - 64
                        ) / 64;

                    break;


                /*
                    Expression
                */

                case 11:

                    ch.expression =
                        event.value / 127;

                    break;


                /*
                    Sustain
                */

                case 64:

                    ch.sustain =
                        event.value >= 64;

                    break;


                /*
                    All Controllers Off
                */

                case 121:

                    ch.volume = 1;
                    ch.expression = 1;
                    ch.pan = 0;
                    ch.pitchBend = 0;

                    break;
            }

            break;
    }
}


/* =========================================================
   POINTER RESET
========================================================= */

function resetPointers(position) {

    if (!midi) {
        return;
    }


    /*
        ノートは二分探索。
    */

    let lo = 0;

    let hi =
        midi.notes.length;


    while (lo < hi) {

        const mid =
            (lo + hi) >> 1;


        if (
            midi.notes[mid].time <
            position
        ) {

            lo =
                mid + 1;

        } else {

            hi =
                mid;
        }
    }


    nextNoteIndex =
        lo;


    /*
        イベントも二分探索。
    */

    lo = 0;

    hi =
        midi.events.length;


    while (lo < hi) {

        const mid =
            (lo + hi) >> 1;


        if (
            midi.events[mid].time <
            position
        ) {

            lo =
                mid + 1;

        } else {

            hi =
                mid;
        }
    }


    nextEventIndex =
        lo;
}


/* =========================================================
   PLAYBACK POSITION
========================================================= */

function getCurrentPosition() {

    if (!playing) {
        return currentPosition;
    }


    if (!audioCtx) {
        return currentPosition;
    }


    const elapsed =
        (
            audioCtx.currentTime -
            playStartAudioTime
        ) *
        playbackSpeed;


    return (
        playStartPosition +
        elapsed
    );
}


/* =========================================================
   SCHEDULER
========================================================= */

function scheduleNotes() {

    if (!playing || !midi) {
        return;
    }


    const nowPosition =
        getCurrentPosition();


    const targetPosition =
        nowPosition +
        LOOK_AHEAD;


    /*
        MIDIイベント適用。
    */

    while (
        nextEventIndex <
        midi.events.length &&
        midi.events[nextEventIndex].time <=
        targetPosition
    ) {

        applyEvent(
            midi.events[nextEventIndex]
        );

        nextEventIndex++;
    }


    /*
        ノート再生。
    */

    const notes =
        midi.notes;


    while (
        nextNoteIndex <
        notes.length
    ) {

        const note =
            notes[nextNoteIndex];


        if (
            note.time >
            targetPosition
        ) {
            break;
        }


        /*
            既に終わっているnoteを
            過去シークで鳴らさない。
        */

        if (
            note.endTime >
            nowPosition
        ) {

            const delta =
                note.time -
                nowPosition;


            const when =
                audioCtx.currentTime +
                Math.max(
                    0,
                    delta /
                    playbackSpeed
                );


            const actualDuration =
                note.duration /
                playbackSpeed;


            /*
                現在のchannel programを使う。
            */

            channelState[
                note.channel
            ].program =
                note.program;


            playNote(
                note,
                when,
                actualDuration
            );
        }


        nextNoteIndex++;
    }


    cleanupVoices(
        audioCtx.currentTime
    );
}


/* =========================================================
   START
========================================================= */

async function startPlayback() {

    if (!midi) {
        return;
    }


    initAudio();


    if (
        audioCtx.state ===
        "suspended"
    ) {

        await audioCtx.resume();
    }


    if (
        currentPosition >=
        duration
    ) {

        currentPosition = 0;
    }


    resetPointers(
        currentPosition
    );


    /*
        現在位置以前のMIDIイベントを
        状態だけ反映する。

        これで途中から再生しても
        音量・プログラム等が壊れにくい。
    */

    resetChannels();


    for (
        let i = 0;
        i < nextEventIndex;
        i++
    ) {

        applyEvent(
            midi.events[i]
        );
    }


    /*
        ノートpointerを再取得。
    */

    resetPointers(
        currentPosition
    );


    playStartAudioTime =
        audioCtx.currentTime;


    playStartPosition =
        currentPosition;


    playing = true;


    playBtn.textContent =
        "⏸ 一時停止";


    status.textContent =
        "再生中";


    scheduleNotes();


    if (!renderHandle) {
        renderLoop();
    }
}


/* =========================================================
   PAUSE
========================================================= */

function pausePlayback() {

    if (!playing) {
        return;
    }


    currentPosition =
        Math.min(
            getCurrentPosition(),
            duration
        );


    playing = false;


    stopAllVoices();


    playBtn.textContent =
        "▶ 再生";


    status.textContent =
        "一時停止";


    updateTime();
}


/* =========================================================
   STOP
========================================================= */

function stopPlayback() {

    playing = false;


    currentPosition = 0;


    playStartPosition = 0;


    nextNoteIndex = 0;

    nextEventIndex = 0;


    stopAllVoices();


    resetChannels();


    playBtn.textContent =
        "▶ 再生";


    if (midi) {

        status.textContent =
            "停止";
    }


    updateTime();

    draw();
}

    if (masterGain) {

        );
    }
}

/* =========================================================
   SPEED
========================================================= */

function setSpeed(value) {

    const newSpeed =
        Number(value);


    if (playing) {

        /*
            速度変更前の位置を保存。
        */

        currentPosition =
            getCurrentPosition();

        playStartPosition =
            currentPosition;

        playStartAudioTime =
            audioCtx.currentTime;
    }


    playbackSpeed =
        newSpeed;


    speed.value =
        String(newSpeed);

    speedBottom.value =

}

/* =========================================================
   TIME
========================================================= */

function updateTime() {

    const pos =
        Math.min(
            Math.max(
                getCurrentPosition(),
                0
            ),
            duration
        );


    timeLabel.textContent =
        formatTime(pos) +
        " / " +
        formatTime(duration);


    if (
        !seeking &&
        duration > 0
    ) {

        seek.value =
            String(pos);
    }
}


/* =========================================================
   PLAYBACK LOOP
========================================================= */

function playbackLoop() {

    if (!playing) {
        return;
    }


    const pos =
        getCurrentPosition();


    if (
        pos >= duration
    ) {

        if (loopEnabled) {

            currentPosition = 0;

            stopAllVoices();

            resetChannels();

            resetPointers(0);


            playStartAudioTime =
                audioCtx.currentTime;

            playStartPosition =
                0;


            scheduleNotes();

        } else {

            currentPosition =
                duration;

            stopPlayback();

            return;
        }
    }


    scheduleNotes();

    updateTime();
}


/*
    setIntervalは大量処理の中に入れない。

    30ms周期で再生スケジュール。
*/

setInterval(
    playbackLoop,
    SCHEDULE_INTERVAL
);


/* =========================================================
   DRAW
========================================================= */

function draw() {

    ctx.fillStyle =
        "#050505";

    ctx.fillRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );


    if (!midi) {

        ctx.fillStyle =
            "#666";

        ctx.font =
            "16px system-ui";

        ctx.textAlign =
            "center";

        ctx.textBaseline =
            "middle";

        ctx.fillText(
            "MIDIファイルを選択してください",
            canvasWidth / 2,
            canvasHeight / 2
        );

        return;
    }


    const position =
        getCurrentPosition();


    /*
        表示範囲。
    */

    const pixelsPerSecond =
        120 *
        Number(
            viewSpeed.value
        );


    const centerX =
        canvasWidth * 0.45;


    const startTime =
        position -
        centerX /
        pixelsPerSecond;


    const endTime =
        position +
        (
            canvasWidth -
            centerX
        ) /
        pixelsPerSecond;


    /*
        ノートを二分探索。
    */

    const notes =
        midi.notes;


    let lo = 0;

    let hi =
        notes.length;


    while (lo < hi) {

        const mid =
            (lo + hi) >> 1;


        if (
            notes[mid].endTime <
            startTime
        ) {

            lo =
                mid + 1;

        } else {

            hi =
                mid;
        }
    }


    let startIndex =
        lo;


    /*
        鍵盤領域
    */

    const keyboardHeight =
        keyboard.checked
            ? 34
            : 0;


    const noteHeight =
        (
            canvasHeight -
            keyboardHeight
        ) /
        88;


    /*
        BlackMIDIでは縦88鍵。
    */


    /*
        ノート描画。

        巨大MIDIでは描画を間引く。
    */

    const skip =
        midi.renderSkip || 1;


    let visibleCounter = 0;


    for (
        let i = startIndex;
        i < notes.length;
        i += skip
    ) {

        const n =
            notes[i];


        if (
            n.time >
            endTime
        ) {
            break;
        }


        /*
            画面外Yはスキップ。
        */

        if (
            n.note < 21 ||
            n.note > 108
        ) {
            continue;
        }


        const x =
            centerX +
            (
                n.time -
                position
            ) *
            pixelsPerSecond;


        const x2 =
            centerX +
            (
                n.endTime -
                position
            ) *
            pixelsPerSecond;


        let width =
            x2 - x;


        if (width < 1) {
            width = 1;
        }


        const key =
            108 -
            n.note;


        const y =
            key *
            noteHeight;


        if (
            y + noteHeight <
            0 ||
            y >
            canvasHeight -
            keyboardHeight
        ) {
            continue;
        }


        /*
            音程によって少し色を変える。
            グラデーション等は使わない。
        */

        if (
            n.channel === 9
        ) {

            ctx.fillStyle =
                "#b56a6a";

        } else {

            const hue =
                (
                    n.note * 7
                ) % 360;


            ctx.fillStyle =
                "hsl(" +
                hue +
                ",55%,55%)";
        }


        ctx.fillRect(
            x,
            y + 1,
            width,
            Math.max(
                1,
                noteHeight - 2
            )
        );


        visibleCounter++;
    }


    /*
        再生位置
    */

    ctx.fillStyle =
        "#fff";

    ctx.fillRect(
        centerX,
        0,
        1,
        canvasHeight -
        keyboardHeight
    );


    /*
        鍵盤
    */

    if (keyboard.checked) {

        drawKeyboard(
            keyboardHeight
        );
    }


    /*
        上部情報
    */

    ctx.fillStyle =
        "rgba(0,0,0,.55)";

    ctx.fillRect(
        0,
        0,
        280,
        34
    );


    ctx.fillStyle =
        "#ccc";

    ctx.font =
        "12px system-ui";

    ctx.textAlign =
        "left";

    ctx.textBaseline =
        "middle";


    ctx.fillText(
        notes.length.toLocaleString() +
        " notes",
        10,
        17
    );


    /*
        極端な巨大MIDIでは警告表示。
    */

    if (
        notes.length >
        EXTREME_FILE_NOTES
    ) {

        ctx.fillStyle =
            "#aaa";

        ctx.fillText(
            "軽量描画モード",
            120,
            17
        );
    }
}


/* =========================================================
   KEYBOARD
========================================================= */

function drawKeyboard(height) {

    const keyCount = 88;

    const h =
        height / keyCount;


    for (
        let i = 0;
        i < keyCount;
        i++
    ) {

        const note =
            108 - i;


        const black =
            isBlackKey(note);


        ctx.fillStyle =
            black
                ? "#111"
                : "#ddd";


        ctx.fillRect(
            0,
            i * h,
            canvasWidth,
            Math.max(
                1,
                h - 1
            )
        );
    }


    /*
        左側だけ鍵盤っぽくする。
    */

    const keyWidth =
        55;


    for (
        let i = 0;
        i < keyCount;
        i++
    ) {

        const note =
            108 - i;


        const black =
            isBlackKey(note);


        ctx.fillStyle =
            black
                ? "#111"
                : "#eee";


        ctx.fillRect(
            0,
            i * h,
            keyWidth *
                (
                    black ? 0.65 : 1
                ),
            Math.max(
                1,
                h - 1
            )
        );
    }
}


function isBlackKey(note) {

    const n =
        note % 12;


    return (
        n === 1 ||
        n === 3 ||
        n === 6 ||
        n === 8 ||
        n === 10
    );
}


/* =========================================================
   RENDER LOOP
========================================================= */

function renderLoop(timestamp) {

    renderHandle =
        requestAnimationFrame(
            renderLoop
        );


    /*
        大量MIDIでは30FPS程度に制限。

        通常MIDIは60FPS。
    */

    const targetInterval =
        midi &&
        midi.notes.length >
        HUGE_FILE_NOTES
            ? 33
            : 16;


    if (
        timestamp -
        lastRenderTime <
        targetInterval
    ) {

        return;
    }


    lastRenderTime =
        timestamp;


    draw();

    updateTime();
}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

window.addEventListener(
    "keydown",
    async event => {

        /*
            input中は無視。
        */

        if (
            event.target.tagName ===
            "INPUT"
        ) {
            return;
        }


        switch (
            event.code
        ) {

            case "Space":

                event.preventDefault();


                if (!midi) {
                    break;
                }


                if (playing) {

                    pausePlayback();

                } else {

                    await startPlayback();
                }

                break;


            case "Escape":

                stopPlayback();

                break;


            case "ArrowLeft":

                if (midi) {

                    currentPosition =
                        Math.max(
                            0,
                            getCurrentPosition() -
                            5
                        );


                    stopAllVoices();

                    resetPointers(
                        currentPosition
                    );

                    if (playing) {

                        playStartAudioTime =
                            audioCtx.currentTime;

                        playStartPosition =
                            currentPosition;
                    }
                }

                break;


            case "ArrowRight":

                if (midi) {

                    currentPosition =
                        Math.min(
                            duration,
                            getCurrentPosition() +
                            5
                        );


                    stopAllVoices();

                    resetPointers(
                        currentPosition
                    );

                    if (playing) {

                        playStartAudioTime =
                            audioCtx.currentTime;

                        playStartPosition =
                            currentPosition;
                    }
                }

                break;
        }

    }
);


/* =========================================================
   INITIAL
========================================================= */

draw();

updateTime();

</script>

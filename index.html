<!DOCTYPE html>

<script>
"use strict";

/* =========================================================
   基本設定
========================================================= */

const cvs = document.getElementById("cvs");
const ctx = cvs.getContext("2d", {
    alpha:false,
    desynchronized:true
});

const fInp = document.getElementById("fInp");
const pBtn = document.getElementById("pBtn");
const logDiv = document.getElementById("log");

const MIN_NOTE = 36;
const MAX_NOTE = 96;
const NOTE_CNT = MAX_NOTE - MIN_NOTE + 1;

const SPEED = 250;

/*
 * 音声関係
 *
 * AudioWorklet側で最大同時発音数を制限。
 * BlackMIDIでは無限に音を鳴らすことはできないため、
 * 古い音を新しい音へ自動的に置き換える。
 */
const MAX_AUDIO_VOICES = 96;

const AUDIO_LOOKAHEAD = 0.15;
const AUDIO_SCHEDULE_INTERVAL = 25;


/* =========================================================
   状態
========================================================= */

let audioCtx = null;
let audioWorkletNode = null;
let masterGain = null;

let audioScheduler = null;
let audioPointer = 0;

let isPlaying = false;
let isPaused = false;

let startTime = 0;
let pauseTime = 0;

let notes = [];

let duration = 0;
let cachedDuration = 0;

let kyY = 0;

let currentFileName = "";

let playbackGeneration = 0;


/* =========================================================
   色
========================================================= */

const CLRS = [
    "#38bdf8",
    "#f43f5e",
    "#10b981",
    "#fbbf24",
    "#a855f7",
    "#ec4899",
    "#f97316",
    "#14b8a6"
];


/* =========================================================
   キャンバス
========================================================= */

function resizeCanvas(){

    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const w = window.innerWidth;
    const h = window.innerHeight;

    cvs.width = Math.floor(w * dpr);
    cvs.height = Math.floor(h * dpr);

    cvs.style.width = w + "px";
    cvs.style.height = h + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();


/* =========================================================
   ログ
========================================================= */

function log(text){
    logDiv.textContent = "ログ: " + text;
}


/* =========================================================
   MIDI → 周波数
========================================================= */

function noteToFreq(note){

    return 440 * Math.pow(
        2,
        (note - 69) / 12
    );
}


/* =========================================================
   AudioWorklet生成
=========================================================

   音符ごとにOscillatorNodeを作らない。

   AudioWorklet内で全部の音を合成する。

   これが今回の大きな軽量化ポイント。
========================================================= */

const workletCode = `

class BlackMIDIProcessor extends AudioWorkletProcessor {

    constructor(){

        super();

        this.voices = [];

        this.maxVoices = ${MAX_AUDIO_VOICES};

        this.port.onmessage = (event)=>{

            const data = event.data;

            if(!data) return;

            if(data.type === "note"){

                this.noteOn(
                    data.note,
                    data.velocity,
                    data.program,
                    data.channel,
                    data.pan,
                    data.duration
                );

            }else if(data.type === "stop"){

                this.voices.length = 0;

            }else if(data.type === "clear"){

                this.voices.length = 0;
            }
        };
    }


    /* -----------------------------------------------------
       波形
    ----------------------------------------------------- */

    waveform(t, type){

        const p = t - Math.floor(t);

        if(type === 0){

            return Math.sin(
                2 * Math.PI * p
            );

        }else if(type === 1){

            return 2 * p - 1;

        }else if(type === 2){

            return p < 0.5 ? 1 : -1;

        }else if(type === 3){

            return 1 - 4 * Math.abs(
                Math.round(p) - p
            );
        }

        return Math.sin(
            2 * Math.PI * p
        );
    }


    /* -----------------------------------------------------
       MIDI Program → 簡易音色
    ----------------------------------------------------- */

    getInstrument(program){

        /*
         * 0-7
         * Acoustic Piano
         */
        if(program <= 7){

            return {
                wave:0,
                harmonic:1.0,
                attack:0.004,
                release:0.18,
                brightness:0.45
            };
        }

        /*
         * 8-15
         * Chromatic percussion
         */
        if(program <= 15){

            return {
                wave:2,
                harmonic:0.8,
                attack:0.002,
                release:0.12,
                brightness:0.75
            };
        }

        /*
         * 16-23
         * Organ
         */
        if(program <= 23){

            return {
                wave:1,
                harmonic:0.65,
                attack:0.025,
                release:0.28,
                brightness:0.6
            };
        }

        /*
         * 24-31
         * Guitar
         */
        if(program <= 31){

            return {
                wave:3,
                harmonic:0.75,
                attack:0.006,
                release:0.2,
                brightness:0.5
            };
        }

        /*
         * 32-39
         * Bass
         */
        if(program <= 39){

            return {
                wave:0,
                harmonic:1.1,
                attack:0.008,
                release:0.22,
                brightness:0.32
            };
        }

        /*
         * 40-47
         * Strings
         */
        if(program <= 47){

            return {
                wave:3,
                harmonic:0.72,
                attack:0.055,
                release:0.42,
                brightness:0.48
            };
        }

        /*
         * 48-55
         * Ensemble
         */
        if(program <= 55){

            return {
                wave:3,
                harmonic:0.62,
                attack:0.045,
                release:0.38,
                brightness:0.5
            };
        }

        /*
         * 56-63
         * Brass
         */
        if(program <= 63){

            return {
                wave:1,
                harmonic:0.72,
                attack:0.025,
                release:0.18,
                brightness:0.72
            };
        }

        /*
         * 64-71
         * Reed
         */
        if(program <= 71){

            return {
                wave:0,
                harmonic:0.8,
                attack:0.018,
                release:0.22,
                brightness:0.6
            };
        }

        /*
         * 72-79
         * Pipe
         */
        if(program <= 79){

            return {
                wave:0,
                harmonic:0.48,
                attack:0.018,
                release:0.3,
                brightness:0.42
            };
        }

        /*
         * 80-87
         * Synth lead
         */
        if(program <= 87){

            return {
                wave:1,
                harmonic:0.7,
                attack:0.008,
                release:0.2,
                brightness:0.7
            };
        }

        /*
         * 88-95
         * Synth pad
         */
        if(program <= 95){

            return {
                wave:3,
                harmonic:0.5,
                attack:0.08,
                release:0.5,
                brightness:0.4
            };
        }

        /*
         * 96-103
         * FX
         */
        if(program <= 103){

            return {
                wave:2,
                harmonic:0.55,
                attack:0.01,
                release:0.25,
                brightness:0.75
            };
        }

        /*
         * 104-111
         * Ethnic
         */
        if(program <= 111){

            return {
                wave:3,
                harmonic:0.7,
                attack:0.015,
                release:0.3,
                brightness:0.65
            };
        }

        /*
         * 112-119
         * Percussive
         */
        if(program <= 119){

            return {
                wave:2,
                harmonic:0.8,
                attack:0.002,
                release:0.1,
                brightness:0.8
            };
        }

        return {
            wave:0,
            harmonic:0.6,
            attack:0.01,
            release:0.25,
            brightness:0.5
        };
    }


    /* -----------------------------------------------------
       ノート開始
    ----------------------------------------------------- */

    noteOn(
        note,
        velocity,
        program,
        channel,
        pan,
        duration
    ){

        /*
         * BlackMIDI用。
         *
         * 発音数が限界を超えた場合、
         * 最も古い音を消す。
         */

        if(this.voices.length >= this.maxVoices){

            let oldest = 0;
            let oldestAge = this.voices[0].age;

            for(let i=1;i<this.voices.length;i++){

                if(this.voices[i].age < oldestAge){

                    oldest = i;
                    oldestAge = this.voices[i].age;
                }
            }

            this.voices.splice(oldest,1);
        }


        const inst = this.getInstrument(program);

        const freq =
            440 *
            Math.pow(
                2,
                (note - 69) / 12
            );


        /*
         * velocity
         */
        const level =
            Math.max(
                0.02,
                velocity / 127
            );


        /*
         * ドラムチャンネル
         */
        const drum =
            channel === 9;


        this.voices.push({

            note:note,

            freq:freq,

            velocity:level,

            program:program,

            channel:channel,

            pan:Math.max(-1,Math.min(1,pan)),

            duration:Math.max(
                0.01,
                duration
            ),

            age:currentFrame,

            phase:0,

            inst:inst,

            drum:drum,

            time:0
        });
    }


    /* -----------------------------------------------------
       1サンプル処理
    ----------------------------------------------------- */

    process(inputs,outputs){

        const output = outputs[0];

        const left = output[0];
        const right = output[1] || output[0];

        for(
            let i=0;
            i<left.length;
            i++
        ){

            let L = 0;
            let R = 0;


            for(
                let v=this.voices.length-1;
                v>=0;
                v--
            ){

                const voice = this.voices[v];

                voice.time +=
                    1 / sampleRate;


                /*
                 * ADSR
                 */

                let env = 1;

                const attack =
                    voice.inst.attack;

                const release =
                    voice.inst.release;


                if(voice.time < attack){

                    env =
                        voice.time /
                        attack;

                }else if(
                    voice.time >
                    voice.duration - release
                ){

                    const remain =
                        voice.duration -
                        voice.time;

                    env =
                        Math.max(
                            0,
                            remain / release
                        );
                }


                /*
                 * 終了
                 */

                if(
                    voice.time >=
                    voice.duration
                ){

                    this.voices.splice(v,1);

                    continue;
                }


                /*
                 * 音色
                 */

                const f =
                    voice.freq;


                const phase =
                    voice.phase;


                let sample;


                if(voice.drum){

                    /*
                     * 簡易ドラム。
                     * MIDI channel 10
                     */

                    const noise =
                        Math.random() * 2 - 1;

                    const kick =
                        Math.sin(
                            phase * 6.283185
                        );

                    sample =
                        noise * 0.55 +
                        kick * 0.45;

                }else{

                    /*
                     * 基本波
                     */

                    const p =
                        phase -
                        Math.floor(phase);


                    if(voice.inst.wave === 0){

                        sample =
                            Math.sin(
                                2 * Math.PI * p
                            );

                    }else if(
                        voice.inst.wave === 1
                    ){

                        sample =
                            2*p - 1;

                    }else if(
                        voice.inst.wave === 2
                    ){

                        sample =
                            p < 0.5 ? 1 : -1;

                    }else{

                        sample =
                            1 -
                            4 *
                            Math.abs(
                                Math.round(p)-p
                            );
                    }


                    /*
                     * 倍音
                     *
                     * 「電子ブザー」っぽくならない
                     * ように軽く混ぜる。
                     */

                    sample =
                        sample * 0.72 +

                        Math.sin(
                            2*Math.PI*p*2
                        ) *
                        voice.inst.harmonic *
                        0.18 +

                        Math.sin(
                            2*Math.PI*p*3
                        ) *
                        voice.inst.harmonic *
                        0.07;
                }


                /*
                 * velocity + envelope
                 */

                let amp =
                    voice.velocity *
                    env *
                    0.12;


                /*
                 * 高音を少し抑える
                 */

                const highCut =
                    1 /
                    (
                        1 +
                        Math.max(
                            0,
                            voice.freq - 1200
                        ) / 8000
                    );


                amp *= highCut;


                /*
                 * Pan
                 */

                const pan =
                    voice.pan;

                const lGain =
                    Math.cos(
                        (pan+1) *
                        Math.PI / 4
                    );

                const rGain =
                    Math.sin(
                        (pan+1) *
                        Math.PI / 4
                    );


                L +=
                    sample *
                    amp *
                    lGain;

                R +=
                    sample *
                    amp *
                    rGain;


                /*
                 * 位相更新
                 */

                voice.phase +=
                    f / sampleRate;

                if(voice.phase >= 1){
                    voice.phase -= 1;
                }
            }


            /*
             * 軽いソフトクリップ
             */

            left[i] =
                Math.tanh(L);

            right[i] =
                Math.tanh(R);
        }


        currentFrame++;

        return true;
    }
}

let currentFrame = 0;

registerProcessor(
    "blackmidi-synth",
    BlackMIDIProcessor
);
`;


/* =========================================================
   AudioWorklet初期化
========================================================= */

async function initAudio(){

    if(audioCtx && audioWorkletNode){
        return;
    }


    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    /*
     * BlobからAudioWorkletを作る。
     */

    const blob =
        new Blob(
            [workletCode],
            {
                type:"application/javascript"
            }
        );


    const url =
        URL.createObjectURL(blob);


    await audioCtx.audioWorklet.addModule(url);

    URL.revokeObjectURL(url);


    audioWorkletNode =
        new AudioWorkletNode(
            audioCtx,
            "blackmidi-synth",
            {
                numberOfInputs:0,
                numberOfOutputs:1,
                outputChannelCount:[2]
            }
        );


    masterGain =
        audioCtx.createGain();

    masterGain.gain.value =
        0.8;


    /*
     * 音量を急に切らない。
     */

    audioWorkletNode.connect(
        masterGain
    );

    masterGain.connect(
        audioCtx.destination
    );
}


/* =========================================================
   MIDI Parser
========================================================= */

function readU16(data,pos){

    return (
        (data[pos] << 8) |
        data[pos+1]
    );
}


function readU32(data,pos){

    return (
        data[pos] * 16777216 +
        data[pos+1] * 65536 +
        data[pos+2] * 256 +
        data[pos+3]
    );
}


function readVLQ(data,pos){

    let value = 0;
    let count = 0;

    while(pos < data.length && count < 4){

        const b = data[pos++];

        value =
            (value << 7) |
            (b & 0x7f);

        count++;

        if(!(b & 0x80)){
            break;
        }
    }

    return {
        value:value,
        pos:pos
    };
}


/* =========================================================
   MIDI解析
========================================================= */

function parseMIDI(buffer){

    const data =
        new Uint8Array(buffer);


    let pos = 0;


    if(
        data[0] !== 0x4d ||
        data[1] !== 0x54 ||
        data[2] !== 0x68 ||
        data[3] !== 0x64
    ){

        throw new Error(
            "MIDIヘッダーが見つかりません"
        );
    }


    const headerLength =
        readU32(data,4);

    const format =
        readU16(data,8);

    const trackCount =
        readU16(data,10);

    const division =
        readU16(data,12);


    pos =
        8 + headerLength;


    let ppqn;

    if(division & 0x8000){

        /*
         * SMPTE。
         * 普通のMIDIより少ないので
         * ここでは安全側に処理。
         */

        const fps =
            256 -
            ((division >> 8) & 0xff);

        const ticksPerFrame =
            division & 0xff;

        ppqn =
            Math.max(
                1,
                fps * ticksPerFrame
            );

    }else{

        ppqn =
            division & 0x7fff;
    }


    const allEvents = [];

    let globalOrder = 0;


    /*
     * 各トラック解析
     */

    for(
        let track=0;
        track<trackCount;
        track++
    ){

        if(pos + 8 > data.length){
            break;
        }


        if(
            data[pos] !== 0x4d ||
            data[pos+1] !== 0x54 ||
            data[pos+2] !== 0x72 ||
            data[pos+3] !== 0x6b
        ){

            throw new Error(
                "MTrkが見つかりません"
            );
        }


        const trackLength =
            readU32(data,pos+4);

        pos += 8;


        const trackEnd =
            Math.min(
                data.length,
                pos + trackLength
            );


        let tick = 0;
        let runningStatus = 0;

        /*
         * MIDI Program
         */
        const programs =
            new Uint8Array(16);


        /*
         * note-onのスタック
         *
         * 同じ音程が重なるMIDIにも対応。
         */
        const active = new Map();


        while(pos < trackEnd){

            const vlq =
                readVLQ(data,pos);

            tick += vlq.value;
            pos = vlq.pos;


            let status =
                data[pos];


            if(status < 0x80){

                if(!runningStatus){

                    pos++;
                    continue;
                }

                status =
                    runningStatus;

            }else{

                pos++;

                if(
                    status >= 0x80 &&
                    status <= 0xef
                ){

                    runningStatus =
                        status;
                }
            }


            /*
             * Meta
             */

            if(status === 0xff){

                if(pos >= trackEnd){
                    break;
                }

                const type =
                    data[pos++];

                const lenInfo =
                    readVLQ(data,pos);

                const len =
                    lenInfo.value;

                pos =
                    lenInfo.pos;


                if(type === 0x51 && len === 3){

                    const usPerBeat =
                        data[pos] * 65536 +
                        data[pos+1] * 256 +
                        data[pos+2];


                    allEvents.push({
                        type:"tempo",
                        tick:tick,
                        tempo:usPerBeat,
                        order:globalOrder++
                    });
                }


                if(type === 0x2f){

                    pos += len;
                    break;
                }


                pos += len;

                continue;
            }


            /*
             * SysEx
             */

            if(
                status === 0xf0 ||
                status === 0xf7
            ){

                const lenInfo =
                    readVLQ(data,pos);

                pos =
                    lenInfo.pos +
                    lenInfo.value;

                continue;
            }


            /*
             * チャンネルイベント
             */

            const command =
                status & 0xf0;

            const channel =
                status & 0x0f;


            let a = 0;
            let b = 0;


            if(command === 0xc0){

                if(pos >= trackEnd){
                    break;
                }

                programs[channel] =
                    data[pos++];

                continue;
            }


            if(command === 0xd0){

                pos++;

                continue;
            }


            if(pos >= trackEnd){
                break;
            }


            a = data[pos++];

            if(
                command !== 0xd0 &&
                command !== 0xc0
            ){

                if(pos >= trackEnd){
                    break;
                }

                b = data[pos++];
            }


            /*
             * Note On
             */

            if(
                command === 0x90 &&
                b > 0
            ){

                const key =
                    channel + ":" + a;


                let arr =
                    active.get(key);


                if(!arr){

                    arr = [];
                    active.set(key,arr);
                }


                arr.push({
                    tick:tick,
                    velocity:b,
                    channel:channel,
                    program:programs[channel]
                });

            /*
             * Note Off
             */

            }else if(
                command === 0x80 ||
                (
                    command === 0x90 &&
                    b === 0
                )
            ){

                const key =
                    channel + ":" + a;


                const arr =
                    active.get(key);


                if(
                    arr &&
                    arr.length
                ){

                    const on =
                        arr.pop();


                    const length =
                        Math.max(
                            1,
                            tick - on.tick
                        );


                    allEvents.push({
                        type:"note",
                        tick:on.tick,
                        endTick:tick,
                        durationTicks:length,
                        note:a,
                        velocity:on.velocity,
                        channel:on.channel,
                        program:on.program,
                        order:globalOrder++
                    });
                }
            }
        }


        /*
         * 終端まで残ったノートは無視。
         * 壊れたMIDIで異常に長い音を作らない。
         */

        pos =
            trackEnd;
    }


    /*
     * テンポがない場合は120BPM
     */

    const tempos =
        allEvents
            .filter(e => e.type === "tempo")
            .sort(
                (a,b)=>
                    a.tick-b.tick ||
                    a.order-b.order
            );


    if(
        !tempos.length ||
        tempos[0].tick !== 0
    ){

        tempos.unshift({
            type:"tempo",
            tick:0,
            tempo:500000,
            order:-1
        });
    }


    /*
     * 同一tickのテンポを整理
     */

    const tempoMap = [];

    let currentTempo =
        500000;

    let previousTick = 0;
    let previousTime = 0;


    for(const t of tempos){

        if(t.tick < previousTick){
            continue;
        }


        previousTime +=
            (
                t.tick -
                previousTick
            ) *
            currentTempo /
            1000000 /
            ppqn;


        currentTempo =
            t.tempo;


        tempoMap.push({
            tick:t.tick,
            time:previousTime,
            tempo:currentTempo
        });


        previousTick =
            t.tick;
    }


    /*
     * tick → seconds
     */

    function tickToSeconds(tick){

        let lo = 0;
        let hi =
            tempoMap.length - 1;

        let index = 0;


        while(lo <= hi){

            const mid =
                (lo + hi) >> 1;


            if(
                tempoMap[mid].tick <= tick
            ){

                index = mid;
                lo = mid + 1;

            }else{

                hi = mid - 1;
            }
        }


        const base =
            tempoMap[index];


        return (
            base.time +
            (
                tick -
                base.tick
            ) *
            base.tempo /
            1000000 /
            ppqn
        );
    }


    /*
     * ノートだけ取り出す
     */

    const parsed =
        allEvents
            .filter(
                e =>
                    e.type === "note"
            );


    /*
     * 時間変換
     */

    for(const n of parsed){

        n.t =
            tickToSeconds(
                n.tick
            );

        n.endTime =
            tickToSeconds(
                n.endTick
            );

        n.d =
            Math.max(
                0.008,
                n.endTime - n.t
            );
    }


    /*
     * 開始時間順
     */

    parsed.sort(
        (a,b)=>
            a.t-b.t ||
            a.note-b.note
    );


    /*
     * パン。
     *
     * MIDI標準のCCパンを完全実装する代わりに、
     * チャンネル位置を軽く散らす。
     */

    for(const n of parsed){

        if(n.channel === 9){

            n.pan = 0;

        }else{

            n.pan =
                (
                    (n.channel % 7) - 3
                ) / 12;
        }
    }


    notes = parsed;


    /*
     * duration
     */

    cachedDuration = 0;

    if(notes.length){

        let max =
            notes[notes.length-1].endTime;

        cachedDuration =
            Math.max(
                0.1,
                max
            );
    }


    duration =
        cachedDuration;


    return {
        format,
        trackCount,
        ppqn,
        notes:parsed,
        duration:cachedDuration
    };
}


/* =========================================================
   MIDI読み込み
========================================================= */

fInp.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }


        try{

            stopPlayback();


            log(
                "読み込み中..."
            );


            const buffer =
                await file.arrayBuffer();


            const result =
                parseMIDI(buffer);


            currentFileName =
                file.name;


            pBtn.style.display =
                "block";


            pBtn.textContent =
                "▶ 再生";


            isPaused = false;
            pauseTime = 0;


            log(
                file.name +
                " / " +
                result.notes.length.toLocaleString() +
                "音符 / " +
                result.duration.toFixed(2) +
                "秒"
            );


            draw(0);


        }catch(err){

            console.error(err);

            log(
                "エラー: " +
                err.message
            );
        }
    }
);


/* =========================================================
   音声スケジューラ
========================================================= */

function getPlaybackTime(){

    if(!audioCtx){
        return 0;
    }

    return Math.max(
        0,
        audioCtx.currentTime -
        startTime
    );
}


function sendNoteToWorklet(n){

    if(
        !audioWorkletNode ||
        !audioCtx
    ){
        return;
    }


    audioWorkletNode.port.postMessage({

        type:"note",

        note:n.note,

        velocity:n.velocity,

        program:n.program,

        channel:n.channel,

        pan:n.pan,

        duration:n.d
    });
}


/*
 * 音声スケジューラ。
 *
 * 描画とは完全に別。
 *
 * 25msごとに150ms先まで送る。
 */

function scheduleAudio(){

    if(
        !isPlaying ||
        isPaused ||
        !audioCtx
    ){
        return;
    }


    const now =
        getPlaybackTime();


    const until =
        now +
        AUDIO_LOOKAHEAD;


    while(
        audioPointer < notes.length
    ){

        const n =
            notes[audioPointer];


        if(n.t > until){
            break;
        }


        /*
         * 既に開始したノートは、
         * 遅延時に即時再生。
         */

        if(n.t >= now - 0.02){

            sendNoteToWorklet(n);

        }else if(
            n.endTime > now
        ){

            /*
             * 現在位置に少しだけ食い込んでいる
             * ノートは残り時間だけ鳴らす。
             */

            const copy = {
                ...n,
                d:
                    Math.max(
                        0.01,
                        n.endTime - now
                    )
            };

            sendNoteToWorklet(copy);
        }


        audioPointer++;
    }
}


/* =========================================================
   スケジューラ開始
========================================================= */

function startAudioScheduler(){

    stopAudioScheduler();


    audioScheduler =
        setInterval(
            scheduleAudio,
            AUDIO_SCHEDULE_INTERVAL
        );


    /*
     * 最初の一回は即実行
     */

    scheduleAudio();
}


function stopAudioScheduler(){

    if(audioScheduler){

        clearInterval(
            audioScheduler
        );

        audioScheduler = null;
    }
}


/* =========================================================
   再生
========================================================= */

async function startPlayback(){

    if(!notes.length){
        return;
    }


    try{

        await initAudio();


        if(
            audioCtx.state ===
            "suspended"
        ){

            await audioCtx.resume();
        }


        /*
         * 一時停止からの再開
         */

        if(isPaused){

            startTime =
                audioCtx.currentTime -
                pauseTime;

            isPaused = false;

        }else{

            pauseTime = 0;

            audioPointer = 0;

            audioWorkletNode.port.postMessage({
                type:"clear"
            });


            startTime =
                audioCtx.currentTime;
        }


        isPlaying = true;


        pBtn.textContent =
            "⏸ 一時停止";


        startAudioScheduler();


        log(
            "再生中: " +
            currentFileName
        );


        requestAnimationFrame(
            animate
        );


    }catch(err){

        console.error(err);

        log(
            "音声初期化エラー: " +
            err.message
        );
    }
}


/* =========================================================
   一時停止
========================================================= */

function pausePlayback(){

    if(!isPlaying){
        return;
    }


    pauseTime =
        getPlaybackTime();


    isPaused = true;
    isPlaying = false;


    stopAudioScheduler();


    if(audioWorkletNode){

        audioWorkletNode.port.postMessage({
            type:"stop"
        });
    }


    pBtn.textContent =
        "▶ 再生";


    log(
        "一時停止: " +
        pauseTime.toFixed(2) +
        "秒"
    );
}


/* =========================================================
   停止
========================================================= */

function stopPlayback(){

    isPlaying = false;
    isPaused = false;

    pauseTime = 0;

    audioPointer = 0;

    stopAudioScheduler();


    if(audioWorkletNode){

        audioWorkletNode.port.postMessage({
            type:"stop"
        });
    }


    if(pBtn){

        if(notes.length){

            pBtn.textContent =
                "▶ 再生";
        }
    }


    draw(0);
}


/* =========================================================
   再生ボタン
========================================================= */

pBtn.addEventListener(
    "click",
    function(){

        if(isPlaying){

            pausePlayback();

        }else{

            startPlayback();
        }
    }
);


/* =========================================================
   キーボード操作
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        /*
         * Space
         */

        if(
            e.code === "Space" &&
            document.activeElement !== fInp
        ){

            e.preventDefault();


            if(isPlaying){

                pausePlayback();

            }else{

                startPlayback();
            }
        }


        /*
         * Esc
         */

        if(e.code === "Escape"){

            stopPlayback();
        }
    }
);


/* =========================================================
   描画
========================================================= */

function getColor(note){

    return CLRS[
        (
            note.channel +
            note.program
        ) %
        CLRS.length
    ];
}


function draw(currentTime){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    /*
     * 黒背景
     */

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /*
     * ピアノ領域
     */

    const keyboardHeight =
        90;

    kyY =
        h -
        keyboardHeight;


    /*
     * ノート幅
     */

    const noteWidth =
        w / NOTE_CNT;


    /*
     * 表示範囲
     */

    const visibleTop =
        currentTime;


    const visibleBottom =
        currentTime +
        h / SPEED;


    /*
     * 二分探索
     */

    let lo = 0;
    let hi =
        notes.length - 1;

    let startIndex =
        notes.length;


    while(lo <= hi){

        const mid =
            (lo + hi) >> 1;


        if(
            notes[mid].endTime >=
            visibleTop
        ){

            startIndex =
                mid;

            hi =
                mid - 1;

        }else{

            lo =
                mid + 1;
        }
    }


    /*
     * ノート描画
     */

    for(
        let i=startIndex;
        i<notes.length;
        i++
    ){

        const n =
            notes[i];


        if(n.t > visibleBottom){
            break;
        }


        if(n.note < MIN_NOTE){
            continue;
        }

        if(n.note > MAX_NOTE){
            continue;
        }


        const x =
            (
                n.note -
                MIN_NOTE
            ) *
            noteWidth;


        const y =
            kyY -
            (
                n.t -
                currentTime
            ) *
            SPEED;


        const height =
            Math.max(
                2,
                n.d * SPEED
            );


        ctx.fillStyle =
            getColor(n);


        ctx.fillRect(
            x + 1,
            y - height,
            Math.max(
                1,
                noteWidth - 2
            ),
            height
        );
    }


    /*
     * 赤い判定ライン
     */

    ctx.fillStyle =
        "#ff0000";

    ctx.fillRect(
        0,
        kyY,
        w,
        2
    );


    /*
     * ピアノ鍵盤
     */

    drawKeyboard(
        w,
        keyboardHeight,
        noteWidth
    );
}


/* =========================================================
   ピアノ鍵盤
========================================================= */

function isBlackKey(note){

    const x =
        note % 12;

    return (
        x === 1 ||
        x === 3 ||
        x === 6 ||
        x === 8 ||
        x === 10
    );
}


function drawKeyboard(
    w,
    keyboardHeight,
    noteWidth
){

    const whiteNotes = [];


    for(
        let n=MIN_NOTE;
        n<=MAX_NOTE;
        n++
    ){

        if(!isBlackKey(n)){

            whiteNotes.push(n);
        }
    }


    const whiteWidth =
        w /
        whiteNotes.length;


    /*
     * 白鍵
     */

    ctx.fillStyle =
        "#eeeeee";


    for(
        let i=0;
        i<whiteNotes.length;
        i++
    ){

        ctx.fillRect(
            i * whiteWidth,
            kyY,
            whiteWidth - 1,
            keyboardHeight
        );
    }


    /*
     * 黒鍵
     */

    ctx.fillStyle =
        "#111111";


    for(
        let n=MIN_NOTE;
        n<=MAX_NOTE;
        n++
    ){

        if(!isBlackKey(n)){
            continue;
        }


        /*
         * 左側の白鍵数
         */

        let whiteBefore = 0;


        for(
            let p=MIN_NOTE;
            p<n;
            p++
        ){

            if(!isBlackKey(p)){
                whiteBefore++;
            }
        }


        const x =
            whiteBefore *
            whiteWidth -
            whiteWidth * 0.3;


        ctx.fillRect(
            x,
            kyY,
            whiteWidth * 0.6,
            keyboardHeight * 0.62
        );
    }
}


/* =========================================================
   アニメーション
========================================================= */

let lastDrawTime = 0;

function animate(timestamp){

    if(!isPlaying){
        return;
    }


    /*
     * 描画FPSを少し抑える。
     *
     * 音声は別スレッドなので、
     * ここを抑えても音声スケジュールには影響しない。
     */

    if(
        timestamp -
        lastDrawTime >= 16
    ){

        lastDrawTime =
            timestamp;


        const t =
            getPlaybackTime();


        draw(t);


        if(
            t >= duration
        ){

            stopPlayback();

            log(
                "再生終了"
            );

            return;
        }
    }


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   初期表示
========================================================= */

draw(0);


/* =========================================================
   ページ終了時
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopAudioScheduler();

        if(audioCtx){

            audioCtx.close();
        }
    }
);

</script>

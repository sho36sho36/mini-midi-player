<script>

"use strict";


/* =========================================================
   DOM
========================================================= */

const cvs =
    document.getElementById("cvs");

const ctx =
    cvs.getContext("2d", {
        alpha:false
    });

const fInp =
    document.getElementById("fInp");

const pBtn =
    document.getElementById("pBtn");

const logDiv =
    document.getElementById("log");


/* =========================================================
   表示設定
========================================================= */

const MIN_NOTE = 36;
const MAX_NOTE = 96;

const NOTE_CNT =
    MAX_NOTE - MIN_NOTE + 1;

const SPEED = 250;


/* =========================================================
   音声設定
========================================================= */

/*
 * ここが重要。
 *
 * BlackMIDIは数千～数万音符になることがあるので、
 * 「同時に鳴らす音」の最大数だけを制限する。
 *
 * MIDIファイルの音符自体は削除しない。
 */
const MAX_VOICES = 72;


/*
 * 音声先読み。
 *
 * 描画が一瞬重くなっても、
 * 既に音声を予約済みにしておく。
 */
const AUDIO_LOOKAHEAD = 0.18;


/*
 * スケジューラ間隔。
 */
const AUDIO_TIMER_MS = 25;


/*
 * 極端に短い音符用。
 */
const MIN_NOTE_DURATION = 0.012;


/* =========================================================
   色
========================================================= */

const CLRS = [
    "#38bdf8",
    "#f43f5e",
    "#10b981",
    "#fbbf24",
    "#a855f7",
    "#ec4899",
    "#f97316",
    "#14b8a6"
];


/* =========================================================
   状態
========================================================= */

let audioCtx = null;

let masterGain = null;

let compressor = null;

let isPlaying = false;

let isPaused = false;

let startTime = 0;

let pauseTime = 0;

let notes = [];

let duration = 0;

let audioPointer = 0;

let schedulerTimer = null;

let animationId = null;

let currentFileName = "";

let kyY = 0;


/*
 * 現在鳴っているネイティブ音声ノード。
 */
let activeVoices = [];


/*
 * 世代番号。
 *
 * 古い再生の終了イベントが
 * 新しいMIDIに干渉しないようにする。
 */
let playbackGeneration = 0;


/* =========================================================
   Canvas
========================================================= */

function resizeCanvas(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    cvs.width =
        Math.floor(w * dpr);

    cvs.height =
        Math.floor(h * dpr);

    cvs.style.width =
        w + "px";

    cvs.style.height =
        h + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();


/* =========================================================
   Log
========================================================= */

function log(text){

    logDiv.textContent =
        "ログ: " + text;
}


/* =========================================================
   MIDI周波数
========================================================= */

function noteToFreq(note){

    return 440 *
        Math.pow(
            2,
            (note - 69) / 12
        );
}


/* =========================================================
   MIDI parser utilities
========================================================= */

function readU16(data,pos){

    return (
        (data[pos] << 8) |
        data[pos + 1]
    );
}


function readU32(data,pos){

    return (
        data[pos] * 16777216 +
        data[pos + 1] * 65536 +
        data[pos + 2] * 256 +
        data[pos + 3]
    );
}


function readVLQ(data,pos){

    let value = 0;

    for(
        let i = 0;
        i < 4 && pos < data.length;
        i++
    ){

        const b =
            data[pos++];

        value =
            (value << 7) |
            (b & 0x7f);

        if(!(b & 0x80)){
            break;
        }
    }

    return {
        value,
        pos
    };
}


/* =========================================================
   MIDI parser
========================================================= */

function parseMIDI(buffer){

    const data =
        new Uint8Array(buffer);

    if(
        data.length < 14 ||
        data[0] !== 0x4d ||
        data[1] !== 0x54 ||
        data[2] !== 0x68 ||
        data[3] !== 0x64
    ){

        throw new Error(
            "MIDIヘッダーが見つかりません"
        );
    }


    const headerLength =
        readU32(data,4);

    const format =
        readU16(data,8);

    const trackCount =
        readU16(data,10);

    const division =
        readU16(data,12);


    let pos =
        8 + headerLength;


    let ppqn;


    /*
     * SMPTE形式
     */
    if(division & 0x8000){

        const fps =
            256 -
            ((division >> 8) & 0xff);

        const ticksPerFrame =
            division & 0xff;

        ppqn =
            Math.max(
                1,
                fps * ticksPerFrame
            );

    }else{

        ppqn =
            division & 0x7fff;
    }


    const events = [];

    let order = 0;


    /* =====================================================
       Track
    ===================================================== */

    for(
        let trackIndex = 0;
        trackIndex < trackCount;
        trackIndex++
    ){

        if(pos + 8 > data.length){
            break;
        }


        if(
            data[pos] !== 0x4d ||
            data[pos + 1] !== 0x54 ||
            data[pos + 2] !== 0x72 ||
            data[pos + 3] !== 0x6b
        ){

            throw new Error(
                "MTrkが見つかりません"
            );
        }


        const trackLength =
            readU32(data,pos + 4);

        pos += 8;


        const trackEnd =
            Math.min(
                data.length,
                pos + trackLength
            );


        let tick = 0;

        let runningStatus = 0;


        /*
         * チャンネルごとのProgram。
         */
        const programs =
            new Uint8Array(16);


        /*
         * 同一音程の重なりに対応。
         */
        const active =
            new Map();


        while(pos < trackEnd){

            const vlq =
                readVLQ(data,pos);

            tick +=
                vlq.value;

            pos =
                vlq.pos;


            let status =
                data[pos];


            /*
             * Running Status
             */
            if(status < 0x80){

                if(!runningStatus){

                    pos++;
                    continue;
                }

                status =
                    runningStatus;

            }else{

                pos++;

                if(
                    status >= 0x80 &&
                    status <= 0xef
                ){

                    runningStatus =
                        status;
                }
            }


            /* ------------------------------------------------
               Meta
            ------------------------------------------------ */

            if(status === 0xff){

                if(pos >= trackEnd){
                    break;
                }


                const metaType =
                    data[pos++];


                const info =
                    readVLQ(data,pos);

                const len =
                    info.value;

                pos =
                    info.pos;


                if(
                    metaType === 0x51 &&
                    len === 3
                ){

                    const tempo =
                        data[pos] * 65536 +
                        data[pos + 1] * 256 +
                        data[pos + 2];


                    events.push({

                        type:"tempo",

                        tick,

                        tempo,

                        order:order++
                    });
                }


                pos += len;


                if(metaType === 0x2f){
                    break;
                }


                continue;
            }


            /* ------------------------------------------------
               SysEx
            ------------------------------------------------ */

            if(
                status === 0xf0 ||
                status === 0xf7
            ){

                const info =
                    readVLQ(data,pos);

                pos =
                    info.pos +
                    info.value;

                continue;
            }


            const command =
                status & 0xf0;

            const channel =
                status & 0x0f;


            /* ------------------------------------------------
               Program Change
            ------------------------------------------------ */

            if(command === 0xc0){

                if(pos < trackEnd){

                    programs[channel] =
                        data[pos++];
                }

                continue;
            }


            /* ------------------------------------------------
               Channel Pressure
            ------------------------------------------------ */

            if(command === 0xd0){

                pos++;
                continue;
            }


            if(pos >= trackEnd){
                break;
            }


            const a =
                data[pos++];


            let b = 0;


            if(pos < trackEnd){

                b =
                    data[pos++];
            }


            /* ------------------------------------------------
               Note On
            ------------------------------------------------ */

            if(
                command === 0x90 &&
                b > 0
            ){

                const key =
                    channel +
                    ":" +
                    a;


                let list =
                    active.get(key);


                if(!list){

                    list = [];

                    active.set(
                        key,
                        list
                    );
                }


                list.push({

                    tick,

                    velocity:b,

                    channel,

                    program:
                        programs[channel]
                });


                continue;
            }


            /* ------------------------------------------------
               Note Off
            ------------------------------------------------ */

            if(
                command === 0x80 ||
                (
                    command === 0x90 &&
                    b === 0
                )
            ){

                const key =
                    channel +
                    ":" +
                    a;


                const list =
                    active.get(key);


                if(
                    list &&
                    list.length
                ){

                    const on =
                        list.pop();


                    const noteLength =
                        Math.max(
                            1,
                            tick - on.tick
                        );


                    events.push({

                        type:"note",

                        tick:on.tick,

                        endTick:tick,

                        durationTicks:
                            noteLength,

                        note:a,

                        velocity:
                            on.velocity,

                        channel:
                            on.channel,

                        program:
                            on.program,

                        order:
                            order++
                    });
                }


                continue;
            }
        }


        pos =
            trackEnd;
    }


    /* =====================================================
       Tempo map
    ===================================================== */

    const tempoEvents =
        events
            .filter(
                e =>
                    e.type === "tempo"
            )
            .sort(
                (a,b) =>
                    a.tick - b.tick ||
                    a.order - b.order
            );


    if(
        !tempoEvents.length ||
        tempoEvents[0].tick !== 0
    ){

        tempoEvents.unshift({

            type:"tempo",

            tick:0,

            tempo:500000,

            order:-1
        });
    }


    const tempoMap = [];

    let lastTick = 0;

    let lastTime = 0;

    let currentTempo = 500000;


    for(
        let i=0;
        i<tempoEvents.length;
        i++
    ){

        const e =
            tempoEvents[i];


        if(e.tick < lastTick){
            continue;
        }


        lastTime +=
            (
                e.tick -
                lastTick
            ) *
            currentTempo /
            1000000 /
            ppqn;


        currentTempo =
            e.tempo;


        tempoMap.push({

            tick:e.tick,

            time:lastTime,

            tempo:currentTempo
        });


        lastTick =
            e.tick;
    }


    /* =====================================================
       Tick → 秒
    ===================================================== */

    function tickToSeconds(tick){

        let lo = 0;

        let hi =
            tempoMap.length - 1;

        let index = 0;


        while(lo <= hi){

            const mid =
                (lo + hi) >> 1;


            if(
                tempoMap[mid].tick <=
                tick
            ){

                index =
                    mid;

                lo =
                    mid + 1;

            }else{

                hi =
                    mid - 1;
            }
        }


        const base =
            tempoMap[index];


        return (
            base.time +
            (
                tick -
                base.tick
            ) *
            base.tempo /
            1000000 /
            ppqn
        );
    }


    /* =====================================================
       Note生成
    ===================================================== */

    const result = [];


    for(
        let i=0;
        i<events.length;
        i++
    ){

        const e =
            events[i];


        if(e.type !== "note"){
            continue;
        }


        const t =
            tickToSeconds(
                e.tick
            );


        const endTime =
            tickToSeconds(
                e.endTick
            );


        const d =
            Math.max(
                MIN_NOTE_DURATION,
                endTime - t
            );


        result.push({

            t,

            endTime,

            d,

            note:e.note,

            velocity:e.velocity,

            channel:e.channel,

            program:e.program,

            pan:
                e.channel === 9
                ? 0
                :
                (
                    (
                        e.channel % 7
                    ) - 3
                ) / 12
        });
    }


    /*
     * 時間順
     */
    result.sort(
        (a,b) =>
            a.t - b.t ||
            a.note - b.note
    );


    notes =
        result;


    duration =
        result.length
        ? result[result.length - 1].endTime
        : 0;


    return {
        format,
        trackCount,
        ppqn,
        notes:result,
        duration
    };
}


/* =========================================================
   Audio初期化
========================================================= */

async function initAudio(){

    if(audioCtx){

        if(
            audioCtx.state ===
            "suspended"
        ){

            await audioCtx.resume();
        }

        return;
    }


    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    /*
     * マスター
     */
    masterGain =
        audioCtx.createGain();

    masterGain.gain.value =
        0.72;


    /*
     * コンプレッサー。
     *
     * 大量の音でクリップして
     * 「バチッ」となるのを抑える。
     */
    compressor =
        audioCtx.createDynamicsCompressor();

    compressor.threshold.value =
        -12;

    compressor.knee.value =
        18;

    compressor.ratio.value =
        4;

    compressor.attack.value =
        0.003;

    compressor.release.value =
        0.15;


    masterGain.connect(
        compressor
    );

    compressor.connect(
        audioCtx.destination
    );


    await audioCtx.resume();
}


/* =========================================================
   MIDI Program → 音色
========================================================= */

function getInstrument(program){

    /*
     * GM 0-7 Piano
     */
    if(program <= 7){

        return {
            wave:"triangle",
            gain:0.17,
            attack:0.003,
            release:0.12,
            detune:0
        };
    }


    /*
     * 8-15 Chromatic Percussion
     */
    if(program <= 15){

        return {
            wave:"sine",
            gain:0.18,
            attack:0.001,
            release:0.08,
            detune:0
        };
    }


    /*
     * 16-23 Organ
     */
    if(program <= 23){

        return {
            wave:"sine",
            gain:0.12,
            attack:0.012,
            release:0.20,
            detune:0
        };
    }


    /*
     * 24-31 Guitar
     */
    if(program <= 31){

        return {
            wave:"triangle",
            gain:0.14,
            attack:0.003,
            release:0.14,
            detune:0
        };
    }


    /*
     * 32-39 Bass
     */
    if(program <= 39){

        return {
            wave:"sawtooth",
            gain:0.11,
            attack:0.004,
            release:0.16,
            detune:-2
        };
    }


    /*
     * 40-47 Strings
     */
    if(program <= 47){

        return {
            wave:"sawtooth",
            gain:0.07,
            attack:0.045,
            release:0.30,
            detune:0
        };
    }


    /*
     * 48-55 Ensemble
     */
    if(program <= 55){

        return {
            wave:"triangle",
            gain:0.08,
            attack:0.035,
            release:0.28,
            detune:0
        };
    }


    /*
     * 56-63 Brass
     */
    if(program <= 63){

        return {
            wave:"sawtooth",
            gain:0.08,
            attack:0.018,
            release:0.14,
            detune:0
        };
    }


    /*
     * 64-71 Reed
     */
    if(program <= 71){

        return {
            wave:"square",
            gain:0.055,
            attack:0.012,
            release:0.18,
            detune:0
        };
    }


    /*
     * 72-79 Pipe
     */
    if(program <= 79){

        return {
            wave:"sine",
            gain:0.13,
            attack:0.018,
            release:0.24,
            detune:0
        };
    }


    /*
     * 80-87 Synth Lead
     */
    if(program <= 87){

        return {
            wave:"sawtooth",
            gain:0.075,
            attack:0.004,
            release:0.15,
            detune:0
        };
    }


    /*
     * 88-95 Synth Pad
     */
    if(program <= 95){

        return {
            wave:"triangle",
            gain:0.065,
            attack:0.07,
            release:0.4,
            detune:0
        };
    }


    /*
     * 96-103 FX
     */
    if(program <= 103){

        return {
            wave:"square",
            gain:0.055,
            attack:0.008,
            release:0.18,
            detune:0
        };
    }


    /*
     * 104-111 Ethnic
     */
    if(program <= 111){

        return {
            wave:"triangle",
            gain:0.11,
            attack:0.008,
            release:0.20,
            detune:0
        };
    }


    /*
     * 112-119 Percussive
     */
    if(program <= 119){

        return {
            wave:"square",
            gain:0.07,
            attack:0.001,
            release:0.08,
            detune:0
        };
    }


    return {
        wave:"triangle",
        gain:0.1,
        attack:0.01,
        release:0.2,
        detune:0
    };
}


/* =========================================================
   Voice cleanup
========================================================= */

function cleanupVoices(now){

    let write = 0;


    for(
        let i=0;
        i<activeVoices.length;
        i++
    ){

        const voice =
            activeVoices[i];


        if(
            voice.endTime >
            now - 0.05
        ){

            activeVoices[write++] =
                voice;

        }
    }


    activeVoices.length =
        write;
}


/* =========================================================
   音声密度判定
========================================================= */

/*
 * これがBlackMIDI対策。
 *
 * 通常のMIDI:
 *     ほぼ全部再生
 *
 * BlackMIDI:
 *     一瞬に数百音来る
 *
 * その場合、velocityの低い音を
 * 優先的に省略する。
 *
 * MIDIデータそのものは削除しない。
 */

function shouldPlayNote(index){

    const n =
        notes[index];


    /*
     * 通常時は全部。
     */
    let count = 0;


    const time =
        n.t;


    /*
     * 前後8msの音符数を確認。
     */
    for(
        let i=index-1;
        i>=0;
        i--
    ){

        if(
            time -
            notes[i].t >
            0.008
        ){
            break;
        }

        count++;
    }


    for(
        let i=index+1;
        i<notes.length;
        i++
    ){

        if(
            notes[i].t -
            time >
            0.008
        ){
            break;
        }

        count++;
    }


    /*
     * 普通のポリフォニー。
     */
    if(count <= MAX_VOICES){
        return true;
    }


    /*
     * BlackMIDI密集部分。
     *
     * velocityが低い音を削る。
     */
    const threshold =
        Math.min(
            120,
            45 +
            (
                count -
                MAX_VOICES
            ) * 2
        );


    return n.velocity >= threshold;
}


/* =========================================================
   ドラム音
========================================================= */

function playDrum(n, when){

    if(!audioCtx){
        return;
    }


    /*
     * ドラムはOscillator + Gainだけ。
     */
    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    const velocity =
        n.velocity / 127;


    const duration =
        Math.min(
            0.18,
            Math.max(
                0.025,
                n.d
            )
        );


    /*
     * MIDIノートによって
     * ざっくり音色を変える。
     */
    if(n.note === 36){

        osc.type =
            "sine";

        osc.frequency.setValueAtTime(
            150,
            when
        );

        osc.frequency.exponentialRampToValueAtTime(
            48,
            when + duration
        );

    }else if(n.note === 38){

        osc.type =
            "triangle";

        osc.frequency.setValueAtTime(
            180,
            when
        );

        osc.frequency.exponentialRampToValueAtTime(
            90,
            when + duration
        );

    }else{

        osc.type =
            "square";

        osc.frequency.setValueAtTime(
            500 +
            (
                n.note % 20
            ) * 30,
            when
        );
    }


    gain.gain.setValueAtTime(
        0.0001,
        when
    );

    gain.gain.linearRampToValueAtTime(
        0.12 * velocity,
        when + 0.002
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        when + duration
    );


    osc.connect(gain);
    gain.connect(masterGain);


    osc.start(when);

    osc.stop(
        when +
        duration +
        0.01
    );


    activeVoices.push({

        osc,

        gain,

        endTime:
            when +
            duration
    });
}


/* =========================================================
   通常音
========================================================= */

function playNote(n, when){

    if(!audioCtx){
        return;
    }


    /*
     * ドラム
     */
    if(n.channel === 9){

        playDrum(
            n,
            when
        );

        return;
    }


    const instrument =
        getInstrument(
            n.program
        );


    const osc =
        audioCtx.createOscillator();


    const gain =
        audioCtx.createGain();


    /*
     * MIDI velocity
     */
    const velocity =
        n.velocity / 127;


    /*
     * 高音量すぎないように。
     */
    const peak =
        instrument.gain *
        velocity;


    /*
     * 周波数
     */
    const freq =
        noteToFreq(
            n.note
        );


    osc.type =
        instrument.wave;


    osc.frequency.setValueAtTime(
        freq,
        when
    );


    /*
     * Programごとの軽いデチューン。
     */
    if(instrument.detune){

        osc.detune.setValueAtTime(
            instrument.detune,
            when
        );
    }


    /*
     * パン。
     */
    const panner =
        audioCtx.createStereoPanner();

    panner.pan.setValueAtTime(
        n.pan,
        when
    );


    /*
     * ADSR
     */
    const attack =
        Math.min(
            instrument.attack,
            n.d * 0.35
        );


    const release =
        Math.min(
            instrument.release,
            n.d * 0.45
        );


    const end =
        when +
        Math.max(
            MIN_NOTE_DURATION,
            n.d
        );


    const releaseStart =
        Math.max(
            when + attack,
            end - release
        );


    gain.gain.setValueAtTime(
        0.0001,
        when
    );


    gain.gain.linearRampToValueAtTime(
        Math.max(
            0.0001,
            peak
        ),
        when + attack
    );


    /*
     * サステイン。
     */
    gain.gain.setValueAtTime(
        Math.max(
            0.0001,
            peak * 0.72
        ),
        releaseStart
    );


    /*
     * リリース。
     */
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        end
    );


    osc.connect(gain);

    gain.connect(panner);

    panner.connect(masterGain);


    /*
     * ネイティブAudioContextに
     * 正確な時間で予約。
     */
    osc.start(when);

    osc.stop(
        end + 0.015
    );


    activeVoices.push({

        osc,

        gain,

        panner,

        endTime:end
    });
}


/* =========================================================
   Audio scheduling
========================================================= */

function getCurrentPlaybackTime(){

    if(!audioCtx){
        return 0;
    }


    return Math.max(
        0,
        audioCtx.currentTime -
        startTime
    );
}


/* =========================================================
   音声を先読み
========================================================= */

function scheduleAudio(){

    if(
        !isPlaying ||
        isPaused ||
        !audioCtx
    ){
        return;
    }


    const now =
        getCurrentPlaybackTime();


    const scheduleUntil =
        now +
        AUDIO_LOOKAHEAD;


    cleanupVoices(
        audioCtx.currentTime
    );


    while(
        audioPointer <
        notes.length
    ){

        const n =
            notes[audioPointer];


        /*
         * まだ先。
         */
        if(
            n.t >
            scheduleUntil
        ){
            break;
        }


        /*
         * 現在位置より大幅に過去なら
         * 音を飛ばす。
         */
        if(
            n.endTime <
            now
        ){

            audioPointer++;
            continue;
        }


        /*
         * 既に予約済み。
         */
        if(
            activeVoices.length <
            MAX_VOICES
        ){

            if(
                shouldPlayNote(
                    audioPointer
                )
            ){

                const delay =
                    n.t - now;


                /*
                 * 既に少し過ぎていたら
                 * 現在時刻に近いところから。
                 */
                const when =
                    audioCtx.currentTime +
                    Math.max(
                        0.001,
                        delay
                    );


                playNote(
                    n,
                    when
                );
            }
        }


        audioPointer++;
    }
}


/* =========================================================
   Scheduler
========================================================= */

function startScheduler(){

    stopScheduler();


    schedulerTimer =
        setInterval(
            scheduleAudio,
            AUDIO_TIMER_MS
        );


    scheduleAudio();
}


function stopScheduler(){

    if(
        schedulerTimer !== null
    ){

        clearInterval(
            schedulerTimer
        );

        schedulerTimer =
            null;
    }
}


/* =========================================================
   Audio stop
========================================================= */

function stopAllVoices(){

    for(
        let i=0;
        i<activeVoices.length;
        i++
    ){

        const v =
            activeVoices[i];


        try{

            if(v.gain){

                v.gain.gain.cancelScheduledValues(
                    0
                );

                v.gain.gain.setValueAtTime(
                    0.0001,
                    audioCtx.currentTime
                );
            }

            v.osc.stop(
                audioCtx.currentTime +
                0.01
            );

        }catch(e){

            /*
             * 既に停止している音は無視。
             */
        }
    }


    activeVoices.length = 0;
}


/* =========================================================
   再生
========================================================= */

async function startPlayback(){

    if(!notes.length){
        return;
    }


    await initAudio();


    playbackGeneration++;


    /*
     * 一時停止からの再開
     */
    if(isPaused){

        startTime =
            audioCtx.currentTime -
            pauseTime;


        isPaused = false;

    }else{

        stopAllVoices();

        audioPointer = 0;

        startTime =
            audioCtx.currentTime;
    }


    isPlaying = true;


    pBtn.textContent =
        "⏸ 一時停止";


    log(
        "再生中: " +
        currentFileName
    );


    startScheduler();


    if(animationId === null){

        animationId =
            requestAnimationFrame(
                animate
            );
    }
}


/* =========================================================
   Pause
========================================================= */

function pausePlayback(){

    if(!isPlaying){
        return;
    }


    pauseTime =
        getCurrentPlaybackTime();


    isPlaying = false;

    isPaused = true;


    stopScheduler();


    stopAllVoices();


    pBtn.textContent =
        "▶ 再生";


    log(
        "一時停止: " +
        pauseTime.toFixed(2) +
        "秒"
    );
}


/* =========================================================
   Stop
========================================================= */

function stopPlayback(){

    isPlaying = false;

    isPaused = false;

    pauseTime = 0;

    audioPointer = 0;


    stopScheduler();


    if(
        audioCtx &&
        activeVoices.length
    ){

        stopAllVoices();
    }


    pBtn.textContent =
        "▶ 再生";


    draw(0);
}


/* =========================================================
   Play button
========================================================= */

pBtn.addEventListener(
    "click",
    function(){

        if(isPlaying){

            pausePlayback();

        }else{

            startPlayback();
        }
    }
);


/* =========================================================
   File load
========================================================= */

fInp.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }


        try{

            stopPlayback();


            log(
                "読み込み中..."
            );


            const buffer =
                await file.arrayBuffer();


            const result =
                parseMIDI(buffer);


            currentFileName =
                file.name;


            pBtn.style.display =
                "block";


            log(
                file.name +
                " / " +
                result.notes.length.toLocaleString() +
                "音符 / " +
                result.duration.toFixed(2) +
                "秒"
            );


            draw(0);

        }catch(error){

            console.error(error);

            log(
                "エラー: " +
                error.message
            );
        }
    }
);


/* =========================================================
   Keyboard
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        if(e.code === "Space"){

            e.preventDefault();


            if(isPlaying){

                pausePlayback();

            }else{

                startPlayback();
            }
        }


        if(e.code === "Escape"){

            stopPlayback();
        }
    }
);


/* =========================================================
   描画
========================================================= */

function getColor(note){

    return CLRS[
        (
            note.channel +
            note.program
        ) %
        CLRS.length
    ];
}


/* =========================================================
   Black key
========================================================= */

function isBlackKey(note){

    const n =
        note % 12;

    return (
        n === 1 ||
        n === 3 ||
        n === 6 ||
        n === 8 ||
        n === 10
    );
}


/* =========================================================
   Keyboard drawing
========================================================= */

function drawKeyboard(
    w,
    keyboardHeight
){

    const whiteCount =
        36;


    const whiteWidth =
        w / whiteCount;


    /*
     * 白鍵
     */
    ctx.fillStyle =
        "#eeeeee";


    let whiteIndex = 0;


    for(
        let note=MIN_NOTE;
        note<=MAX_NOTE;
        note++
    ){

        if(
            isBlackKey(note)
        ){
            continue;
        }


        ctx.fillRect(
            whiteIndex *
            whiteWidth,

            kyY,

            whiteWidth - 1,

            keyboardHeight
        );


        whiteIndex++;
    }


    /*
     * 黒鍵
     */
    ctx.fillStyle =
        "#111";


    whiteIndex = 0;


    for(
        let note=MIN_NOTE;
        note<=MAX_NOTE;
        note++
    ){

        if(
            isBlackKey(note)
        ){

            const x =
                whiteIndex *
                whiteWidth -
                whiteWidth * 0.3;


            ctx.fillRect(
                x,

                kyY,

                whiteWidth * 0.6,

                keyboardHeight * 0.62
            );

        }else{

            whiteIndex++;
        }
    }
}


/* =========================================================
   Draw
========================================================= */

function draw(currentTime){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    /*
     * 背景
     */
    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    const keyboardHeight =
        90;


    kyY =
        h -
        keyboardHeight;


    const noteWidth =
        w / NOTE_CNT;


    const visibleBottom =
        currentTime +
        h / SPEED;


    /*
     * 二分探索
     */
    let lo = 0;

    let hi =
        notes.length - 1;

    let first =
        notes.length;


    while(lo <= hi){

        const mid =
            (lo + hi) >> 1;


        if(
            notes[mid].endTime >=
            currentTime
        ){

            first =
                mid;

            hi =
                mid - 1;

        }else{

            lo =
                mid + 1;
        }
    }


    /*
     * ノート
     */
    for(
        let i=first;
        i<notes.length;
        i++
    ){

        const n =
            notes[i];


        if(
            n.t >
            visibleBottom
        ){
            break;
        }


        if(
            n.note < MIN_NOTE ||
            n.note > MAX_NOTE
        ){
            continue;
        }


        const x =
            (
                n.note -
                MIN_NOTE
            ) *
            noteWidth;


        const y =
            kyY -
            (
                n.t -
                currentTime
            ) *
            SPEED;


        const height =
            Math.max(
                2,
                n.d *
                SPEED
            );


        ctx.fillStyle =
            getColor(n);


        ctx.fillRect(
            x + 1,

            y - height,

            Math.max(
                1,
                noteWidth - 2
            ),

            height
        );
    }


    /*
     * 赤ライン
     */
    ctx.fillStyle =
        "#ff0000";


    ctx.fillRect(
        0,
        kyY,
        w,
        2
    );


    /*
     * 鍵盤
     */
    drawKeyboard(
        w,
        keyboardHeight
    );
}


/* =========================================================
   Animation
========================================================= */

function animate(){

    if(!isPlaying){

        animationId =
            null;

        return;
    }


    const currentTime =
        getCurrentPlaybackTime();


    draw(currentTime);


    /*
     * 終了
     */
    if(
        currentTime >=
        duration
    ){

        stopPlayback();

        log(
            "再生終了"
        );


        animationId =
            null;

        return;
    }


    animationId =
        requestAnimationFrame(
            animate
        );
}


/* =========================================================
   初期描画
========================================================= */

draw(0);


/* =========================================================
   終了
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopScheduler();

        if(audioCtx){

            try{
                audioCtx.close();
            }catch(e){}
        }
    }
);

</script>

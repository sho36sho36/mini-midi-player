<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>超軽量 MIDI Viewer</title>
    <style>
        body{margin:0;background:#121212;color:#fff;font-family:sans-serif;overflow:hidden;position:fixed;width:100%;height:100%;}
        #ctl{position:absolute;top:10px;left:10px;z-index:10;display:flex;gap:10px;}
        input[type="file"]{display:none;}
        .btn{background:#2563eb;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:bold;border:none;}
        canvas{display:block;width:100vw;height:100vh;}
        #log{position:absolute;bottom:110px;left:10px;right:10px;background:rgba(0,0,0,0.8);color:#00ff00;font-family:monospace;font-size:11px;padding:6px;max-height:50px;z-index:20;border-radius:4px;pointer-events:none;}
    </style>
</head>
<body>
    <div id="ctl">
        <label class="btn" for="fInp">📁 MIDIを開く</label>
        <input type="file" id="fInp" accept=".mid,.midi">
        <button class="btn" id="pBtn" style="display:none;">▶ 再生</button>
    </div>
    <div id="log">ログ: 準備完了。MIDIファイルを選択してください。</div>
    <canvas id="cvs"></canvas>

<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
const fInp = document.getElementById('fInp');
const pBtn = document.getElementById('pBtn');
const logDiv = document.getElementById('log');

const MIN_NOTE = 36;
const MAX_NOTE = 96;
const NOTE_CNT = MAX_NOTE - MIN_NOTE + 1;
const SPEED = 200;

let audioCtx = null;
let isPlaying = false;
let startTime = 0;
let pauseTime = 0;
let notes = [];
let kyY = 0;

function showLog(m) { 
    logDiv.innerText = "ログ: " + m; 
}

window.onerror = function(m, s, l) { 
    showLog("エラー: " + m + " (L:" + l + ")"); 
    return false; 
};

function resize() {
    cvs.width = window.innerWidth * window.devicePixelRatio;
    cvs.height = window.innerHeight * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    kyY = window.innerHeight - 100;
    draw(0);
}
window.addEventListener('resize', resize);
resize();

function playTone(n, d) {
    if (!audioCtx) return;
    const f = 440 * Math.pow(2, (n - 69) / 12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + d);
}

function readVLQ(v, o) {
    let val = 0;
    let idx = 0;
    while (true) {
        let b = v.getUint8(o + idx);
        idx = idx + 1;
        val = (val << 7) | (b & 127);
        if ((b & 128) === 0) break;
    }
    return { val: val, idx: idx };
}

function parseMIDI(buf) {
    const v = new DataView(buf);
    let off = 0;
    if (v.getUint32(0) !== 0x4D546864) throw new Error("無効なMIDIファイルです");
    
    const hLen = v.getUint32(4);
    const tCnt = v.getUint16(10);
    const tDiv = v.getUint16(12);
    
    if (tDiv & 0x8000) throw new Error("未対応の形式です");
    
    off = 8 + hLen;
    let res = [];
    let bpm = 120;
    
    for (let t = 0; t < tCnt; t++) {
        if (off >= v.byteLength) break;
        if (v.getUint32(off) !== 0x4D54726B) {
            off = off + 8 + v.getUint32(off + 4);
            continue;
        }
        
        const tLen = v.getUint32(off + 4);
        let tOff = off + 8;
        const tEnd = tOff + tLen;
        let cSec = 0;
        let act = {};
        let rStat = 0;
        
        while (tOff < tEnd) {
            let vlq = readVLQ(v, tOff);
            tOff = tOff + vlq.idx;
            cSec = cSec + (vlq.val * (60 / (bpm * tDiv)));
            
            let stat = v.getUint8(tOff);
            if (stat & 128) {
                rStat = stat;
                tOff = tOff + 1;
            } else {
                stat = rStat;
            }
            
            let mType = stat & 240;
            
            if (mType === 144 || mType === 128) {
                let n = v.getUint8(tOff);
                let vel = v.getUint8(tOff + 1);
                tOff = tOff + 2;
                
                if (mType === 144 && vel > 0) {
                    act[n] = cSec;
                } else if (act[n] !== undefined) {
                    let dur = cSec - act[n];
                    if (n >= MIN_NOTE && n <= MAX_NOTE && dur > 0) {
                        res.push({ midi: n, time: act[n], dur: dur, p: false });
                    }
                    delete act[n];
                }
            } else if (mType === 160 || mType === 176 || mType === 224) {
                tOff = tOff + 2;
            } else if (mType === 192 || mType === 208) {
                tOff = tOff + 1;
            } else if (stat === 255) {
                let mType2 = v.getUint8(tOff);
                tOff = tOff + 1;
                let mVlq = readVLQ(v, tOff);
                tOff = tOff + mVlq.idx;
                
                if (mType2 === 81) {
                    let b1 = v.getUint8(tOff);
                    let b2 = v.getUint8(tOff + 1);
                    let b3 = v.getUint8(tOff + 2);
                    let mpb = (b1 << 16) | (b2 << 8) | b3;
                    bpm = 60000000 / mpb;
                }
                tOff = tOff + mVlq.val;
            } else if (stat === 240 || stat === 247) {
                let sVlq = readVLQ(v, tOff);
                tOff = tOff + sVlq.idx + sVlq.val;
            } else {
                break;
            }
        }
        off = tEnd;
    }
    return res;
}

fInp.addEventListener('change', async (e) => {
    const fs = e.target.files;
    if (!fs || fs.length === 0) return;
    const file = fs[0];

    showLog("解析中: " + file.name);

    try {
        const buf = await file.arrayBuffer();
        notes = parseMIDI(buf);
        notes.sort(function(a, b) { return a.time - b.time; });
        
        isPlaying = false;
        pauseTime = 0;
        pBtn.style.display = 'block';
        pBtn.textContent = '▶ 再生';
        
        showLog("成功! ノーツ数: " + notes.length);
        draw(0);
    } catch (err) {
        showLog("失敗: " + err.message);
    }
});

pBtn.addEventListener('click', function() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    if (isPlaying) {
        isPlaying = false;
        pauseTime = audioCtx.currentTime - startTime;
        pBtn.textContent = '▶ 再生';
        showLog("一時停止");
    } else {
        isPlaying = true;
        startTime = audioCtx.currentTime - pauseTime;
        pBtn.textContent = '⏸ 一時停止';
        showLog("再生中...");
        animate();
    }
});

function animate() {
    if (!isPlaying) return;
    const cTime = audioCtx.currentTime - startTime;
    
    notes.forEach(function(n) {
        if (!n.p && cTime >= n.time) {
            playTone(n.midi, n.dur);
            n.p = true;
        }
    });
    
    draw(cTime);
    requestAnimationFrame(animate);
}

function draw(cTime) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const kW = w / NOTE_CNT;
    const act = new Set();
    
    ctx.fillStyle = '#121212';
    ctx.fillRect(0, 0, w, h);
    
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    for (let i = 0; i <= NOTE_CNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * kW, 0);
        ctx.lineTo(i * kW, kyY);
        ctx.stroke();
    }
    
    notes.forEach(function(n) {
        if (n.time + n.dur < cTime - 2 || n.time > cTime + (kyY / SPEED)) return;
        const x = (n.midi - MIN_NOTE) * kW;
        const y = kyY - (n.time - cTime) * SPEED;
        const nH = n.dur * SPEED;
        
        if (cTime >= n.time && cTime <= n.time + n.dur) {
            act.add(n.midi);
            ctx.fillStyle = '#38bdf8';
        } else {
            ctx.fillStyle = '#1e3a8a';
        }
        
        ctx.beginPath();
        ctx.roundRect(x + 2, y - nH, kW - 4, nH, 4);
        ctx.fill();
    });
    
    for (let i = 0; i < NOTE_CNT; i++) {
        const nId = MIN_NOTE + i;
        const x = i * kW;
        
        // 数式で黒鍵を正確に判定 (C#, D#, F#, G#, A# の位置)
        const rem = nId % 12;
        const isS = (rem===1||rem===3||rem===6||rem===8||rem===10) ? true : false;
        
        if (act.has(nId)) {
            ctx.fillStyle = '#38bdf8';
        } else {
            ctx.fillStyle = isS ? '#1e1e1e' : '#fff';
        }
        
        ctx.fillRect(x, kyY, kW - 1, h - kyY);
        ctx.strokeStyle = '#888';
        ctx.strokeRect(x, kyY, kW - 1, h - kyY);
    }
    
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, kyY);
    ctx.lineTo(w, kyY);
    ctx.stroke();
}
</script>
</body>
</html>

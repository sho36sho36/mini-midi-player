<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>超軽量 MIDI Viewer</title>
    <!-- MIDIファイルの解析にのみ軽量ライブラリを使用 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background: #2563eb;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="controls">
        <label class="btn" for="fileInput">📁 MIDIを開く</label>
        <input type="file" id="fileInput" accept=".mid,.midi">
        <button class="btn" id="playBtn" style="display:none;">▶ 再生</button>
    </div>

    <canvas id="viewerCanvas"></canvas>

<script>
const canvas = document.getElementById('viewerCanvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('fileInput');
const playBtn = document.getElementById('playBtn');

// 音域の定義（鍵盤の範囲: MIDIノート番号 36:C2 〜 96:C7）
const MIN_NOTE = 36;
const MAX_NOTE = 96;
const NOTE_COUNT = MAX_NOTE - MIN_NOTE + 1;

let audioCtx = null;
let midiData = null;
let isPlaying = false;
let startTime = 0;
let pauseTime = 0;
let notesArray = [];

// ノートの落下速度（ピクセル/秒）
const SPEED = 200; 
let keyboardY = 0;

// 画面サイズ合わせ
function resize() {
    canvas.width = window.innerWidth * window.devicePixelRatio;
    canvas.height = window.innerHeight * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    keyboardY = window.innerHeight - 100; // 下から100pxの位置に鍵盤
}
window.addEventListener('resize', resize);
resize();

// Web Audio API の初期化（スマホのタップ制限解除用）
function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// 簡易シンセサイザー（音が重なっても軽いです）
function playTone(noteNumber, duration) {
    if (!audioCtx) return;
    
    // 周波数の計算
    const freq = 440 * Math.pow(2, (noteNumber - 69) / 12);
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine'; // 軽量なサイン波
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    // プチプチ音を防ぐエンベロープ（音量調整）
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

// MIDIファイルの読み込み
fileInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const arrayBuffer = await file.arrayBuffer();
    // ライブラリでMIDIをパース
    const midi = new Midi(arrayBuffer);
    
    notesArray = [];
    midi.tracks.forEach(track => {
        track.notes.forEach(note => {
            if (note.midi >= MIN_NOTE && note.midi <= MAX_NOTE) {
                notesArray.push({
                    midi: note.midi,
                    time: note.time,
                    duration: note.duration,
                    played: false // 発音済フラグ
                });
            }
        });
    });

    // 再生時間を基準にソート
    notesArray.sort((a, b) => a.time - b.time);
    
    isPlaying = false;
    pauseTime = 0;
    playBtn.style.display = 'block';
    playBtn.textContent = '▶ 再生';
    
    // 描画リセット
    draw(0);
});

// 再生ボタン
playBtn.addEventListener('click', () => {
    initAudio();
    if (isPlaying) {
        isPlaying = false;
        pauseTime = audioCtx.currentTime - startTime;
        playBtn.textContent = '▶ 再生';
    } else {
        isPlaying = true;
        startTime = audioCtx.currentTime - pauseTime;
        playBtn.textContent = '⏸ 一時停止';
        animate();
    }
});

// メインループ（描画＆音声トリガー）
function animate() {
    if (!isPlaying) return;
    
    const currentTime = audioCtx.currentTime - startTime;
    
    // 音のトリガーチェック
    notesArray.forEach(note => {
        if (!note.played && currentTime >= note.time) {
            playTone(note.midi, note.duration);
            note.played = true;
        }
    });
    
    draw(currentTime);
    requestAnimationFrame(animate);
}

// 描画処理
function draw(currentTime) {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const keyWidth = width / NOTE_COUNT;
    
    // 背景クリア
    ctx.fillStyle = '#121212';
    ctx.fillRect(0, 0, width, height);
    
    // グリッド線（レーン）の描画
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    for (let i = 0; i <= NOTE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * keyWidth, 0);
        ctx.lineTo(i * keyWidth, keyboardY);
        ctx.stroke();
    }

    // 現在画面上で押されている鍵盤を判定するための配列
    const activeKeys = new Set();

    // ノーツの描画
    notesArray.forEach(note => {
        if (note.time + note.duration < currentTime - 2) return;
        if (note.time > currentTime + (keyboardY / SPEED)) return;

        const x = (note.midi - MIN_NOTE) * keyWidth;
        const y = keyboardY - (note.time - currentTime) * SPEED;
        const noteHeight = note.duration * SPEED;
        
        if (currentTime >= note.time && currentTime <= note.time + note.duration) {
            activeKeys.add(note.midi);
            ctx.fillStyle = '#38bdf8'; // 再生中のノーツ（水色）
        } else {
            ctx.fillStyle = '#1e3a8a'; // 通常のノーツ（青）
        }
        
        ctx.beginPath();
        ctx.roundRect(x + 2, y - noteHeight, keyWidth - 4, noteHeight, 4);
        ctx.fill();
    });

    // 鍵盤の描画
    for (let i = 0; i < NOTE_COUNT; i++) {
        const noteId = MIN_NOTE + i;
        const x = i * keyWidth;
        
        // 修正箇所：黒鍵の音（C#, D#, F#, G#, A#）を判定する配列を追加
        const sharpNotes =;
        const isSharp = sharpNotes.includes(noteId % 12);
        
        if (activeKeys.has(noteId)) {
            ctx.fillStyle = '#38bdf8'; // 音が鳴っている鍵盤
        } else {
            ctx.fillStyle = isSharp ? '#1e1e1e' : '#fff';
        }
        
        ctx.fillRect(x, keyboardY, keyWidth - 1, height - keyboardY);
        
        ctx.strokeStyle = '#888';
        ctx.strokeRect(x, keyboardY, keyWidth - 1, height - keyboardY);
    }
    
    // 判定ライン
    ctx.strokeStyle = '#ff0055';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, keyboardY);
    ctx.lineTo(width, keyboardY);
    ctx.stroke();
}

// 最初の初期描画
draw(0);
</script>
</body>
</html>

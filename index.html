<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>超軽量 BlackMIDI Player</title>
    <style>
        body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden;position:fixed;width:100%;height:100%;}
        #ctl{position:absolute;top:10px;left:10px;z-index:10;display:flex;gap:10px;}
        input[type="file"]{display:none;}
        .btn{background:#2563eb;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:bold;border:none;cursor:pointer;}
        canvas{display:block;width:100vw;height:100vh;}
        #log{position:absolute;bottom:110px;left:10px;right:10px;background:rgba(0,0,0,0.8);color:#00ff00;font-family:monospace;font-size:11px;padding:6px;max-height:50px;z-index:20;pointer-events:none;border-radius:4px;}
    </style>
</head>
<body>
    <div id="ctl">
        <label class="btn" for="fInp">📁 MIDIを開く</label>
        <input type="file" id="fInp" accept=".mid,.midi">
        <button class="btn" id="pBtn" style="display:none;">▶ 再生</button>
    </div>
    <div id="log">ログ: BlackMIDI対応。ファイルを選択してください。</div>
    <canvas id="cvs"></canvas>

<script>
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
const fInp = document.getElementById('fInp'), pBtn = document.getElementById('pBtn'), logDiv = document.getElementById('log');
const MIN_NOTE = 36, MAX_NOTE = 96, NOTE_CNT = MAX_NOTE - MIN_NOTE + 1, SPEED = 250;
let audioCtx = null, mainGain = null, reverbNode = null, isPlaying = false, startTime = 0, pauseTime = 0, notes = [], kyY = 0;
const CLRS = ['#38bdf8', '#f43f5e', '#10b981', '#fbbf24', '#a855f7', '#ec4899', '#f97316', '#14b8a6'];

let activeVoices = [];
const MAX_VOICES = 128; 
let lastPlayTimes = {}; 

function showLog(m) { logDiv.innerText = "ログ: " + m; }
window.onerror = (m, s, l) => { showLog("エラー: " + m + " (L:" + l + ")"); return false; };

function resize() {
    cvs.width = window.innerWidth * window.devicePixelRatio; cvs.height = window.innerHeight * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio); kyY = window.innerHeight - 100; draw(0);
}
window.addEventListener('resize', resize); resize();

function createReverbBuffer(ctx, duration, decay) {
    const rate = ctx.sampleRate, length = rate * duration, buffer = ctx.createBuffer(2, length, rate);
    for (let channel = 0; channel < 2; channel++) {
        const data = buffer.getChannelData(channel);
        for (let i = 0; i < length; i++) { data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay); }
    }
    return buffer;
}

function initAudioEngine() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        mainGain = audioCtx.createGain();
        
        reverbNode = audioCtx.createConvolver();
        reverbNode.buffer = createReverbBuffer(audioCtx, 2.0, 2.2); 
        
        const reverbGain = audioCtx.createGain();
        reverbGain.gain.setValueAtTime(0.25, audioCtx.currentTime); 
        
        const compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-10, audioCtx.currentTime); 
        compressor.knee.setValueAtTime(15, audioCtx.currentTime);
        compressor.ratio.setValueAtTime(4, audioCtx.currentTime); 
        compressor.attack.setValueAtTime(0.002, audioCtx.currentTime);
        compressor.release.setValueAtTime(0.06, audioCtx.currentTime);
        
        mainGain.connect(compressor);
        mainGain.connect(reverbNode);
        reverbNode.connect(reverbGain);
        reverbGain.connect(compressor);
        compressor.connect(audioCtx.destination);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(n, d, vel, ch, inst, tr, targetTime) {
    if (!audioCtx) return;
    const playTime = targetTime + startTime;
    if (playTime < audioCtx.currentTime) return;

    // ⚡ 超高密度連打時のみ上書きガード（0.035秒未満の極小連打だけをマージし、通常の音は完全に伸ばす）
    const noteKey = n + "_" + ch;
    if (lastPlayTimes[noteKey] && (targetTime - lastPlayTimes[noteKey] < 0.035)) {
        return; 
    }
    lastPlayTimes[noteKey] = targetTime;

    if (activeVoices.length >= MAX_VOICES) {
        const oldest = activeVoices.shift();
        try { oldest.osc.stop(playTime); oldest.gain.gain.setValueAtTime(0, playTime); } catch(e){}
    }

    let trackWeight = 0.05; 
    if (tr <= 2) trackWeight = 0.16; 
    const vol = (vel / 127) * trackWeight;

    // 10ch ドラムの高品質合成
    if (ch === 9) {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(n === 35 || n === 36 ? 85 : 7500, playTime);
        if (n === 35 || n === 36) osc.frequency.exponentialRampToValueAtTime(0.01, playTime + 0.05);
        gain.gain.setValueAtTime(vol * 1.2, playTime);
        gain.gain.exponentialRampToValueAtTime(0.001, playTime + 0.03);
        osc.connect(gain); gain.connect(mainGain);
        osc.start(playTime); osc.stop(playTime + 0.04);
        activeVoices.push({ osc: osc, gain: gain, time: playTime });
        return;
    }

    // ⚡【新実装】計算だけで本物の楽器の質感を再現する、超軽量マルチFM合成シンセ
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const freq = 440 * Math.pow(2, (n - 69) / 12);
    osc.frequency.setValueAtTime(freq, playTime);

    // 楽器番号(inst)に応じてFMモジュレーション（倍音）や波形を動的変化させ「元楽器の個性」をシミュレート
    if (inst >= 24 && inst <= 31) {
        // 🎸 ギター：アタックのハッキリしたパルス三角波
        osc.type = 'triangle';
    } else if ((inst >= 16 && inst <= 23) || (inst >= 40 && inst <= 51)) {
        // 🎻 ストリングス・オルガン：豊かな倍音を持つノコギリ波
        osc.type = 'sawtooth';
    } else if (inst >= 56 && inst <= 79) {
        // 🎺 ブラス・リード：太く突き抜ける矩形波
        osc.type = 'square';
    } else {
        // 🎹 ピアノ・エレピ：クリアで高級感のあるサイン波に、微量の金属アタックを追加
        osc.type = 'sine';
        const attackMod = audioCtx.createOscillator();
        const attackGain = audioCtx.createGain();
        attackMod.frequency.setValueAtTime(freq * 4, playTime); // 4倍音のアタック
        attackGain.gain.setValueAtTime(vol * 0.3, playTime);
        attackGain.gain.exponentialRampToValueAtTime(0.001, playTime + 0.02); // 0.02秒だけ鳴る鍵盤のコツコツ音
        attackMod.connect(attackGain); attackGain.connect(mainGain);
        attackMod.start(playTime); attackMod.stop(playTime + 0.03);
    }

    // ⚡【ロングトーン復活】d（MIDI本来の長さ）をそのまま適用し、ブツ切りを廃止！
    gain.gain.setValueAtTime(0, playTime);
    gain.gain.linearRampToValueAtTime(vol, playTime + 0.003); // 柔らかなアタック
    gain.gain.setValueAtTime(vol, playTime + d - 0.005);
    gain.gain.linearRampToValueAtTime(0.0001, playTime + d); // MIDI本来の長さで自然に消音
    
    osc.connect(gain); gain.connect(mainGain);
    osc.start(playTime); osc.stop(playTime + d + 0.01);
    
    activeVoices.push({ osc: osc, gain: gain, time: playTime });
}

function cleanVoices() {
    const now = audioCtx ? audioCtx.currentTime : 0;
    activeVoices = activeVoices.filter(v => now < v.time + 0.5);
}

function readVLQ(v, o) {
    let val = 0, idx = 0;
    while (true) { let b = v.getUint8(o + idx); idx++; val = (val << 7) | (b & 127); if (!(b & 128)) break; }
    return { val: val, idx: idx };
}
function parseMIDI(buf) {
    const v = new DataView(buf); let off = 0;
    if (v.getUint32(0) !== 0x4D546864) throw new Error("無効なMIDIファイルです");
    
    const hLen = v.getUint32(4);
    const tCnt = v.getUint16(10);
    const tDiv = v.getUint16(12);
    if (tDiv & 0x8000) throw new Error("未対応の形式です");
    
    let tempoEvents = [];
    let trackOffsets = [];
    let trackEnds = [];
    
    off = 8 + hLen;
    for (let t = 0; t < tCnt; t++) {
        if (off >= v.byteLength) break;
        if (v.getUint32(off) !== 0x4D54726B) { off += 8 + v.getUint32(off + 4); continue; }
        const tLen = v.getUint32(off + 4);
        trackOffsets.push(off + 8);
        trackEnds.push(off + 8 + tLen);
        off += 8 + tLen;
    }

    let allNotesRaw = [];
    const skipTypes = "160_176_224";
    const sysTypes = "240_247";

    for (let t = 0; t < trackOffsets.length; t++) {
        let tOff = trackOffsets[t];
        let tEnd = trackEnds[t];
        let currentTick = 0;
        let rStat = 0;
        let inst = 0;
        let act = {};

        while (tOff < tEnd) {
            let vlq = readVLQ(v, tOff); tOff += vlq.idx;
            currentTick += vlq.val;

            let stat = v.getUint8(tOff); if (stat & 128) { rStat = stat; tOff++; } else { stat = rStat; }
            let mType = stat & 240, ch = stat & 15;

            if (mType === 144 || mType === 128) {
                let n = v.getUint8(tOff), vel = v.getUint8(tOff + 1); tOff += 2;
                if (mType === 144 && vel > 0) {
                    act[n] = { tick: currentTick, v: vel, i: inst, c: ch };
                } else if (act[n]) {
                    let durTick = currentTick - act[n].tick;
                    if (durTick > 0) {
                        allNotesRaw.push({
                            m: n, startTick: act[n].tick, endTick: currentTick, v: act[n].v, i: act[n].i, ch: act[n].c, tr: t, p: false
                        });
                    }
                    delete act[n];
                }
            } else if (mType === 192) {
                inst = v.getUint8(tOff++);
            } else if (skipTypes.indexOf(String(mType)) !== -1) {
                tOff += 2;
            } else if (mType === 208) {
                tOff += 1;
            } else if (stat === 255) {
                let m2 = v.getUint8(tOff++); let mV = readVLQ(v, tOff); tOff += mV.idx;
                if (m2 === 81) {
                    let u1 = v.getUint8(tOff), u2 = v.getUint8(tOff + 1), u3 = v.getUint8(tOff + 2);
                    let mpb = (u1 << 16) | (u2 << 8) | u3;
                    tempoEvents.push({ tick: currentTick, bpm: 60000000 / mpb });
                }
                tOff += mV.val;
            } else if (sysTypes.indexOf(String(stat)) !== -1) {
                let sV = readVLQ(v, tOff); tOff += sV.idx + sV.val;
            } else {
                break;
            }
        }
    }

    tempoEvents.sort((a, b) => a.tick - b.tick);
    if (tempoEvents.length === 0 || tempoEvents.tick > 0) {
        tempoEvents.unshift({ tick: 0, bpm: 120 });
    }

    function tickToSecond(tick) {
        let sec = 0;
        let curTick = 0;
        let curBPM = 120;
        for (let i = 0; i < tempoEvents.length; i++) {
            if (tick <= tempoEvents[i].tick) break;
            let delta = tempoEvents[i].tick - curTick;
            sec += delta * (60 / (curBPM * tDiv));
            curTick = tempoEvents[i].tick;
            curBPM = tempoEvents[i].bpm;
        }
        sec += (tick - curTick) * (60 / (curBPM * tDiv));
        return sec;
    }

    let finalNotes = [];
    for (let i = 0; i < allNotesRaw.length; i++) {
        let n = allNotesRaw[i];
        let tSec = tickToSecond(n.startTick);
        let eSec = tickToSecond(n.endTick);
        finalNotes.push({
            m: n.m, t: tSec, d: eSec - tSec, v: n.v, i: n.i, ch: n.ch, tr: n.tr, p: false
        });
    }

    return finalNotes;
}

fInp.addEventListener('change', async (e) => {
    const fs = e.target.files; if (!fs || fs.length === 0) return;
    const file = fs.item(0);
    showLog("高精度MIDIデータ解析中...: " + file.name);
    
    initAudioEngine();
    
    try {
        const buf = await file.arrayBuffer();
        notes = parseMIDI(buf);
        notes.sort((a, b) => a.t - b.t);
        
        isPlaying = false; pauseTime = 0;
        lastPlayTimes = {}; 
        pBtn.style.display = 'block'; pBtn.textContent = '▶ 再生';
        showLog("読み込み成功! 総ノーツ数: " + notes.length);
        
        notes.forEach(n => n.p = false);
        draw(0);
    } catch (err) {
        showLog("失敗: " + err.message);
    }
});

pBtn.addEventListener('click', () => {
    initAudioEngine();
    if (isPlaying) {
        isPlaying = false; pauseTime = audioCtx.currentTime - startTime; pBtn.textContent = '▶ 再生'; showLog("一時停止");
    } else {
        isPlaying = true; startTime = audioCtx.currentTime - pauseTime; pBtn.textContent = '再生中...'; animate();
    }
});

function animate() {
    if (!isPlaying) return;
    const cTime = audioCtx.currentTime - startTime;
    const lookAheadTime = cTime + 0.05;
    
    notes.forEach(n => {
        if (!n.p && lookAheadTime >= n.t) {
            playTone(n.m, n.d, n.v, n.ch, n.i, n.tr, n.t); n.p = true;
        }
    });
    
    cleanVoices();
    draw(cTime);
    requestAnimationFrame(animate);
}

function draw(cTime) {
    const w = window.innerWidth, h = window.innerHeight, kW = w / NOTE_CNT, act = new Set(), actC = {};
    ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
    
    const viewMinTime = cTime - 2;
    const viewMaxTime = cTime + (kyY / SPEED);
    
    notes.forEach(n => {
        if (n.m < MIN_NOTE || n.m > MAX_NOTE) return;
        if (n.t + n.d < viewMinTime || n.t > viewMaxTime) return;
        
        const x = (n.m - MIN_NOTE) * kW, y = kyY - (n.t - cTime) * SPEED, nH = n.d * SPEED;
        const c = (n.ch === 9) ? '#555555' : CLRS[n.tr % CLRS.length];
        
        if (cTime >= n.t && cTime <= n.t + n.d) {
            act.add(n.m); actC[n.m] = c; ctx.fillStyle = '#ffffff';
        } else {
            ctx.fillStyle = c;
        }
        ctx.fillRect(x + 1, y - nH, kW - 2, nH);
    });
    
    for (let i = 0; i < NOTE_CNT; i++) {
        const nId = MIN_NOTE + i, x = i * kW, rem = nId % 12;
        const isS = (rem===1||rem===3||rem===6||rem===8||rem===10);
        ctx.fillStyle = act.has(nId) ? actC[nId] : (isS ? '#151515' : '#ffffff');
        ctx.fillRect(x, kyY, kW - 1, h - kyY);
    }
    ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, kyY); ctx.lineTo(w, kyY); ctx.stroke();
}
</script>
</body>
</html>

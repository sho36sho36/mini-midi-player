<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>超軽量 BlackMIDI Player</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:sans-serif;

    position:fixed;
    width:100%;

<body>

<div id="ctl">
    <label class="btn" for="fInp">📁 MIDIを開く</label>
    <input type="file" id="fInp" accept=".mid,.midi">
    <button class="btn" id="pBtn" style="display:none;">▶ 再生</button>
</div>

<div id="log">
    ログ: BlackMIDI対応。ファイルを選択してください。
</div>

<canvas id="cvs"></canvas>


<script>

"use strict";


/* =========================================================
   DOM
========================================================= */

const cvs = document.getElementById("cvs");
const ctx = cvs.getContext("2d");

const fInp = document.getElementById("fInp");
const pBtn = document.getElementById("pBtn");
const logDiv = document.getElementById("log");


/* =========================================================
   基本設定
========================================================= */

const MIN_NOTE = 36;
const MAX_NOTE = 96;
const NOTE_CNT = MAX_NOTE - MIN_NOTE + 1;

const SPEED = 250;


/* =========================================================
   色
========================================================= */

const CLRS = [
    "#38bdf8",
    "#f43f5e",
    "#10b981",
    "#fbbf24",
    "#a855f7",
    "#ec4899",
    "#f97316",
    "#14b8a6"
];


/* =========================================================
   Audio
========================================================= */

/*
 * できるだけ軽くする。
 *
 * リバーブ      → なし
 * Compressor    → なし
 * AudioWorklet  → なし
 * 1音複数Osc    → なし
 *
 * 1音につき
 * Oscillator + Gain
 * だけ。
 */

const MAX_VOICES = 64;

const AUDIO_LOOKAHEAD = 0.12;
const AUDIO_INTERVAL = 30;

let audioCtx = null;
let masterGain = null;

let audioTimer = null;

let activeVoices = [];

let audioPointer = 0;


/* =========================================================
   Playback
========================================================= */

let notes = [];

let isPlaying = false;
let isPaused = false;

let startTime = 0;
let pauseTime = 0;

let duration = 0;

let animationId = null;

let currentFileName = "";


/* =========================================================
   Canvas
========================================================= */

let kyY = 0;

function resize(){

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    cvs.width =
        Math.floor(w * dpr);

    cvs.height =
        Math.floor(h * dpr);

    cvs.style.width =
        w + "px";

    cvs.style.height =
        h + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   Log
========================================================= */

function log(text){

    logDiv.textContent =
        "ログ: " + text;
}


/* =========================================================
   MIDI utility
========================================================= */

function readU16(data,p){

    return (
        (data[p] << 8) |
        data[p + 1]
    );
}


function readU32(data,p){

    return (
        data[p] * 16777216 +
        data[p + 1] * 65536 +
        data[p + 2] * 256 +
        data[p + 3]
    );
}


function readVLQ(data,p){

    let value = 0;

    for(let i=0;i<4;i++){

        const b = data[p++];

        value =
            (value << 7) |
            (b & 127);

        if(!(b & 128)){
            break;
        }
    }

    return {
        value,
        pos:p
    };
}


/* =========================================================
   MIDI parser
========================================================= */

function parseMIDI(buffer){

    const data =
        new Uint8Array(buffer);

    if(
        data.length < 14 ||
        data[0] !== 0x4d ||
        data[1] !== 0x54 ||
        data[2] !== 0x68 ||
        data[3] !== 0x64
    ){
        throw new Error(
            "MIDIヘッダーが見つかりません"
        );
    }


    const headerLength =
        readU32(data,4);

    const format =
        readU16(data,8);

    const trackCount =
        readU16(data,10);

    const division =
        readU16(data,12);


    let pos =
        8 + headerLength;


    /*
     * 標準MIDIはPPQNを使用。
     */
    let ppqn =
        division & 0x7fff;


    if(!ppqn){
        ppqn = 480;
    }


    const events = [];

    let order = 0;


    /* =====================================================
       Tracks
    ===================================================== */

    for(
        let track=0;
        track<trackCount;
        track++
    ){

        if(pos + 8 > data.length){
            break;
        }


        if(
            data[pos] !== 0x4d ||
            data[pos+1] !== 0x54 ||
            data[pos+2] !== 0x72 ||
            data[pos+3] !== 0x6b
        ){
            throw new Error(
                "MTrkが見つかりません"
            );
        }


        const length =
            readU32(data,pos+4);

        pos += 8;


        const end =
            Math.min(
                data.length,
                pos + length
            );


        let tick = 0;

        let runningStatus = 0;


        /*
         * Program Change
         */
        const programs =
            new Uint8Array(16);


        /*
         * 同じ音程の重複に対応。
         */
        const active =
            new Map();


        while(pos < end){

            const vlq =
                readVLQ(data,pos);

            tick += vlq.value;

            pos = vlq.pos;


            let status =
                data[pos];


            /*
             * Running Status
             */
            if(status < 0x80){

                if(!runningStatus){
                    pos++;
                    continue;
                }

                status =
                    runningStatus;

            }else{

                pos++;

                if(
                    status >= 0x80 &&
                    status <= 0xef
                ){
                    runningStatus = status;
                }
            }


            /* ------------------------------------------------
               Meta
            ------------------------------------------------ */

            if(status === 0xff){

                if(pos >= end){
                    break;
                }


                const type =
                    data[pos++];

                const vl =
                    readVLQ(data,pos);

                pos =
                    vl.pos;


                if(
                    type === 0x51 &&
                    vl.value === 3
                ){

                    const tempo =
                        data[pos] * 65536 +
                        data[pos+1] * 256 +
                        data[pos+2];


                    events.push({
                        type:"tempo",
                        tick,
                        tempo,
                        order:order++
                    });
                }


                pos += vl.value;


                if(type === 0x2f){
                    break;
                }

                continue;
            }


            /* ------------------------------------------------
               SysEx
            ------------------------------------------------ */

            if(
                status === 0xf0 ||
                status === 0xf7
            ){

                const vl =
                    readVLQ(data,pos);

                pos =
                    vl.pos +
                    vl.value;

                continue;
            }


            const command =
                status & 0xf0;

            const channel =
                status & 15;


            /* ------------------------------------------------
               Program Change
            ------------------------------------------------ */

            if(command === 0xc0){

                if(pos < end){
                    programs[channel] =
                        data[pos++];
                }

                continue;
            }


            /* ------------------------------------------------
               Channel Pressure
            ------------------------------------------------ */

            if(command === 0xd0){

                pos++;
                continue;
            }


            if(pos >= end){
                break;
            }


            const a =
                data[pos++];

            let b = 0;

            if(pos < end){
                b =
                    data[pos++];
            }


            /* ------------------------------------------------
               Note On
            ------------------------------------------------ */

            if(
                command === 0x90 &&
                b > 0
            ){

                const key =
                    channel + ":" + a;


                let list =
                    active.get(key);


                if(!list){

                    list = [];

                    active.set(
                        key,
                        list
                    );
                }


                list.push({
                    tick,
                    velocity:b,
                    channel,
                    program:programs[channel]
                });


                continue;
            }


            /* ------------------------------------------------
               Note Off
            ------------------------------------------------ */

            if(
                command === 0x80 ||
                (
                    command === 0x90 &&
                    b === 0
                )
            ){

                const key =
                    channel + ":" + a;

                const list =
                    active.get(key);


                if(
                    list &&
                    list.length
                ){

                    const on =
                        list.pop();


                    events.push({

                        type:"note",

                        tick:on.tick,

                        endTick:tick,

                        note:a,

                        velocity:on.velocity,

                        channel:on.channel,

                        program:on.program,

                        order:order++
                    });
                }


                continue;
            }
        }


        pos = end;
    }


    /* =====================================================
       Tempo
    ===================================================== */

    const tempos =
        events
            .filter(
                e =>
                    e.type === "tempo"
            )
            .sort(
                (a,b) =>
                    a.tick - b.tick ||
                    a.order - b.order
            );


    if(
        !tempos.length ||
        tempos[0].tick !== 0
    ){

        tempos.unshift({
            type:"tempo",
            tick:0,
            tempo:500000,
            order:-1
        });
    }


    /*
     * tempoMap
     */
    const tempoMap = [];

    let lastTick = 0;
    let lastTime = 0;
    let currentTempo = 500000;


    for(
        let i=0;
        i<tempos.length;
        i++
    ){

        const t =
            tempos[i];


        lastTime +=
            (
                t.tick -
                lastTick
            ) *
            currentTempo /
            1000000 /
            ppqn;


        currentTempo =
            t.tempo;

        lastTick =
            t.tick;


        tempoMap.push({
            tick:t.tick,
            time:lastTime,
            tempo:currentTempo
        });
    }


    /* =====================================================
       Tick → 秒
    ===================================================== */

    function tickToTime(tick){

        let lo = 0;

        let hi =
            tempoMap.length - 1;

        let index = 0;


        while(lo <= hi){

            const mid =
                (lo + hi) >> 1;


            if(
                tempoMap[mid].tick <=
                tick
            ){

                index = mid;
                lo = mid + 1;

            }else{

                hi = mid - 1;
            }
        }


        const base =
            tempoMap[index];


        return (
            base.time +
            (
                tick -
                base.tick
            ) *
            base.tempo /
            1000000 /
            ppqn
        );
    }


    /* =====================================================
       Note変換
    ===================================================== */

    const result = [];

    for(
        let i=0;
        i<events.length;
        i++
    ){

        const e =
            events[i];


        if(e.type !== "note"){
            continue;
        }


        const t =
            tickToTime(e.tick);

        const endTime =
            tickToTime(e.endTick);


        const d =
            Math.max(
                0.008,
                endTime - t
            );


        result.push({

            t,

            endTime,

            d,

            note:e.note,

            velocity:e.velocity,

            channel:e.channel,

            program:e.program
        });
    }


    /*
     * 時間順。
     */
    result.sort(
        (a,b) =>
            a.t - b.t
    );


    notes =
        result;


    /*
     * spread禁止。
     * BlackMIDI対策。
     */
    duration = 0;

    for(
        let i=0;
        i<notes.length;
        i++
    ){

        if(
            notes[i].endTime >
            duration
        ){
            duration =
                notes[i].endTime;
        }
    }


    return {
        format,
        trackCount,
        ppqn,
        notes,
        duration
    };
}


/* =========================================================
   Audio初期化
========================================================= */

async function initAudio(){

    if(audioCtx){

        if(
            audioCtx.state ===
            "suspended"
        ){

            await audioCtx.resume();
        }

        return;
    }


    audioCtx =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    masterGain =
        audioCtx.createGain();


    masterGain.gain.value =
        0.75;


    masterGain.connect(
        audioCtx.destination
    );


    await audioCtx.resume();
}


/* =========================================================
   音程
========================================================= */

function noteFrequency(note){

    return 440 *
        Math.pow(
            2,
            (note - 69) / 12
        );
}


/* =========================================================
   音色
========================================================= */

function getWaveform(program){

    /*
     * GM音色を完全再現するのではなく、
     * 軽量な波形でMIDIらしくする。
     */

    if(program < 8){
        return "triangle";
    }

    if(program < 16){
        return "sine";
    }

    if(program < 24){
        return "sine";
    }

    if(program < 40){
        return "triangle";
    }

    if(program < 48){
        return "sawtooth";
    }

    if(program < 56){
        return "sawtooth";
    }

    if(program < 64){
        return "sawtooth";
    }

    if(program < 72){
        return "square";
    }

    if(program < 80){
        return "sine";
    }

    if(program < 96){
        return "sawtooth";
    }

    return "triangle";
}


/* =========================================================
   Voice cleanup
========================================================= */

function cleanupVoices(now){

    let write = 0;


    for(
        let i=0;
        i<activeVoices.length;
        i++
    ){

        const v =
            activeVoices[i];


        if(
            v.endTime >
            now
        ){

            activeVoices[write++] =
                v;
        }
    }


    activeVoices.length =
        write;
}


/* =========================================================
   Note playback
========================================================= */

function playNote(n,when){

    /*
     * 最大同時発音数。
     *
     * ここでJavaScript側の
     * ノード大量生成を防ぐ。
     */
    if(
        activeVoices.length >=
        MAX_VOICES
    ){
        return;
    }


    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    osc.type =
        getWaveform(
            n.program
        );


    const freq =
        noteFrequency(
            n.note
        );


    osc.frequency.setValueAtTime(
        freq,
        when
    );


    /*
     * Velocity
     */
    const velocity =
        n.velocity / 127;


    /*
     * ピアノ風に、
     * 最初だけ強く、その後少し落とす。
     */
    const peak =
        Math.max(
            0.008,
            0.15 * velocity
        );


    const attack =
        Math.min(
            0.004,
            n.d * 0.25
        );


    const release =
        Math.min(
            0.08,
            n.d * 0.35
        );


    const end =
        when +
        n.d;


    const releaseStart =
        Math.max(
            when + attack,
            end - release
        );


    gain.gain.setValueAtTime(
        0.0001,
        when
    );


    gain.gain.linearRampToValueAtTime(
        peak,
        when + attack
    );


    gain.gain.setValueAtTime(
        peak * 0.65,
        releaseStart
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        end
    );


    osc.connect(gain);

    gain.connect(
        masterGain
    );


    osc.start(when);

    osc.stop(
        end + 0.01
    );


    activeVoices.push({

        osc,

        gain,

        endTime:end
    });
}


/* =========================================================
   Audio scheduling
========================================================= */

function getCurrentTime(){

    if(!audioCtx){
        return 0;
    }


    return Math.max(
        0,
        audioCtx.currentTime -
        startTime
    );
}


function scheduleAudio(){

    if(
        !isPlaying ||
        isPaused ||
        !audioCtx
    ){
        return;
    }


    const now =
        getCurrentTime();


    const until =
        now +
        AUDIO_LOOKAHEAD;


    cleanupVoices(
        audioCtx.currentTime
    );


    while(
        audioPointer <
        notes.length
    ){

        const n =
            notes[audioPointer];


        /*
         * まだ先。
         */
        if(
            n.t >
            until
        ){
            break;
        }


        /*
         * 過去。
         */
        if(
            n.endTime <= now
        ){

            audioPointer++;

            continue;
        }


        /*
         * 音声予約。
         */
        const when =
            audioCtx.currentTime +
            Math.max(
                0.001,
                n.t - now
            );


        playNote(
            n,
            when
        );


        audioPointer++;
    }
}


/* =========================================================
   Scheduler
========================================================= */

function startAudioScheduler(){

    if(audioTimer !== null){
        clearInterval(
            audioTimer
        );
    }


    audioTimer =
        setInterval(
            scheduleAudio,
            AUDIO_INTERVAL
        );


    scheduleAudio();
}


function stopAudioScheduler(){

    if(audioTimer !== null){

        clearInterval(
            audioTimer
        );

        audioTimer = null;
    }
}


/* =========================================================
   Audio stop
========================================================= */

function stopVoices(){

    if(!audioCtx){
        activeVoices.length = 0;
        return;
    }


    const now =
        audioCtx.currentTime;


    for(
        let i=0;
        i<activeVoices.length;
        i++
    ){

        const v =
            activeVoices[i];


        try{

            v.gain.gain.cancelScheduledValues(
                now
            );

            v.gain.gain.setValueAtTime(
                0.0001,
                now
            );

            v.osc.stop(
                now + 0.01
            );

        }catch(e){}
    }


    activeVoices.length = 0;
}


/* =========================================================
   Play
========================================================= */

async function play(){

    if(!notes.length){
        return;
    }


    await initAudio();


    if(isPaused){

        startTime =
            audioCtx.currentTime -
            pauseTime;

        isPaused = false;

    }else{

        stopVoices();

        audioPointer = 0;

        startTime =
            audioCtx.currentTime;
    }


    isPlaying = true;


    pBtn.textContent =
        "⏸ 一時停止";


    log(
        "再生中: " +
        currentFileName
    );


    startAudioScheduler();


    if(animationId === null){

        animationId =
            requestAnimationFrame(
                animate
            );
    }
}


/* =========================================================
   Pause
========================================================= */

function pause(){

    if(!isPlaying){
        return;
    }


    pauseTime =
        getCurrentTime();


    isPlaying = false;
    isPaused = true;


    stopAudioScheduler();

    stopVoices();


    pBtn.textContent =
        "▶ 再生";


    log(
        "一時停止: " +
        pauseTime.toFixed(2) +
        "秒"
    );
}


/* =========================================================
   Stop
========================================================= */

function stop(){

    isPlaying = false;
    isPaused = false;

    pauseTime = 0;

    audioPointer = 0;


    stopAudioScheduler();

    stopVoices();


    pBtn.textContent =
        "▶ 再生";


    draw(0);
}


/* =========================================================
   Play button
========================================================= */

pBtn.addEventListener(
    "click",
    function(){

        if(isPlaying){

            pause();

        }else{

            play();
        }
    }
);


/* =========================================================
   File
========================================================= */

fInp.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }


        try{

            stop();


            log(
                "MIDI読み込み中..."
            );


            const buffer =
                await file.arrayBuffer();


            const result =
                parseMIDI(buffer);


            currentFileName =
                file.name;


            pBtn.style.display =
                "block";


            log(
                file.name +
                " / " +
                result.notes.length.toLocaleString() +
                "音符 / " +
                result.duration.toFixed(2) +
                "秒"
            );


            draw(0);

        }catch(e){

            console.error(e);

            log(
                "エラー: " +
                e.message
            );
        }
    }
);


/* =========================================================
   Keyboard controls
========================================================= */

window.addEventListener(
    "keydown",
    function(e){

        if(e.code === "Space"){

            e.preventDefault();


            if(isPlaying){

                pause();

            }else{

                play();
            }
        }


        if(e.code === "Escape"){

            stop();
        }
    }
);


/* =========================================================
   黒鍵判定
========================================================= */

function isBlackKey(note){

    const n =
        note % 12;


    return (
        n === 1 ||
        n === 3 ||
        n === 6 ||
        n === 8 ||
        n === 10
    );
}


/* =========================================================
   元コード方式の描画
========================================================= */

function draw(cTime){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    /*
     * 背景
     */
    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    /*
     * 元コードと同じく
     * 鍵盤を下側に配置。
     */
    kyY =
        h - 110;


    /*
     * 表示範囲。
     */
    const viewMinTime =
        cTime - 2;

    const viewMaxTime =
        cTime +
        kyY / SPEED;


    /*
     * -----------------------------------------------------
     * ノートの開始位置を二分探索
     * -----------------------------------------------------
     */

    let left = 0;

    let right =
        notes.length - 1;

    let startIndex =
        notes.length;


    while(left <= right){

        const mid =
            (left + right) >> 1;


        if(
            notes[mid].endTime >=
            viewMinTime
        ){

            startIndex =
                mid;

            right =
                mid - 1;

        }else{

            left =
                mid + 1;
        }
    }


    /*
     * -----------------------------------------------------
     * 元コード方式の色別Path
     *
     * 毎ノートbeginPathをしない。
     * 色ごとにまとめる。
     * -----------------------------------------------------
     */

    const paths =
        new Array(
            CLRS.length
        );


    for(
        let i=0;
        i<CLRS.length;
        i++
    ){

        paths[i] =
            new Path2D();
    }


    const noteWidth =
        w / NOTE_CNT;


    for(
        let i=startIndex;
        i<notes.length;
        i++
    ){

        const n =
            notes[i];


        if(
            n.t >
            viewMaxTime
        ){
            break;
        }


        if(
            n.endTime <
            viewMinTime
        ){
            continue;
        }


        if(
            n.note < MIN_NOTE ||
            n.note > MAX_NOTE
        ){
            continue;
        }


        const x =
            (
                n.note -
                MIN_NOTE
            ) *
            noteWidth;


        const y =
            kyY -
            (
                n.t -
                cTime
            ) *
            SPEED;


        const height =
            Math.max(
                2,
                n.d * SPEED
            );


        const colorIndex =
            (
                n.note +
                n.channel
            ) %
            CLRS.length;


        paths[colorIndex].rect(
            x + 1,
            y - height,
            Math.max(
                1,
                noteWidth - 2
            ),
            height
        );
    }


    /*
     * 色別に描画。
     */
    for(
        let i=0;
        i<CLRS.length;
        i++
    ){

        ctx.fillStyle =
            CLRS[i];

        ctx.fill(
            paths[i]
        );
    }


    /*
     * -----------------------------------------------------
     * 元コードの赤ライン
     * -----------------------------------------------------
     */

    ctx.strokeStyle =
        "#ff0000";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        0,
        kyY
    );

    ctx.lineTo(
        w,
        kyY
    );

    ctx.stroke();


    /*
     * -----------------------------------------------------
     * 元コードの鍵盤
     * -----------------------------------------------------
     */

    const keyWidth =
        w / NOTE_CNT;


    /*
     * 白鍵
     */
    for(
        let note=MIN_NOTE;
        note<=MAX_NOTE;
        note++
    ){

        if(
            isBlackKey(note)
        ){
            continue;
        }


        const x =
            (
                note -
                MIN_NOTE
            ) *
            keyWidth;


        ctx.fillStyle =
            "#ffffff";


        ctx.fillRect(
            x,
            kyY,
            keyWidth - 1,
            h - kyY
        );
    }


    /*
     * 黒鍵
     */
    for(
        let note=MIN_NOTE;
        note<=MAX_NOTE;
        note++
    ){

        if(
            !isBlackKey(note)
        ){
            continue;
        }


        const x =
            (
                note -
                MIN_NOTE
            ) *
            keyWidth;


        ctx.fillStyle =
            "#151515";


        ctx.fillRect(
            x - keyWidth * 0.3,
            kyY,
            keyWidth * 0.6,
            (h - kyY) * 0.62
        );
    }
}


/* =========================================================
   Animation
========================================================= */

function animate(){

    if(!isPlaying){

        animationId =
            null;

        return;
    }


    const currentTime =
        getCurrentTime();


    draw(currentTime);


    if(
        currentTime >=
        duration
    ){

        stop();

        log(
            "再生終了"
        );


        animationId =
            null;

        return;
    }


    animationId =
        requestAnimationFrame(
            animate
        );
}


/* =========================================================
   初期描画
========================================================= */

draw(0);


/* =========================================================
   終了処理
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopAudioScheduler();

        if(audioCtx){

            try{
                audioCtx.close();
            }catch(e){}
        }
    }
);

</script>

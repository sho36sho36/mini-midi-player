<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>超軽量本格 MIDI Player</title>
    <!-- 全楽器音源と高精度再生エンジンを内蔵した超軽量ライブラリ -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body{margin:0;background:#121212;color:#fff;font-family:sans-serif;overflow:hidden;position:fixed;width:100%;height:100%;}
        #ctl{position:absolute;top:10px;left:10px;z-index:10;display:flex;gap:10px;}
        input[type="file"]{display:none;}
        .btn{background:#2563eb;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:bold;border:none;cursor:pointer;}
        canvas{display:block;width:100vw;height:100vh;}
        #log{position:absolute;bottom:110px;left:10px;right:10px;background:rgba(0,0,0,0.8);color:#00ff00;font-family:monospace;font-size:11px;padding:6px;max-height:50px;z-index:20;pointer-events:none;}
    </style>
</head>
<body>
    <div id="ctl">
        <label class="btn" for="fInp">📁 MIDIを開く</label>
        <input type="file" id="fInp" accept=".mid,.midi">
        <button class="btn" id="pBtn" style="display:none;">▶ 再生</button>
    </div>
    <div id="log">ログ: 準備完了。MIDIファイルを選択してください。</div>
    <canvas id="cvs"></canvas>

<script>
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
const fInp = document.getElementById('fInp'), pBtn = document.getElementById('pBtn'), logDiv = document.getElementById('log');
const MIN_NOTE = 36, MAX_NOTE = 96, NOTE_CNT = MAX_NOTE - MIN_NOTE + 1, SPEED = 200;
let kyY = 0, player = null, notes = [], isPlaying = false;
const CLRS = ['#38bdf8', '#f43f5e', '#10b981', '#fbbf24', '#a855f7', '#ec4899', '#f97316', '#14b8a6'];

function showLog(m) { logDiv.innerText = "ログ: " + m; }
window.onerror = (m, s, l) => { showLog(`エラー: ${m} (L:${l})`); return false; };

function resize() {
    cvs.width = window.innerWidth * window.devicePixelRatio; cvs.height = window.innerHeight * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio); kyY = window.innerHeight - 100; draw(0);
}
window.addEventListener('resize', resize); resize();

// 描画用の簡易MIDI解析（再生はライブラリが完全に担当するため、描画データの取得のみ行います）
async function loadAndParseForHeader(file) {
    const buf = await file.arrayBuffer(), v = new DataView(buf);
    if (v.getUint32(0) !== 0x4D546864) throw new Error("無効なMIDIファイル");
    let off = 8 + v.getUint32(4), res = [], bpm = 120, tCnt = v.getUint16(10), tDiv = v.getUint16(12);
    
    for (let t = 0; t < tCnt; t++) {
        if (off >= v.byteLength) break;
        if (v.getUint32(off) !== 0x4D54726B) { off += 8 + v.getUint32(off + 4); continue; }
        let tOff = off + 8, tEnd = tOff + v.getUint32(off + 4), cSec = 0, act = {}, rStat = 0;
        while (tOff < tEnd) {
            let val = 0, idx = 0;
            while (true) { let b = v.getUint8(tOff + idx); idx++; val = (val << 7) | (b & 127); if (!(b & 128)) break; }
            tOff += idx; cSec += val * (60 / (bpm * tDiv));
            let stat = v.getUint8(tOff); if (stat & 128) { rStat = stat; tOff++; } else { stat = rStat; }
            let mType = stat & 240;
            if (mType === 144 || mType === 128) {
                let n = v.getUint8(tOff), vel = v.getUint8(tOff + 1); tOff += 2;
                if (mType === 144 && vel > 0) { act[n] = cSec; }
                else if (act[n] !== undefined) {
                    let dur = cSec - act[n];
                    if (dur > 0) res.push({ m: n, t: act[n], d: dur, tr: t });
                    delete act[n];
                }
            } else if (mType === 192) { tOff += 1; }
            else if ([160, 176, 224].includes(mType)) { tOff += 2; } else if (mType === 208) { tOff += 1; }
            else if (stat === 255) {
                let m2 = v.getUint8(tOff++); 
                let val2 = 0, idx2 = 0;
                while (true) { let b = v.getUint8(tOff + idx2); idx2++; val2 = (val2 << 7) | (b & 127); if (!(b & 128)) break; }
                tOff += idx2;
                if (m2 === 81) bpm = 60000000 / ((v.getUint8(tOff) << 16) | (v.getUint8(tOff + 1) << 8) | v.getUint8(tOff + 2));
                tOff += val2;
            } else if ([240, 247].includes(stat)) {
                let val3 = 0, idx3 = 0;
                while (true) { let b = v.getUint8(tOff + idx3); idx3++; val3 = (val3 << 7) | (b & 127); if (!(b & 128)) break; }
                tOff += idx3 + val3;
            } else { break; }
        }
        off = tEnd;
    }
    return res;
}

fInp.addEventListener('change', async (e) => {
    const fs = e.target.files; if (!fs || fs.length === 0) return;
    const file = fs[0]; showLog("読み込み中...");
    
    try {
        notes = await loadAndParseForHeader(file);
        notes.sort((a, b) => a.t - b.t);
        
        // 再生エンジンの初期化とデータ読み込み
        if (player) { player.destroy(); }
        player = new Timidity('https://jsdelivr.net');
        player.load(file);
        
        isPlaying = false;
        pBtn.style.display = 'block'; pBtn.textContent = '▶ 再生';
        showLog("成功! 元の全楽器・音量で再生可能です。");
        draw(0);
        
        // ライブラリの再生時間イベントと画面描画を同期
        player.on('timeupdate', (time) => { draw(time); });
        player.on('ended', () => { pBtn.textContent = '▶ 再生'; isPlaying = false; });
    } catch (err) { showLog("失敗: " + err.message); }
});

pBtn.addEventListener('click', () => {
    if (!player) return;
    if (isPlaying) { player.pause(); pBtn.textContent = '▶ 再生'; isPlaying = false; }
    else { player.play(); pBtn.textContent = '⏸ 一時停止'; isPlaying = true; }
});

function draw(cTime) {
    const w = window.innerWidth, h = window.innerHeight, kW = w / NOTE_CNT, act = new Set(), actC = {};
    ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
    for (let i = 0; i <= NOTE_CNT; i++) { ctx.beginPath(); ctx.moveTo(i * kW, 0); ctx.lineTo(i * kW, kyY); ctx.stroke(); }
    
    notes.forEach(n => {
        if (n.m < MIN_NOTE || n.m > MAX_NOTE) return;
        if (n.t + n.d < cTime - 2 || n.t > cTime + (kyY / SPEED)) return;
        const x = (n.m - MIN_NOTE) * kW, y = kyY - (n.t - cTime) * SPEED, nH = n.d * SPEED, c = CLRS[n.tr % CLRS.length];
        if (cTime >= n.t && cTime <= n.t + n.d) { act.add(n.m); actC[n.m] = c; ctx.fillStyle = '#fff'; } else { ctx.fillStyle = c; }
        ctx.beginPath(); ctx.roundRect(x + 2, y - nH, kW - 4, nH, 4); ctx.fill();
    });
    
    for (let i = 0; i < NOTE_CNT; i++) {
        const nId = MIN_NOTE + i, x = i * kW, rem = nId % 12;
        const isS = (rem===1||rem===3||rem===6||rem===8||rem===10);
        ctx.fillStyle = act.has(nId) ? actC[nId] : (isS ? '#1e1e1e' : '#fff');
        ctx.fillRect(x, kyY, kW - 1, h - kyY);
        ctx.strokeStyle = '#888'; ctx.strokeRect(x, kyY, kW - 1, h - kyY);
    }
    ctx.strokeStyle = '#ff0055'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, kyY); ctx.lineTo(w, kyY); ctx.stroke();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>BlackMIDI Player</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    position:fixed;
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#topbar{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    z-index:20;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

button,
label{
    border:0;
    border-radius:18px;
    padding:8px 14px;
    background:#2563eb;
    color:#fff;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
    user-select:none;
}

button:hover,
label:hover{
    filter:brightness(1.15);
}

button:disabled{
    opacity:.4;
    cursor:default;
}

input[type=file]{
    display:none;
}

#info{
    position:absolute;
    left:10px;
    right:10px;
    bottom:88px;
    z-index:20;
    pointer-events:none;
}

#song{
    font-size:14px;
    font-weight:bold;
    margin-bottom:4px;
    text-shadow:0 1px 3px #000;
}

#status{
    font-family:monospace;
    font-size:11px;
    color:#00ff66;
    background:rgba(0,0,0,.65);
    padding:5px 7px;
    border-radius:4px;
}

#bottom{
    position:absolute;
    left:10px;
    right:10px;
    bottom:10px;
    z-index:20;
    display:flex;
    align-items:center;
    gap:8px;
    background:rgba(0,0,0,.65);
    padding:7px;
    border-radius:8px;
    backdrop-filter:blur(4px);
}

#seek{
    flex:1;
    min-width:100px;
}

input[type=range]{
    accent-color:#2563eb;
}

#time{
    width:115px;
    text-align:center;
    font-family:monospace;
    font-size:12px;
}

.control{
    white-space:nowrap;
}

#settings{
    position:absolute;
    right:10px;
    top:55px;
    z-index:30;
    background:rgba(15,15,15,.94);
    border:1px solid #333;
    border-radius:8px;
    padding:12px;
    min-width:220px;
    display:none;
}

.setting{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:7px 0;
    font-size:12px;
}

.setting input{
    width:100px;
}

#trackInfo{
    position:absolute;
    left:10px;
    top:55px;
    z-index:19;
    font-family:monospace;
    font-size:11px;
    color:#aaa;
    pointer-events:none;
}

@media(max-width:700px){
    #bottom{
        flex-wrap:wrap;
    }

    #time{
        width:90px;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="topbar">

    <label for="fileInput">📁 MIDIを開く</label>
    <input id="fileInput" type="file" accept=".mid,.midi">

    <button id="playBtn">▶ 再生</button>
    <button id="stopBtn">■ 停止</button>
    <button id="loopBtn">🔁 ループOFF</button>
    <button id="settingsBtn">⚙</button>

</div>

<div id="trackInfo"></div>

<div id="info">
    <div id="song">BlackMIDI Player</div>
    <div id="status">MIDIファイルを選択してください。</div>
</div>

<div id="settings">

    <div class="setting">
        <span>音量</span>
        <input id="volume" type="range" min="0" max="1" step=".01" value=".8">
    </div>

    <div class="setting">
        <span>速度</span>
        <input id="speed" type="range" min=".25" max="2" step=".01" value="1">
    </div>

    <div class="setting">
        <span>リバーブ</span>
        <input id="reverb" type="range" min="0" max=".7" step=".01" value=".18">
    </div>

    <div class="setting">
        <span>表示範囲</span>
        <input id="viewSpeed" type="range" min="100" max="500" step="10" value="250">
    </div>

</div>

<div id="bottom">

    <span id="time">00:00 / 00:00</span>

    <input id="seek" type="range" min="0" max="1" step=".001" value="0">

</div>

<script>
"use strict";

/* ============================================================
   DOM
============================================================ */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    alpha:false,
    desynchronized:true
});

const fileInput = document.getElementById("fileInput");
const playBtn = document.getElementById("playBtn");
const stopBtn = document.getElementById("stopBtn");
const loopBtn = document.getElementById("loopBtn");
const settingsBtn = document.getElementById("settingsBtn");

const statusEl = document.getElementById("status");
const songEl = document.getElementById("song");
const trackInfoEl = document.getElementById("trackInfo");
const seek = document.getElementById("seek");
const timeEl = document.getElementById("time");

const volumeInput = document.getElementById("volume");
const speedInput = document.getElementById("speed");
const reverbInput = document.getElementById("reverb");
const viewSpeedInput = document.getElementById("viewSpeed");


/* ============================================================
   Canvas
============================================================ */

let W = 0;
let H = 0;
let DPR = 1;

const MIN_NOTE = 21;
const MAX_NOTE = 108;
const NOTE_COUNT = MAX_NOTE - MIN_NOTE + 1;

let keyboardY = 0;

function resize(){

    DPR = Math.min(window.devicePixelRatio || 1,2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(DPR,0,0,DPR,0,0);

    keyboardY = H - 72;
}

window.addEventListener("resize",resize);
resize();


/* ============================================================
   MIDI state
============================================================ */

let notes = [];
let events = [];

let duration = 0;
let ppqn = 480;

let tempoMap = [];

let currentTime = 0;

let isPlaying = false;
let startAudioTime = 0;
let pauseTime = 0;

let playbackSpeed = 1;

let playbackPointer = 0;

let loopEnabled = false;

let songName = "";

let metadata = {
    tracks:0,
    notes:0,
    maxPolyphony:0
};


/* ============================================================
   MIDI channel state
============================================================ */

const channels = [];

function createChannel(){

    return {
        program:0,
        volume:1,
        expression:1,
        pan:.5,
        pitchBend:0,
        pitchRange:2,
        sustain:false,
        sustained:[],
        controllers:new Uint8Array(128)
    };
}

for(let i=0;i<16;i++){
    channels.push(createChannel());
}


/* ============================================================
   Audio
============================================================ */

let audioCtx = null;

let masterGain = null;
let compressor = null;

let reverbNode = null;
let reverbGain = null;

let activeVoices = [];

const MAX_VOICES = 192;

function createReverbBuffer(audioContext){

    const rate = audioContext.sampleRate;
    const duration = 1.6;
    const length = Math.floor(rate * duration);

    const buffer =
        audioContext.createBuffer(2,length,rate);

    for(let ch=0;ch<2;ch++){

        const data = buffer.getChannelData(ch);

        for(let i=0;i<length;i++){

            const t = i / length;

            data[i] =
                (Math.random()*2-1) *
                Math.pow(1-t,2.4);
        }
    }

    return buffer;
}


function initAudio(){

    if(audioCtx){

        if(audioCtx.state === "suspended"){
            audioCtx.resume();
        }

        return;
    }

    audioCtx =
        new (window.AudioContext ||
             window.webkitAudioContext)();

    masterGain =
        audioCtx.createGain();

    masterGain.gain.value =
        Number(volumeInput.value);

    compressor =
        audioCtx.createDynamicsCompressor();

    compressor.threshold.value = -12;
    compressor.knee.value = 18;
    compressor.ratio.value = 4;
    compressor.attack.value = .003;
    compressor.release.value = .08;

    reverbNode =
        audioCtx.createConvolver();

    reverbNode.buffer =
        createReverbBuffer(audioCtx);

    reverbGain =
        audioCtx.createGain();

    reverbGain.gain.value =
        Number(reverbInput.value);

    masterGain.connect(compressor);

    masterGain.connect(reverbNode);

    reverbNode.connect(reverbGain);
    reverbGain.connect(compressor);

    compressor.connect(audioCtx.destination);

    audioCtx.resume();
}


/* ============================================================
   Utility
============================================================ */

function log(message){
    statusEl.textContent = message;
}

function formatTime(sec){

    if(!Number.isFinite(sec) || sec < 0){
        sec = 0;
    }

    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);

    return String(m).padStart(2,"0") +
        ":" +
        String(s).padStart(2,"0");
}

function clamp(v,min,max){
    return v < min ? min :
           v > max ? max : v;
}


/* ============================================================
   VLQ
============================================================ */

function readVLQ(view,offset,end){

    let value = 0;
    let length = 0;

    while(offset + length < end){

        const b = view.getUint8(offset + length);

        value =
            (value << 7) |
            (b & 0x7f);

        length++;

        if(!(b & 0x80)){
            return {
                value,
                length
            };
        }

        if(length >= 4){
            throw new Error("不正なVLQです");
        }
    }

    throw new Error("VLQが途中で終了しました");
}


/* ============================================================
   Tempo Map
============================================================ */

function buildTempoMap(){

    tempoMap.sort((a,b)=>a.tick-b.tick);

    if(
        tempoMap.length === 0 ||
        tempoMap[0].tick !== 0
    ){
        tempoMap.unshift({
            tick:0,
            usPerQuarter:500000
        });
    }

    let sec = 0;
    let lastTick = 0;
    let lastTempo = 500000;

    for(let i=0;i<tempoMap.length;i++){

        const item = tempoMap[i];

        const dt =
            item.tick-lastTick;

        sec +=
            dt *
            lastTempo /
            1000000 /
            ppqn;

        item.time = sec;

        lastTick = item.tick;
        lastTempo = item.usPerQuarter;
    }
}


function tickToSeconds(tick){

    let lo = 0;
    let hi = tempoMap.length - 1;

    while(lo <= hi){

        const mid = (lo+hi)>>1;

        if(tempoMap[mid].tick <= tick){
            lo = mid+1;
        }else{
            hi = mid-1;
        }
    }

    const index = Math.max(0,hi);
    const tempo = tempoMap[index];

    return tempo.time +
        (tick-tempo.tick) *
        tempo.usPerQuarter /
        1000000 /
        ppqn;
}


/* ============================================================
   MIDI Parser
============================================================ */

function parseMIDI(buffer){

    const view =
        new DataView(buffer);

    let offset = 0;

    if(
        view.byteLength < 14 ||
        view.getUint32(0) !== 0x4d546864
    ){
        throw new Error(
            "有効なMIDIファイルではありません"
        );
    }

    const headerLength =
        view.getUint32(4);

    const format =
        view.getUint16(8);

    const trackCount =
        view.getUint16(10);

    ppqn =
        view.getUint16(12);

    if(ppqn & 0x8000){
        throw new Error(
            "SMPTEタイムディビジョンは未対応です"
        );
    }

    offset =
        8 + headerLength;

    tempoMap = [];
    events = [];
    notes = [];

    let tracks = [];

    for(let t=0;t<trackCount;t++){

        if(offset + 8 > view.byteLength){
            break;
        }

        const id =
            view.getUint32(offset);

        const length =
            view.getUint32(offset+4);

        const start =
            offset+8;

        const end =
            Math.min(
                start+length,
                view.byteLength
            );

        if(id === 0x4d54726b){

            tracks.push({
                index:t,
                start,
                end
            });
        }

        offset =
            start+length;
    }

    let globalMaxTick = 0;

    for(const track of tracks){

        let p = track.start;

        let tick = 0;

        let runningStatus = 0;

        const active =
            new Map();

        let program = 0;

        while(p < track.end){

            const delta =
                readVLQ(view,p,track.end);

            p += delta.length;
            tick += delta.value;

            globalMaxTick =
                Math.max(globalMaxTick,tick);

            if(p >= track.end){
                break;
            }

            let status =
                view.getUint8(p);

            if(status & 0x80){

                runningStatus = status;
                p++;

            }else{

                status = runningStatus;

                if(!status){
                    throw new Error(
                        "Running Statusエラー"
                    );
                }
            }

            if(status === 0xff){

                if(p >= track.end) break;

                const meta =
                    view.getUint8(p++);

                const len =
                    readVLQ(
                        view,
                        p,
                        track.end
                    );

                p += len.length;

                if(meta === 0x51 && len.value >= 3){

                    const us =
                        (view.getUint8(p)<<16) |
                        (view.getUint8(p+1)<<8) |
                        view.getUint8(p+2);

                    tempoMap.push({
                        tick,
                        usPerQuarter:us
                    });
                }

                if(
                    (meta === 0x03 ||
                     meta === 0x01) &&
                    len.value > 0
                ){

                    try{

                        const bytes =
                            new Uint8Array(
                                buffer,
                                view.byteOffset+p,
                                len.value
                            );

                        const text =
                            new TextDecoder()
                                .decode(bytes)
                                .replace(/\0/g,"")
                                .trim();

                        if(text && !songName){
                            songName = text;
                        }

                    }catch(e){}
                }

                p += len.value;

                if(meta === 0x2f){
                    break;
                }

                continue;
            }

            if(status === 0xf0 || status === 0xf7){

                const len =
                    readVLQ(
                        view,
                        p,
                        track.end
                    );

                p +=
                    len.length +
                    len.value;

                continue;
            }

            const type =
                status & 0xf0;

            const channel =
                status & 0x0f;

            let a = 0;
            let b = 0;

            if(
                type !== 0xc0 &&
                type !== 0xd0
            ){

                if(p+2 > track.end) break;

                a = view.getUint8(p++);
                b = view.getUint8(p++);

            }else{

                if(p >= track.end) break;

                a = view.getUint8(p++);
            }


            if(type === 0x90){

                if(b > 0){

                    active.set(
                        channel+"_"+a,
                        {
                            tick,
                            velocity:b,
                            program,
                            channel
                        }
                    );

                }else{

                    const key =
                        channel+"_"+a;

                    const note =
                        active.get(key);

                    if(note){

                        addNote(
                            note,
                            a,
                            tick,
                            track.index
                        );

                        active.delete(key);
                    }
                }

            }else if(type === 0x80){

                const key =
                    channel+"_"+a;

                const note =
                    active.get(key);

                if(note){

                    addNote(
                        note,
                        a,
                        tick,
                        track.index
                    );

                    active.delete(key);
                }

            }else if(type === 0xc0){

                program = a;

                events.push({
                    tick,
                    type:"program",
                    channel,
                    value:a
                });

            }else if(type === 0xb0){

                events.push({
                    tick,
                    type:"cc",
                    channel,
                    controller:a,
                    value:b
                });

            }else if(type === 0xe0){

                const bend =
                    ((b<<7)|a)-8192;

                events.push({
                    tick,
                    type:"bend",
                    channel,
                    value:bend
                });

            }else if(type === 0xd0){

                events.push({
                    tick,
                    type:"aftertouch",
                    channel,
                    value:a
                });

            }else if(type === 0xa0){

                events.push({
                    tick,
                    type:"polyaftertouch",
                    channel,
                    note:a,
                    value:b
                });
            }
        }

        /*
         * BlackMIDIではNote Offが存在しない
         * 異常なデータも考慮して閉じる
         */
        for(const [key,note] of active){

            addNote(
                note,
                key.split("_")[1]|0,
                tick,
                track.index
            );
        }
    }

    buildTempoMap();

    notes.sort(
        (a,b)=>a.start-b.start ||
               a.note-b.note
    );

    events.sort(
        (a,b)=>a.tick-b.tick
    );

    for(const n of notes){

        n.time =
            tickToSeconds(n.start);

        n.endTime =
            tickToSeconds(n.end);

        n.duration =
            Math.max(
                0.001,
                n.endTime-n.time
            );
    }

    if (notes.length > 0) {
        let maxEndTime = 0;

        for (let i = 0; i < notes.length; i++) {
            if (notes[i].endTime > maxEndTime) {
                maxEndTime = notes[i].endTime;
            }
        }

        duration = maxEndTime;
    } else {
        duration = tickToSeconds(globalMaxTick);
    }

    metadata.tracks =
        tracks.length;

    metadata.notes =
        notes.length;

    metadata.maxPolyphony =
        calculatePolyphony();

    playbackPointer = 0;

    return {
        format,
        tracks:tracks.length,
        notes:notes.length,
        duration
    };
}


function addNote(note,noteNumber,endTick,track){

    if(endTick <= note.tick){
        return;
    }

    notes.push({

        note:noteNumber,

        start:note.tick,
        end:endTick,

        velocity:note.velocity,

        channel:note.channel,

        program:note.program,

        track,

        time:0,
        endTime:0,
        duration:0
    });
}


/* ============================================================
   Polyphony
============================================================ */

function calculatePolyphony(){

    const points = [];

    for(const n of notes){

        points.push({
            t:n.start,
            d:1
        });

        points.push({
            t:n.end,
            d:-1
        });
    }

    points.sort((a,b)=>
        a.t-b.t ||
        a.d-b.d
    );

    let count = 0;
    let max = 0;

    for(const p of points){

        count += p.d;

        if(count > max){
            max = count;
        }
    }

    return max;
}


/* ============================================================
   Program / CC state
============================================================ */

function resetChannels(){

    for(let i=0;i<16;i++){

        channels[i] =
            createChannel();
    }
}


function applyEvent(event){

    const ch =
        channels[event.channel];

    if(!ch) return;

    if(event.type === "program"){

        ch.program =
            event.value;

    }else if(event.type === "bend"){

        ch.pitchBend =
            event.value;

    }else if(event.type === "cc"){

        ch.controllers[event.controller] =
            event.value;

        if(event.controller === 7){

            ch.volume =
                event.value / 127;

        }else if(event.controller === 10){

            ch.pan =
                event.value / 127;

        }else if(event.controller === 11){

            ch.expression =
                event.value / 127;

        }else if(event.controller === 64){

            const old =
                ch.sustain;

            ch.sustain =
                event.value >= 64;

            if(old && !ch.sustain){

                releaseSustained(ch);
            }
        }
    }
}


function releaseSustained(ch){

    for(const voice of ch.sustained){

        try{
            voice.release();
        }catch(e){}
    }

    ch.sustained.length = 0;
}


/* ============================================================
   Voice Engine
============================================================ */

const PROGRAM_TYPES = {

    piano:[0,7],
    chromatic:[8,15],
    organ:[16,23],
    guitar:[24,31],
    bass:[32,39],
    strings:[40,47],
    ensemble:[48,55],
    brass:[56,63],
    reed:[64,71],
    pipe:[72,79],
    synth:[80,95],
    ethnic:[96,103],
    percussion:[104,111],
    effects:[112,127]
};


function getInstrumentType(program){

    for(const type in PROGRAM_TYPES){

        const range =
            PROGRAM_TYPES[type];

        if(
            program >= range[0] &&
            program <= range[1]
        ){
            return type;
        }
    }

    return "piano";
}


function midiFrequency(note){

    return 440 *
        Math.pow(
            2,
            (note-69)/12
        );
}


function removeVoice(voice){

    const i =
        activeVoices.indexOf(voice);

    if(i >= 0){
        activeVoices.splice(i,1);
    }
}


function limitVoices(){

    while(
        activeVoices.length >
        MAX_VOICES
    ){

        const voice =
            activeVoices.shift();

        try{

            voice.stop(
                audioCtx.currentTime
            );

        }catch(e){}
    }
}


/* ============================================================
   Voice Creation
============================================================ */

function playNote(
    note,
    when,
    durationSec,
    velocity,
    channel,
    program,
    track
){

    if(!audioCtx || !masterGain){
        return;
    }

    const ch =
        channels[channel];

    if(!ch){
        return;
    }

    const vol =
        (velocity/127) *
        ch.volume *
        ch.expression;

    if(vol <= 0.0001){
        return;
    }

    const isDrum =
        channel === 9;

    if(isDrum){

        playDrum(
            note,
            when,
            durationSec,
            vol
        );

        return;
    }

    const type =
        getInstrumentType(program);

    const freq =
        midiFrequency(note) *
        Math.pow(
            2,
            (ch.pitchBend/8192) *
            ch.pitchRange /
            12
        );

    let oscType = "sine";

    switch(type){

        case "piano":
            oscType = "triangle";
            break;

        case "guitar":
            oscType = "triangle";
            break;

        case "bass":
            oscType = "sawtooth";
            break;

        case "strings":
        case "ensemble":
            oscType = "sawtooth";
            break;

        case "brass":
            oscType = "sawtooth";
            break;

        case "reed":
            oscType = "square";
            break;

        case "organ":
            oscType = "sine";
            break;

        case "synth":
            oscType = "sawtooth";
            break;

        case "pipe":
            oscType = "sine";
            break;

        default:
            oscType = "triangle";
    }

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    const pan =
        audioCtx.createStereoPanner();

    const panValue =
        ch.pan * 2 - 1;

    pan.pan.setValueAtTime(
        panValue,
        when
    );

    osc.type =
        oscType;

    osc.frequency.setValueAtTime(
        freq,
        when
    );

    /*
     * 少しだけ倍音を追加
     */
    let osc2 = null;
    let gain2 = null;

    if(
        type === "piano" ||
        type === "strings" ||
        type === "brass"
    ){

        osc2 =
            audioCtx.createOscillator();

        gain2 =
            audioCtx.createGain();

        osc2.type =
            type === "piano" ?
            "sine" :
            oscType;

        osc2.frequency.setValueAtTime(
            freq * (
                type === "piano" ?
                2 :
                1.002
            ),
            when
        );

        gain2.gain.setValueAtTime(
            vol * (
                type === "piano" ?
                .12 :
                .18
            ),
            when
        );

        osc2.connect(gain2);
        gain2.connect(pan);

        osc2.start(when);
        osc2.stop(
            when+
            Math.max(.05,durationSec)+.2
        );
    }


    /*
     * ADSR
     */

    const attack =
        type === "piano" ? .004 :
        type === "strings" ? .12 :
        type === "brass" ? .04 :
        .015;

    const release =
        type === "piano" ? .12 :
        type === "strings" ? .3 :
        .08;

    const sustain =
        type === "piano" ? .28 :
        type === "strings" ? .75 :
        .6;

    const peak =
        Math.max(
            .0001,
            vol
        );

    const sustainLevel =
        peak*sustain;

    gain.gain.setValueAtTime(
        .00001,
        when
    );

    gain.gain.linearRampToValueAtTime(
        peak,
        when+attack
    );

    if(durationSec > attack){

        gain.gain.exponentialRampToValueAtTime(
            Math.max(.00001,sustainLevel),
            when+
            Math.max(
                attack+.01,
                Math.min(
                    durationSec*.5,
                    durationSec
                )
            )
        );
    }

    const releaseStart =
        Math.max(
            when+attack+.01,
            when+durationSec-release
        );

    gain.gain.setValueAtTime(
        Math.max(.00001,sustainLevel),
        releaseStart
    );

    gain.gain.exponentialRampToValueAtTime(
        .00001,
        when+durationSec
    );

    osc.connect(gain);
    gain.connect(pan);
    pan.connect(masterGain);

    /*
     * リバーブへも少し送る
     */
    const send =
        audioCtx.createGain();

    send.gain.value =
        Math.min(
            .25,
            vol*.12
        );

    gain.connect(send);
    send.connect(reverbNode);


    const voice = {

        osc,
        gain,
        channel,

        stop(time){

            try{

                gain.gain.cancelScheduledValues(time);

                gain.gain.setValueAtTime(
                    Math.max(
                        .00001,
                        gain.gain.value
                    ),
                    time
                );

                gain.gain.exponentialRampToValueAtTime(
                    .00001,
                    time+.04
                );

                osc.stop(time+.05);

                if(osc2){
                    osc2.stop(time+.05);
                }

            }catch(e){}
        },

        release(){

            this.stop(
                audioCtx.currentTime
            );

            removeVoice(this);
        }
    };

    activeVoices.push(voice);

    limitVoices();

    osc.start(when);

    /*
     * Sustain Pedal
     */
    if(ch.sustain){

        ch.sustained.push(voice);
    }

    setTimeout(
        ()=>{
            removeVoice(voice);
        },
        Math.max(
            100,
            (durationSec+.5)*1000
        )
    );
}


/* ============================================================
   Drum Synth
============================================================ */

function playDrum(
    note,
    when,
    durationSec,
    velocity
){

    if(!audioCtx) return;

    const gain =
        audioCtx.createGain();

    const osc =
        audioCtx.createOscillator();

    const noise =
        audioCtx.createBufferSource();

    const noiseGain =
        audioCtx.createGain();

    const filter =
        audioCtx.createBiquadFilter();

    const buffer =
        audioCtx.createBuffer(
            1,
            Math.floor(audioCtx.sampleRate*.25),
            audioCtx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){

        data[i] =
            Math.random()*2-1;
    }

    noise.buffer = buffer;

    const v =
        Math.min(
            1,
            velocity*1.4
        );

    /*
     * Kick
     */
    if(note === 35 || note === 36){

        osc.type = "sine";

        osc.frequency.setValueAtTime(
            150,
            when
        );

        osc.frequency.exponentialRampToValueAtTime(
            45,
            when+.08
        );

        gain.gain.setValueAtTime(
            v,
            when
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            when+.18
        );

        osc.connect(gain);
        gain.connect(masterGain);

        osc.start(when);
        osc.stop(when+.2);

        return;
    }

    /*
     * Snare
     */
    if(note === 38 || note === 40){

        filter.type = "highpass";
        filter.frequency.value = 1000;

        noiseGain.gain.setValueAtTime(
            v*.8,
            when
        );

        noiseGain.gain.exponentialRampToValueAtTime(
            .001,
            when+.16
        );

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(masterGain);

        noise.start(when);
        noise.stop(when+.18);

        osc.type = "triangle";
        osc.frequency.value = 180;

        gain.gain.setValueAtTime(
            v*.5,
            when
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            when+.08
        );

        osc.connect(gain);
        gain.connect(masterGain);

        osc.start(when);
        osc.stop(when+.1);

        return;
    }

    /*
     * HiHat / Cymbal
     */
    if(
        note === 42 ||
        note === 44 ||
        note === 46 ||
        note >= 49
    ){

        filter.type = "highpass";

        filter.frequency.value =
            note >= 49 ?
            3000 :
            6000;

        noiseGain.gain.setValueAtTime(
            v*.45,
            when
        );

        noiseGain.gain.exponentialRampToValueAtTime(
            .001,
            when+
            (note >= 49 ? .6 : .08)
        );

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(masterGain);

        noise.start(when);

        noise.stop(
            when+
            (note >= 49 ? .65 : .1)
        );

        return;
    }

    /*
     * Tomなど
     */
    osc.type = "sine";

    osc.frequency.setValueAtTime(
        160 +
        (note-45)*12,
        when
    );

    osc.frequency.exponentialRampToValueAtTime(
        60,
        when+.15
    );

    gain.gain.setValueAtTime(
        v*.7,
        when
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        when+.2
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(when);
    osc.stop(when+.22);
}


/* ============================================================
   Playback scheduler
============================================================ */

const SCHEDULE_AHEAD = .12;
const SCHEDULE_INTERVAL = .025;

let schedulerTimer = null;

function resetPlaybackState(){

    playbackPointer = 0;

    while(
        playbackPointer < notes.length &&
        notes[playbackPointer].time < currentTime
    ){

        playbackPointer++;
    }
}


function scheduleNotes(){

    if(!isPlaying || !audioCtx){
        return;
    }

    const audioNow =
        audioCtx.currentTime;

    const lookUntil =
        currentTime +
        SCHEDULE_AHEAD *
        playbackSpeed;

    while(
        playbackPointer < notes.length
    ){

        const n =
            notes[playbackPointer];

        if(n.time > lookUntil){
            break;
        }

        if(n.endTime >= currentTime){

            const relative =
                (n.time-currentTime) /
                playbackSpeed;

            const when =
                audioNow+
                Math.max(
                    0,
                    relative
                );

            playNote(
                n.note,
                when,
                n.duration/
                    playbackSpeed,
                n.velocity,
                n.channel,
                n.program,
                n.track
            );
        }

        playbackPointer++;
    }
}


function startScheduler(){

    stopScheduler();

    schedulerTimer =
        setInterval(
            scheduleNotes,
            SCHEDULE_INTERVAL*1000
        );
}


function stopScheduler(){

    if(schedulerTimer){

        clearInterval(
            schedulerTimer
        );

        schedulerTimer = null;
    }
}


/* ============================================================
   Transport
============================================================ */

function getCurrentTime(){

    if(
        !isPlaying ||
        !audioCtx
    ){
        return currentTime;
    }

    return pauseTime +
        (
            audioCtx.currentTime -
            startAudioTime
        ) *
        playbackSpeed;
}


function startPlayback(){

    if(!notes.length){
        log("MIDIファイルを先に開いてください。");
        return;
    }

    initAudio();

    if(
        currentTime >= duration
    ){

        currentTime = 0;

        resetChannels();
        resetPlaybackState();
    }

    isPlaying = true;

    startAudioTime =
        audioCtx.currentTime;

    pauseTime =
        currentTime;

    playBtn.textContent =
        "⏸ 一時停止";

    startScheduler();

    requestAnimationFrame(render);
}


function pausePlayback(){

    if(!isPlaying){
        return;
    }

    currentTime =
        getCurrentTime();

    isPlaying = false;

    stopScheduler();

    playBtn.textContent =
        "▶ 再生";

    stopVoices();

    updateUI();
}


function stopPlayback(){

    isPlaying = false;

    stopScheduler();

    currentTime = 0;
    pauseTime = 0;

    playbackPointer = 0;

    stopVoices();

    resetChannels();

    playBtn.textContent =
        "▶ 再生";

    updateUI();

    draw();
}


function stopVoices(){

    if(!audioCtx){
        activeVoices.length = 0;
        return;
    }

    const now =
        audioCtx.currentTime;

    for(const voice of activeVoices){

        try{
            voice.stop(now);
        }catch(e){}
    }

    activeVoices.length = 0;
}


/* ============================================================
   Seek
============================================================ */

function seekTo(time){

    time =
        clamp(
            Number(time),
            0,
            duration
        );

    currentTime = time;
    pauseTime = time;

    stopVoices();

    resetChannels();

    /*
     * Seek地点までのMIDIイベントを適用
     */
    for(
        let i=0;
        i<events.length;
        i++
    ){

        const e =
            events[i];

        if(
            tickToSeconds(e.tick) >
            time
        ){
            break;
        }

        applyEvent(e);
    }

    resetPlaybackState();

    if(isPlaying){

        startAudioTime =
            audioCtx.currentTime;

        pauseTime =
            time;
    }

    updateUI();
}


/* ============================================================
   Render
============================================================ */

const colors = [
    "#38bdf8",
    "#f43f5e",
    "#10b981",
    "#fbbf24",
    "#a855f7",
    "#ec4899",
    "#f97316",
    "#14b8a6"
];


function findFirstVisible(time){

    let lo = 0;
    let hi = notes.length-1;

    while(lo <= hi){

        const mid =
            (lo+hi)>>1;

        if(
            notes[mid].time <
            time
        ){

            lo = mid+1;

        }else{

            hi = mid-1;
        }
    }

    return lo;
}


function draw(){

    ctx.fillStyle =
        "#000";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    const speed =
        Number(viewSpeedInput.value);

    const kW =
        W / NOTE_COUNT;

    const visibleStart =
        currentTime -
        2;

    const visibleEnd =
        currentTime +
        keyboardY/speed;

    const first =
        findFirstVisible(
            visibleStart
        );

    /*
     * 色ごとのPath
     */
    const paths =
        new Map();

    const hitNotes = [];

    for(let i=first;i<notes.length;i++){

        const n =
            notes[i];

        if(n.time > visibleEnd){
            break;
        }

        if(
            n.note < MIN_NOTE ||
            n.note > MAX_NOTE
        ){
            continue;
        }

        if(
            n.endTime <
            visibleStart
        ){
            continue;
        }

        const x =
            (n.note-MIN_NOTE)*kW;

        const y =
            keyboardY -
            (n.time-currentTime) *
            speed;

        const height =
            Math.max(
                2,
                n.duration*speed
            );

        const color =
            n.channel === 9 ?
            "#666" :
            colors[
                n.track %
                colors.length
            ];

        const rect = {
            x:x+1,
            y:y-height,
            w:Math.max(1,kW-2),
            h:height
        };

        if(
            currentTime >= n.time &&
            currentTime <= n.endTime
        ){

            hitNotes.push(rect);

        }else{

            if(!paths.has(color)){
                paths.set(color,[]);
            }

            paths.get(color).push(rect);
        }
    }

    /*
     * 一括描画
     */
    for(const [color,arr] of paths){

        ctx.fillStyle = color;

        ctx.beginPath();

        for(const r of arr){

            ctx.rect(
                r.x,
                r.y,
                r.w,
                r.h
            );
        }

        ctx.fill();
    }

    /*
     * 発音中ノーツ
     */
    if(hitNotes.length){

        ctx.fillStyle =
            "#fff";

        ctx.beginPath();

        for(const r of hitNotes){

            ctx.rect(
                r.x,
                r.y,
                r.w,
                r.h
            );
        }

        ctx.fill();
    }

    drawKeyboard(kW);

    /*
     * 判定ライン
     */
    ctx.strokeStyle =
        "#ff0055";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        0,
        keyboardY
    );

    ctx.lineTo(
        W,
        keyboardY
    );

    ctx.stroke();
}


function drawKeyboard(kW){

    const active =
        new Set();

    if(notes.length){

        /*
         * 現在鳴っているノーツだけ探す
         */
        const first =
            findFirstVisible(
                currentTime-.5
            );

        for(
            let i=first;
            i<notes.length;
            i++
        ){

            const n =
                notes[i];

            if(n.time > currentTime){
                break;
            }

            if(
                n.endTime >= currentTime
            ){

                active.add(
                    n.note
                );
            }
        }
    }

    for(let i=0;i<NOTE_COUNT;i++){

        const note =
            MIN_NOTE+i;

        const x =
            i*kW;

        const pc =
            note%12;

        const black =
            pc===1 ||
            pc===3 ||
            pc===6 ||
            pc===8 ||
            pc===10;

        ctx.fillStyle =
            active.has(note) ?
            "#ffffff" :
            black ?
            "#151515" :
            "#f5f5f5";

        ctx.fillRect(
            x,
            keyboardY,
            Math.max(1,kW-1),
            H-keyboardY
        );
    }
}


/* ============================================================
   Main animation
============================================================ */

let lastFrame = 0;

function render(timestamp){

    if(!isPlaying){

        draw();
        return;
    }

    currentTime =
        getCurrentTime();

    if(currentTime >= duration){

        if(loopEnabled){

            currentTime = 0;
            pauseTime = 0;

            resetChannels();
            resetPlaybackState();

            startAudioTime =
                audioCtx.currentTime;

        }else{

            stopPlayback();
            return;
        }
    }

    draw();

    updateUI();

    requestAnimationFrame(
        render
    );
}


/* ============================================================
   UI
============================================================ */

function updateUI(){

    timeEl.textContent =
        formatTime(currentTime) +
        " / " +
        formatTime(duration);

    seek.value =
        duration ?
        currentTime/duration :
        0;

    if(notes.length){

        trackInfoEl.textContent =
            `${metadata.tracks} Tracks  |  ` +
            `${metadata.notes.toLocaleString()} Notes  |  ` +
            `Polyphony ${metadata.maxPolyphony}`;
    }else{

        trackInfoEl.textContent = "";
    }
}


fileInput.addEventListener(
    "change",
    async e=>{

        const file =
            e.target.files &&
            e.target.files[0];

        if(!file){
            return;
        }

        stopPlayback();

        songName =
            file.name;

        songEl.textContent =
            songName;

        log(
            "解析中... " +
            file.name
        );

        try{

            const buffer =
                await file.arrayBuffer();

            const result =
                parseMIDI(buffer);

            resetChannels();

            currentTime = 0;
            pauseTime = 0;

            seek.value = 0;

            playBtn.disabled = false;

            log(
                "読み込み完了  " +
                result.notes.toLocaleString() +
                " notes / " +
                formatTime(result.duration)
            );

            draw();
            updateUI();

        }catch(error){

            console.error(error);

            notes = [];
            events = [];

            duration = 0;

            log(
                "読み込み失敗: " +
                error.message
            );

            songEl.textContent =
                "BlackMIDI Player";
        }
    }
);


playBtn.addEventListener(
    "click",
    ()=>{

        if(isPlaying){

            pausePlayback();

        }else{

            startPlayback();
        }
    }
);


stopBtn.addEventListener(
    "click",
    stopPlayback
);


loopBtn.addEventListener(
    "click",
    ()=>{

        loopEnabled =
            !loopEnabled;

        loopBtn.textContent =
            loopEnabled ?
            "🔁 ループON" :
            "🔁 ループOFF";
    }
);


seek.addEventListener(
    "input",
    ()=>{

        if(!duration){
            return;
        }

        seekTo(
            Number(seek.value) *
            duration
        );
    }
);


volumeInput.addEventListener(
    "input",
    ()=>{

        if(masterGain){

            masterGain.gain.value =
                Number(volumeInput.value);
        }
    }
);


reverbInput.addEventListener(
    "input",
    ()=>{

        if(reverbGain){

            reverbGain.gain.value =
                Number(reverbInput.value);
        }
    }
);


speedInput.addEventListener(
    "input",
    ()=>{

        const newSpeed =
            Number(speedInput.value);

        if(isPlaying){

            currentTime =
                getCurrentTime();

            pauseTime =
                currentTime;

            startAudioTime =
                audioCtx.currentTime;

            stopVoices();

            playbackSpeed =
                newSpeed;

            resetPlaybackState();

        }else{

            playbackSpeed =
                newSpeed;
        }
    }
);


settingsBtn.addEventListener(
    "click",
    ()=>{

        const el =
            document.getElementById(
                "settings"
            );

        el.style.display =
            el.style.display === "block" ?
            "none" :
            "block";
    }
);


/* ============================================================
   Keyboard shortcuts
============================================================ */

window.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName === "INPUT"
        ){
            return;
        }

        if(e.code === "Space"){

            e.preventDefault();

            if(isPlaying){
                pausePlayback();
            }else{
                startPlayback();
            }
        }

        if(e.code === "Escape"){

            stopPlayback();
        }

        if(e.code === "ArrowLeft"){

            seekTo(
                currentTime-5
            );
        }

        if(e.code === "ArrowRight"){

            seekTo(
                currentTime+5
            );
        }
    }
);


/* ============================================================
   Initial
============================================================ */

playBtn.disabled = false;

draw();
updateUI();

</script>

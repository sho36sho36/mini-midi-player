<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>超軽量 BlackMIDI Player</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:sans-serif;
    overflow:hidden;
    position:fixed;
    width:100%;
    height:100%;
}

#ctl{
    position:absolute;
    top:10px;
    left:10px;
    z-index:10;
    display:flex;
    gap:10px;
}

input[type="file"]{
    display:none;
}

.btn{
    background:#2563eb;
    color:#fff;
    padding:8px 16px;
    border-radius:20px;
    font-size:14px;
    font-weight:bold;
    border:none;
    cursor:pointer;
}

.btn:hover{
    background:#1d4ed8;
}

.btn:active{
    background:#1e40af;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
}

#log{
    position:absolute;
    bottom:110px;
    left:10px;
    right:10px;
    background:rgba(0,0,0,0.8);
    color:#00ff00;
    font-family:monospace;
    font-size:11px;
    padding:6px;
    max-height:50px;
    z-index:20;
    pointer-events:none;
    border-radius:4px;
}
</style>
</head>

<body>

<div id="ctl">

    <label class="btn" for="fInp">
        📁 MIDIを開く
    </label>

    <input
        type="file"
        id="fInp"
        accept=".mid,.midi"
    >

    <button
        class="btn"
        id="pBtn"
        style="display:none;"
    >
        ▶ 再生
    </button>

</div>

<div id="log">
    ログ: BlackMIDI対応。ファイルを選択してください。
</div>

<canvas id="cvs"></canvas>

<script>

/* =========================================================
   基本設定
========================================================= */

const cvs =
    document.getElementById('cvs');

const ctx =
    cvs.getContext('2d', {
        alpha: false
    });

const fInp =
    document.getElementById('fInp');

const pBtn =
    document.getElementById('pBtn');

const logDiv =
    document.getElementById('log');


/* =========================================================
   表示設定
========================================================= */

const MIN_NOTE = 36;
const MAX_NOTE = 96;

const NOTE_CNT =
    MAX_NOTE - MIN_NOTE + 1;

const SPEED = 250;


/* =========================================================
   オーディオ
========================================================= */

let audioCtx = null;
let mainGain = null;
let reverbNode = null;


/* =========================================================
   再生状態
========================================================= */

let isPlaying = false;

let startTime = 0;

let pauseTime = 0;

let notes = [];

let kyY = 0;

let loopEnabled = false;


/* =========================================================
   音声設定
========================================================= */

const MAX_VOICES = 128;

let activeVoices = [];


/*
    note + channelごとの最終発音時間。

    元コードのObjectをやめて固定配列にすることで、
    BlackMIDI大量ノーツ時のメモリ増加を抑える。
*/

const lastPlayTimes =
    new Float64Array(16 * 128);


/*
    0 = 一度も鳴っていない
*/

lastPlayTimes.fill(-999);


/* =========================================================
   色
========================================================= */

const CLRS = [
    '#38bdf8',
    '#f43f5e',
    '#10b981',
    '#fbbf24',
    '#a855f7',
    '#ec4899',
    '#f97316',
    '#14b8a6'
];


/* =========================================================
   ログ
========================================================= */

function showLog(m){

    logDiv.innerText =
        "ログ: " + m;
}


window.onerror =
    (m, s, l) => {

        showLog(
            "エラー: " +
            m +
            " (L:" +
            l +
            ")"
        );

        return false;
    };


/* =========================================================
   Canvasサイズ
========================================================= */

let dpr = 1;

function resize(){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;

    /*
        高DPIを無制限にすると
        BlackMIDIでは描画負荷が上がるので
        最大2倍まで。
    */

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    cvs.width =
        Math.floor(w * dpr);

    cvs.height =
        Math.floor(h * dpr);

    /*
        scale()を毎回積み重ねない。
    */

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    kyY =
        h - 100;

    draw(0);
}


window.addEventListener(
    'resize',
    resize
);

resize();


/* =========================================================
   軽量リバーブ
========================================================= */

function createReverbBuffer(
    audio,
    duration,
    decay
){

    const rate =
        audio.sampleRate;

    const length =
        Math.floor(
            rate * duration
        );

    const buffer =
        audio.createBuffer(
            2,
            length,
            rate
        );


    for(
        let channel = 0;
        channel < 2;
        channel++
    ){

        const data =
            buffer.getChannelData(
                channel
            );

        for(
            let i = 0;
            i < length;
            i++
        ){

            data[i] =
                (
                    Math.random() * 2 - 1
                ) *
                Math.pow(
                    1 - i / length,
                    decay
                );
        }
    }

    return buffer;
}


/* =========================================================
   Audio Engine
========================================================= */

function initAudioEngine(){

    if(!audioCtx){

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        mainGain =
            audioCtx.createGain();


        /*
            リバーブは元コードの雰囲気を維持。
            ただし少し短くして軽量化。
        */

        reverbNode =
            audioCtx.createConvolver();

        reverbNode.buffer =
            createReverbBuffer(
                audioCtx,
                1.2,
                2.4
            );


        const reverbGain =
            audioCtx.createGain();

        reverbGain.gain.setValueAtTime(
            0.14,
            audioCtx.currentTime
        );


        const compressor =
            audioCtx.createDynamicsCompressor();

        compressor.threshold.setValueAtTime(
            -10,
            audioCtx.currentTime
        );

        compressor.knee.setValueAtTime(
            15,
            audioCtx.currentTime
        );

        compressor.ratio.setValueAtTime(
            4,
            audioCtx.currentTime
        );

        compressor.attack.setValueAtTime(
            0.002,
            audioCtx.currentTime
        );

        compressor.release.setValueAtTime(
            0.08,
            audioCtx.currentTime
        );


        mainGain.connect(
            compressor
        );

        mainGain.connect(
            reverbNode
        );

        reverbNode.connect(
            reverbGain
        );

        reverbGain.connect(
            compressor
        );

        compressor.connect(
            audioCtx.destination
        );
    }


    if(
        audioCtx.state ===
        'suspended'
    ){

        audioCtx.resume();
    }
}


/* =========================================================
   音程
========================================================= */

function noteFrequency(n){

    return (
        440 *
        Math.pow(
            2,
            (n - 69) / 12
        )
    );
}


/* =========================================================
   音色
========================================================= */

function getWaveform(inst){

    /*
        GM系をざっくり分類。
        元コードの方向性を維持。
    */

    if(
        inst >= 24 &&
        inst <= 31
    ){
        return 'triangle';
    }

    if(
        (
            inst >= 16 &&
            inst <= 23
        ) ||
        (
            inst >= 40 &&
            inst <= 51
        )
    ){
        return 'sawtooth';
    }

    if(
        inst >= 56 &&
        inst <= 79
    ){
        return 'square';
    }

    return 'sine';
}


/* =========================================================
   Voice停止
========================================================= */

function stopVoice(v){

    if(!v){
        return;
    }

    try{
        v.gain.gain.cancelScheduledValues(
            audioCtx.currentTime
        );
    }catch(e){}

    try{
        v.gain.gain.setTargetAtTime(
            0,
            audioCtx.currentTime,
            0.004
        );
    }catch(e){}

    try{
        v.osc.stop(
            audioCtx.currentTime + 0.025
        );
    }catch(e){}
}


/* =========================================================
   音声クリーンアップ
========================================================= */

function cleanVoices(){

    if(!audioCtx){
        return;
    }

    const now =
        audioCtx.currentTime;

    /*
        配列をfilter()で毎回作り直さない。
    */

    let write = 0;

    for(
        let i = 0;
        i < activeVoices.length;
        i++
    ){

        const v =
            activeVoices[i];

        if(
            now <
            v.end
        ){

            activeVoices[write++] =
                v;

        }else{

            try{
                v.osc.disconnect();
            }catch(e){}

            try{
                v.gain.disconnect();
            }catch(e){}
        }
    }

    activeVoices.length =
        write;
}


/* =========================================================
   NOTE再生
========================================================= */

function playTone(
    n,
    d,
    vel,
    ch,
    inst,
    tr,
    targetTime
){

    if(!audioCtx){
        return;
    }


    /*
        targetTimeはMIDI上の秒数。
        startTimeを足してAudioContext時間へ。
    */

    const playTime =
        targetTime +
        startTime;


    /*
        過去に入ってしまった音は無視。
    */

    if(
        playTime <
        audioCtx.currentTime - 0.01
    ){
        return;
    }


    /*
        同じチャンネル・音程の
        極端な連打だけ間引く。

        BlackMIDIでは非常に重要。
    */

    const key =
        ch * 128 + n;

    if(
        targetTime -
        lastPlayTimes[key]
        < 0.018
    ){

        return;
    }

    lastPlayTimes[key] =
        targetTime;


    /*
        古いVoiceを掃除。
    */

    cleanVoices();


    /*
        最大発音数。
    */

    if(
        activeVoices.length >=
        MAX_VOICES
    ){

        const oldest =
            activeVoices.shift();

        stopVoice(oldest);
    }


    /* =====================================================
       音量
    ===================================================== */

    let trackWeight = 0.05;

    if(
        tr <= 2
    ){
        trackWeight = 0.16;
    }

    /*
        極端に大量の音が重なると
        コンプレッサーだけでは厳しいため
        少し余裕を持たせる。
    */

    const vol =
        (
            vel / 127
        ) *
        trackWeight;


    /* =====================================================
       ドラム
    ===================================================== */

    if(ch === 9){

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();


        const isKick =
            n === 35 ||
            n === 36;


        osc.type =
            'triangle';


        if(isKick){

            osc.frequency.setValueAtTime(
                110,
                playTime
            );

            osc.frequency.exponentialRampToValueAtTime(
                45,
                playTime + 0.06
            );

        }else{

            osc.frequency.setValueAtTime(
                5000,
                playTime
            );
        }


        gain.gain.setValueAtTime(
            vol * 0.9,
            playTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            playTime + (
                isKick ? 0.08 : 0.035
            )
        );


        osc.connect(gain);
        gain.connect(mainGain);


        const end =
            playTime +
            (
                isKick
                    ? 0.09
                    : 0.045
            );


        osc.start(playTime);
        osc.stop(end);


        activeVoices.push({
            osc:osc,
            gain:gain,
            end:end
        });

        return;
    }


    /* =====================================================
       通常音
    ===================================================== */

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();


    const freq =
        noteFrequency(n);


    osc.frequency.setValueAtTime(
        freq,
        playTime
    );


    osc.type =
        getWaveform(inst);


    /*
        軽量化のため
        元コードの「追加Attack Oscillator」は削除。

        ここが大量BlackMIDIではかなり効く。
        1音 = Oscillator 1個。
    */


    gain.gain.setValueAtTime(
        0.0001,
        playTime
    );


    gain.gain.linearRampToValueAtTime(
        vol,
        playTime + 0.003
    );


    /*
        dが0や極端に短い場合にも
        AudioParamエラーを出さない。
    */

    const safeDuration =
        Math.max(
            0.008,
            d
        );


    let releaseTime;


    if(
        getWaveform(inst) ===
        'sine'
    ){

        /*
            ピアノ系
        */

        const sustainVolume =
            Math.max(
                0.0001,
                vol * 0.25
            );


        const decayTime =
            Math.min(
                safeDuration,
                2.5
            );


        releaseTime =
            playTime +
            safeDuration +
            0.04;


        gain.gain.exponentialRampToValueAtTime(
            sustainVolume,
            playTime + decayTime
        );

        gain.gain.setValueAtTime(
            sustainVolume,
            playTime + safeDuration
        );

    }else{

        /*
            ストリングス等
        */

        releaseTime =
            playTime +
            safeDuration +
            0.025;


        gain.gain.setValueAtTime(
            Math.max(
                0.0001,
                vol
            ),
            playTime +
            Math.max(
                0,
                safeDuration - 0.008
            )
        );
    }


    gain.gain.linearRampToValueAtTime(
        0.0001,
        releaseTime
    );


    osc.connect(gain);

    gain.connect(mainGain);


    osc.start(playTime);

    osc.stop(
        releaseTime + 0.01
    );


    activeVoices.push({
        osc:osc,
        gain:gain,
        end:releaseTime + 0.02
    });
}


/* =========================================================
   VLQ
========================================================= */

function readVLQ(v, o){

    let val = 0;
    let idx = 0;

    while(
        idx < 4 &&
        o + idx < v.byteLength
    ){

        const b =
            v.getUint8(
                o + idx
            );

        idx++;

        val =
            (
                val << 7
            ) |
            (
                b & 127
            );

        if(
            !(b & 128)
        ){
            break;
        }
    }

    return {
        val:val,
        idx:idx
    };
}


/* =========================================================
   MIDI解析
========================================================= */

function parseMIDI(buf){

    const v =
        new DataView(buf);


    if(
        v.byteLength < 14
    ){
        throw new Error(
            "MIDIファイルが短すぎます"
        );
    }


    /*
        MThd
    */

    if(
        v.getUint32(0) !==
        0x4D546864
    ){

        throw new Error(
            "無効なMIDIファイルです"
        );
    }


    const hLen =
        v.getUint32(4);

    const format =
        v.getUint16(8);

    const tCnt =
        v.getUint16(10);

    const tDiv =
        v.getUint16(12);


    if(
        tDiv & 0x8000
    ){

        throw new Error(
            "SMPTE形式には未対応です"
        );
    }


    /*
        トラック位置
    */

    let off =
        8 + hLen;


    const trackOffsets = [];
    const trackEnds = [];


    for(
        let t = 0;
        t < tCnt;
        t++
    ){

        if(
            off + 8 >
            v.byteLength
        ){
            break;
        }


        if(
            v.getUint32(off) !==
            0x4D54726B
        ){

            const badLen =
                v.getUint32(
                    off + 4
                );

            off +=
                8 + badLen;

            continue;
        }


        const tLen =
            v.getUint32(
                off + 4
            );


        const start =
            off + 8;

        const end =
            Math.min(
                start + tLen,
                v.byteLength
            );


        trackOffsets.push(start);
        trackEnds.push(end);


        off =
            start + tLen;
    }


    /* =====================================================
       Tempo
    ===================================================== */

    const tempoEvents = [];


    /* =====================================================
       生ノート
    ===================================================== */

    const allNotesRaw = [];


    /* =====================================================
       Track解析
    ===================================================== */

    for(
        let t = 0;
        t < trackOffsets.length;
        t++
    ){

        let tOff =
            trackOffsets[t];

        const tEnd =
            trackEnds[t];


        let currentTick = 0;

        let rStat = 0;


        /*
            プログラムはチャンネル別。
        */

        const programs =
            new Uint8Array(16);


        /*
            同じ音程の重複ノートに対応。

            act[key] = 配列
        */

        const act =
            new Map();


        while(
            tOff < tEnd
        ){

            const vlq =
                readVLQ(
                    v,
                    tOff
                );


            tOff +=
                vlq.idx;


            currentTick +=
                vlq.val;


            if(
                tOff >= tEnd
            ){
                break;
            }


            let stat =
                v.getUint8(tOff);


            /*
                Running Status
            */

            if(
                stat & 128
            ){

                tOff++;

                /*
                    Channel Messageのみ
                    running statusとして保存。
                */

                if(
                    stat >= 0x80 &&
                    stat <= 0xEF
                ){

                    rStat =
                        stat;
                }

            }else{

                if(
                    !rStat
                ){
                    break;
                }

                stat =
                    rStat;
            }


            /* =================================================
               META
            ================================================= */

            if(
                stat === 0xFF
            ){

                if(
                    tOff >= tEnd
                ){
                    break;
                }


                const metaType =
                    v.getUint8(
                        tOff++
                    );


                const mV =
                    readVLQ(
                        v,
                        tOff
                    );


                tOff +=
                    mV.idx;


                const metaLen =
                    mV.val;


                if(
                    metaType === 0x51 &&
                    metaLen >= 3 &&
                    tOff + 3 <= tEnd
                ){

                    const u1 =
                        v.getUint8(tOff);

                    const u2 =
                        v.getUint8(tOff + 1);

                    const u3 =
                        v.getUint8(tOff + 2);


                    const mpb =
                        (
                            u1 << 16
                        ) |
                        (
                            u2 << 8
                        ) |
                        u3;


                    if(
                        mpb > 0
                    ){

                        tempoEvents.push({
                            tick:currentTick,
                            bpm:
                                60000000 /
                                mpb
                        });
                    }
                }


                tOff +=
                    metaLen;

                continue;
            }


            /* =================================================
               SYSEX
            ================================================= */

            if(
                stat === 0xF0 ||
                stat === 0xF7
            ){

                const sV =
                    readVLQ(
                        v,
                        tOff
                    );


                tOff +=
                    sV.idx +
                    sV.val;

                continue;
            }


            /*
                Channel Messageでなければ無視
            */

            if(
                stat < 0x80 ||
                stat > 0xEF
            ){
                continue;
            }


            const mType =
                stat & 0xF0;

            const ch =
                stat & 15;


            /* =================================================
               Program Change
            ================================================= */

            if(
                mType === 0xC0
            ){

                if(
                    tOff < tEnd
                ){

                    programs[ch] =
                        v.getUint8(
                            tOff++
                        );
                }

                continue;
            }


            /* =================================================
               Channel Pressure
            ================================================= */

            if(
                mType === 0xD0
            ){

                tOff++;

                continue;
            }


            /*
                2byte data
            */

            if(
                tOff + 1 >= tEnd
            ){
                break;
            }


            const n =
                v.getUint8(
                    tOff++
                );

            const vel =
                v.getUint8(
                    tOff++
                );


            /* =================================================
               NOTE ON
            ================================================= */

            if(
                mType === 0x90 &&
                vel > 0
            ){

                const key =
                    ch * 128 + n;


                let stack =
                    act.get(key);


                if(
                    !stack
                ){

                    stack = [];

                    act.set(
                        key,
                        stack
                    );
                }


                stack.push({
                    tick:currentTick,
                    v:vel,
                    i:programs[ch],
                    c:ch
                });


                continue;
            }


            /* =================================================
               NOTE OFF
            ================================================= */

            if(
                mType === 0x80 ||
                (
                    mType === 0x90 &&
                    vel === 0
                )
            ){

                const key =
                    ch * 128 + n;


                const stack =
                    act.get(key);


                if(
                    stack &&
                    stack.length
                ){

                    /*
                        最新のNote Onを閉じる。
                    */

                    const a =
                        stack.pop();


                    const durTick =
                        currentTick -
                        a.tick;


                    if(
                        durTick > 0
                    ){

                        allNotesRaw.push({
                            m:n,
                            startTick:a.tick,
                            endTick:currentTick,
                            v:a.v,
                            i:a.i,
                            ch:a.c,
                            tr:t
                        });
                    }
                }


                continue;
            }


            /*
                CC / Pitch Bendなど
                再生に不要なイベントは
                巨大配列へ保存しない。

                これが軽量化にかなり効く。
            */
        }
    }


    /* =====================================================
       Tempoを整理
    ===================================================== */

    tempoEvents.sort(
        (a,b) =>
            a.tick -
            b.tick
    );


    /*
        元コードの

            tempoEvents.tick > 0

        は配列に対してtickを読んでいたため
        常にundefinedになっていました。

        tempoEvents[0]を正しく確認。
    */

    if(
        tempoEvents.length === 0 ||
        tempoEvents[0].tick > 0
    ){

        tempoEvents.unshift({
            tick:0,
            bpm:120
        });
    }


    /*
        同一tickのTempoをまとめる。
    */

    const tempos = [];


    for(
        let i = 0;
        i < tempoEvents.length;
        i++
    ){

        const e =
            tempoEvents[i];


        if(
            tempos.length &&
            tempos[
                tempos.length - 1
            ].tick === e.tick
        ){

            tempos[
                tempos.length - 1
            ].bpm =
                e.bpm;

        }else{

            tempos.push({
                tick:e.tick,
                bpm:e.bpm,
                sec:0
            });
        }
    }


    /* =====================================================
       Tempo Map
    ===================================================== */

    for(
        let i = 1;
        i < tempos.length;
        i++
    ){

        const prev =
            tempos[i - 1];

        const cur =
            tempos[i];


        cur.sec =
            prev.sec +
            (
                cur.tick -
                prev.tick
            ) *
            (
                60 /
                (
                    prev.bpm *
                    tDiv
                )
            );
    }


    /* =====================================================
       Tick -> 秒
    ===================================================== */

    function tickToSecond(tick){

        let low = 0;

        let high =
            tempos.length - 1;


        /*
            二分探索。

            元コードでは毎ノートごとに
            Tempo Map全体を最初から走査していた。

            BlackMIDIではここがかなり重くなる。
        */

        while(
            low < high
        ){

            const mid =
                (
                    low +
                    high +
                    1
                ) >> 1;


            if(
                tempos[mid].tick <= tick
            ){

                low =
                    mid;

            }else{

                high =
                    mid - 1;
            }
        }


        const tempo =
            tempos[low];


        return (
            tempo.sec +
            (
                tick -
                tempo.tick
            ) *
            (
                60 /
                (
                    tempo.bpm *
                    tDiv
                )
            )
        );
    }


    /* =====================================================
       秒に変換
    ===================================================== */

    const finalNotes =
        new Array(
            allNotesRaw.length
        );


    for(
        let i = 0;
        i < allNotesRaw.length;
        i++
    ){

        const n =
            allNotesRaw[i];


        const tSec =
            tickToSecond(
                n.startTick
            );


        const eSec =
            tickToSecond(
                n.endTick
            );


        finalNotes[i] = {
            m:n.m,
            t:tSec,
            d:Math.max(
                0.001,
                eSec - tSec
            ),
            v:n.v,
            i:n.i,
            ch:n.ch,
            tr:n.tr,
            p:false
        };
    }


    return finalNotes;
}


/* =========================================================
   発音ポインタ
========================================================= */

let audioPlaybackPointer = 0;


/* =========================================================
   MIDI読み込み
========================================================= */

fInp.addEventListener(
    'change',
    async (e) => {

        const fs =
            e.target.files;


        if(
            !fs ||
            fs.length === 0
        ){
            return;
        }


        const file =
            fs.item(0);


        showLog(
            "高速BlackMIDI解析中...: " +
            file.name
        );


        initAudioEngine();


        try{

            const buf =
                await file.arrayBuffer();


            /*
                巨大ファイルの場合、
                ファイル読み込み直後に一度ブラウザへ
               処理を返す。
            */

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        0
                    )
            );


            notes =
                parseMIDI(buf);


            /*
                時間順。

                parserは基本的にtrack順なので
                最後に全体を並べる。
            */

            notes.sort(
                (a,b) =>
                    a.t - b.t
            );


            isPlaying =
                false;


            pauseTime =
                0;


            audioPlaybackPointer =
                0;


            lastPlayTimes.fill(
                -999
            );


            pBtn.style.display =
                'block';


            pBtn.textContent =
                '▶ 再生';


            showLog(
                "読み込み成功! 総ノーツ数: " +
                notes.length.toLocaleString()
            );


            /*
                pフラグ初期化。
            */

            for(
                let i = 0;
                i < notes.length;
                i++
            ){

                notes[i].p =
                    false;
            }


            draw(0);


        }catch(err){

            console.error(err);


            showLog(
                "失敗: " +
                err.message
            );
        }
    }
);


/* =========================================================
   再生 / 一時停止
========================================================= */

pBtn.addEventListener(
    'click',
    () => {

        initAudioEngine();


        if(
            isPlaying
        ){

            /*
                現在位置を保存。
            */

            pauseTime =
                audioCtx.currentTime -
                startTime;


            isPlaying =
                false;


            pBtn.textContent =
                '▶ 再生';


            showLog(
                "一時停止"
            );


            /*
                現在鳴っている音を
                即座に大量停止せず、
                短く消す。
            */

            fadeOutAllVoices();


        }else{

            /*
                曲末なら最初から。
            */

            if(
                notes.length &&
                pauseTime >=
                getDuration()
            ){

                pauseTime = 0;

                audioPlaybackPointer = 0;

                for(
                    let i = 0;
                    i < notes.length;
                    i++
                ){

                    notes[i].p =
                        false;
                }
            }


            isPlaying =
                true;


            startTime =
                audioCtx.currentTime -
                pauseTime;


            pBtn.textContent =
                '再生中...';


            showLog(
                "再生中"
            );


            animate();
        }
    }
);


/* =========================================================
   曲の長さ
========================================================= */

let cachedDuration = 0;


function getDuration(){

    if(
        cachedDuration > 0
    ){
        return cachedDuration;
    }


    let max =
        0;


    /*
        spread禁止。
    */

    for(
        let i = 0;
        i < notes.length;
        i++
    ){

        const end =
            notes[i].t +
            notes[i].d;


        if(
            end > max
        ){
            max = end;
        }
    }


    cachedDuration =
        max;


    return max;
}


/* =========================================================
   全Voiceフェードアウト
========================================================= */

function fadeOutAllVoices(){

    if(
        !audioCtx
    ){
        return;
    }


    const now =
        audioCtx.currentTime;


    for(
        let i = 0;
        i < activeVoices.length;
        i++
    ){

        const v =
            activeVoices[i];


        try{

            v.gain.gain.cancelScheduledValues(
                now
            );

            v.gain.gain.setTargetAtTime(
                0,
                now,
                0.006
            );

            v.osc.stop(
                now + 0.035
            );

        }catch(e){}
    }


    activeVoices.length = 0;
}


/* =========================================================
   再生アニメーション
========================================================= */

function animate(){

    if(
        !isPlaying
    ){
        return;
    }


    const cTime =
        audioCtx.currentTime -
        startTime;


    /*
        少し先まで予約。

        元コードの50msを維持。
    */

    const lookAheadTime =
        cTime + 0.05;


    /*
        発音処理。

        一度通過したノートは
        二度と最初から探さない。
    */

    while(
        audioPlaybackPointer <
        notes.length
    ){

        const n =
            notes[
                audioPlaybackPointer
            ];


        if(
            n.t >
            lookAheadTime
        ){

            break;
        }


        if(
            !n.p
        ){

            /*
                現在時刻より前でも
                ノート終了前なら鳴らす。

                ただし大幅に遅れた場合は
               鳴らさない。
            */

            if(
                n.t + n.d >
                cTime
            ){

                playTone(
                    n.m,
                    n.d,
                    n.v,
                    n.ch,
                    n.i,
                    n.tr,
                    n.t
                );
            }


            n.p = true;
        }


        audioPlaybackPointer++;
    }


    cleanVoices();


    /*
        曲終了。
    */

    const duration =
        getDuration();


    if(
        cTime >= duration
    ){

        if(
            loopEnabled
        ){

            /*
                ループ。
            */

            fadeOutAllVoices();

            pauseTime = 0;

            audioPlaybackPointer = 0;


            for(
                let i = 0;
                i < notes.length;
                i++
            ){

                notes[i].p =
                    false;
            }


            startTime =
                audioCtx.currentTime;

        }else{

            isPlaying =
                false;


            pauseTime =
                duration;


            pBtn.textContent =
                '▶ 再生';


            showLog(
                "再生終了"
            );


            draw(duration);

            return;
        }
    }


    draw(cTime);


    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   二分探索
========================================================= */

function findFirstVisibleIndex(
    time
){

    let low = 0;

    let high =
        notes.length;


    while(
        low < high
    ){

        const mid =
            (
                low +
                high
            ) >> 1;


        if(
            notes[mid].t <
            time
        ){

            low =
                mid + 1;

        }else{

            high =
                mid;
        }
    }


    return low;
}


/* =========================================================
   描画
========================================================= */

function draw(cTime){

    const w =
        window.innerWidth;

    const h =
        window.innerHeight;


    const kW =
        w / NOTE_CNT;


    /*
        背景
    */

    ctx.fillStyle =
        '#000000';

    ctx.fillRect(
        0,
        0,
        w,
        h
    );


    if(
        notes.length === 0
    ){

        drawKeyboard(
            null,
            w,
            h,
            kW
        );

        return;
    }


    const viewMinTime =
        cTime - 2;


    const viewMaxTime =
        cTime +
        (
            kyY /
            SPEED
        );


    /*
        表示開始位置を
        二分探索。
    */

    const startIndex =
        findFirstVisibleIndex(
            viewMinTime
        );


    /*
        元コードの
        colorPathsオブジェクトを廃止。

        8色固定なので
        配列を最初から作っておく。
    */

    const paths =
        new Array(
            CLRS.length
        );


    for(
        let i = 0;
        i < CLRS.length;
        i++
    ){

        paths[i] = [];
    }


    const drumPaths = [];


    const hitX = [];
    const hitY = [];
    const hitW = [];
    const hitH = [];


    /*
        現在鳴っている鍵盤。

        128個固定配列なので
        Setを毎フレーム作らない。
    */

    const active =
        new Uint8Array(128);


    const activeColor =
        new Array(128);


    /*
        画面に入っているノートだけ描画。
    */

    for(
        let i = startIndex;
        i < notes.length;
        i++
    ){

        const n =
            notes[i];


        /*
            未来すぎるところまで行ったら終了。
        */

        if(
            n.t >
            viewMaxTime
        ){

            break;
        }


        if(
            n.m < MIN_NOTE ||
            n.m > MAX_NOTE
        ){

            continue;
        }


        const nEnd =
            n.t + n.d;


        if(
            nEnd <
            viewMinTime
        ){

            continue;
        }


        const x =
            (
                n.m -
                MIN_NOTE
            ) *
            kW;


        const y =
            kyY -
            (
                n.t -
                cTime
            ) *
            SPEED;


        const nH =
            n.d *
            SPEED;


        const xx =
            x + 1;


        const ww =
            Math.max(
                1,
                kW - 2
            );


        /*
            現在発音中
        */

        if(
            cTime >= n.t &&
            cTime <= nEnd
        ){

            active[n.m] =
                1;


            activeColor[n.m] =
                n.ch === 9
                    ? '#555555'
                    : CLRS[
                        n.tr %
                        CLRS.length
                    ];


            hitX.push(xx);
            hitY.push(y - nH);
            hitW.push(ww);
            hitH.push(nH);


        }else{

            if(
                n.ch === 9
            ){

                drumPaths.push({
                    x:xx,
                    y:y - nH,
                    w:ww,
                    h:nH
                });

            }else{

                paths[
                    n.tr %
                    CLRS.length
                ].push({
                    x:xx,
                    y:y - nH,
                    w:ww,
                    h:nH
                });
            }
        }
    }


    /*
        通常ノーツ描画
    */

    for(
        let cIdx = 0;
        cIdx < paths.length;
        cIdx++
    ){

        const arr =
            paths[cIdx];


        if(
            arr.length === 0
        ){
            continue;
        }


        ctx.fillStyle =
            CLRS[cIdx];


        ctx.beginPath();


        for(
            let i = 0;
            i < arr.length;
            i++
        ){

            const r =
                arr[i];


            ctx.rect(
                r.x,
                r.y,
                r.w,
                r.h
            );
        }


        ctx.fill();
    }


    /*
        ドラム
    */

    if(
        drumPaths.length
    ){

        ctx.fillStyle =
            '#555555';


        ctx.beginPath();


        for(
            let i = 0;
            i < drumPaths.length;
            i++
        ){

            const r =
                drumPaths[i];


            ctx.rect(
                r.x,
                r.y,
                r.w,
                r.h
            );
        }


        ctx.fill();
    }


    /*
        発音中ノート
    */

    if(
        hitX.length
    ){

        ctx.fillStyle =
            '#ffffff';


        ctx.beginPath();


        for(
            let i = 0;
            i < hitX.length;
            i++
        ){

            ctx.rect(
                hitX[i],
                hitY[i],
                hitW[i],
                hitH[i]
            );
        }


        ctx.fill();
    }


    /*
        鍵盤
    */

    drawKeyboard(
        active,
        w,
        h,
        kW,
        activeColor
    );
}


/* =========================================================
   鍵盤
========================================================= */

function drawKeyboard(
    active,
    w,
    h,
    kW,
    activeColor
){

    for(
        let i = 0;
        i < NOTE_CNT;
        i++
    ){

        const nId =
            MIN_NOTE + i;


        const x =
            i * kW;


        const rem =
            nId % 12;


        const isS =
            (
                rem === 1 ||
                rem === 3 ||
                rem === 6 ||
                rem === 8 ||
                rem === 10
            );


        if(
            active &&
            active[nId]
        ){

            ctx.fillStyle =
                activeColor[nId] ||
                '#ffffff';

        }else{

            ctx.fillStyle =
                isS
                    ? '#151515'
                    : '#ffffff';
        }


        ctx.fillRect(
            x,
            kyY,
            kW - 1,
            h - kyY
        );
    }


    /*
        鍵盤上端
    */

    ctx.strokeStyle =
        '#ff0055';

    ctx.lineWidth = 2;


    ctx.beginPath();

    ctx.moveTo(
        0,
        kyY
    );

    ctx.lineTo(
        w,
        kyY
    );

    ctx.stroke();
}


/* =========================================================
   キーボード操作
========================================================= */

window.addEventListener(
    'keydown',
    e => {

        /*
            入力中なら無視
        */

        if(
            e.target &&
            (
                e.target.tagName ===
                'INPUT' ||
                e.target.tagName ===
                'TEXTAREA'
            )
        ){

            return;
        }


        /*
            Space
        */

        if(
            e.code === 'Space'
        ){

            e.preventDefault();

            if(
                pBtn.style.display !==
                'none'
            ){

                pBtn.click();
            }
        }


        /*
            Esc
        */

        if(
            e.code === 'Escape'
        ){

            stopPlayback();
        }
    }
);


/* =========================================================
   停止
========================================================= */

function stopPlayback(){

    if(
        !notes.length
    ){
        return;
    }


    isPlaying =
        false;


    fadeOutAllVoices();


    pauseTime =
        0;


    audioPlaybackPointer =
        0;


    for(
        let i = 0;
        i < notes.length;
        i++
    ){

        notes[i].p =
            false;
    }


    pBtn.textContent =
        '▶ 再生';


    showLog(
        "停止"
    );


    draw(0);
}


/* =========================================================
   ダブルクリックで停止
========================================================= */

pBtn.addEventListener(
    'dblclick',
    e => {

        e.preventDefault();

        stopPlayback();
    }
);


/* =========================================================
   初期状態
========================================================= */

showLog(
    "BlackMIDI対応。ファイルを選択してください。"
);

</script>
